port: 7880

rtc:
  tcp_port: 7881
  # Single-port UDP mux is intentional for Phase 1 (one concurrent console call).
  # Widen this range before expecting multiple simultaneous duplex rooms.
  port_range_start: 7882
  port_range_end: 7882
  use_external_ip: true

# Tear empty rooms down promptly so an abandoned agent participant (or leaked
# JWT) cannot keep a room alive indefinitely after the principal leaves.
room:
  empty_timeout: 30
  departure_timeout: 20

keys:
  LIVEKIT_API_KEY_PLACEHOLDER: LIVEKIT_API_SECRET_PLACEHOLDER

logging:
  level: info
