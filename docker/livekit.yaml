port: 7880

rtc:
  tcp_port: 7881
  # Single-port UDP mux is intentional for Phase 1 (one concurrent console call).
  # Widen (or switch to a port range) before expecting multiple simultaneous rooms.
  udp_port: 7882
  use_external_ip: true

# Tear empty rooms down promptly after the last participant leaves. This is
# cleanup only — it does not revoke JWTs. A leaked token remains valid until its
# TTL and LiveKit may auto-create the room on rejoin within that window.
room:
  empty_timeout: 30
  departure_timeout: 20

keys:
  LIVEKIT_API_KEY_PLACEHOLDER: LIVEKIT_API_SECRET_PLACEHOLDER

logging:
  level: info
