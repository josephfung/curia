<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A6B5E" />
    <title>Curia</title>
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main>
      <img src="/icons/curia-192.png" alt="Curia" />
      <h1>Can't reach your Curia</h1>
      <p>The phone can see this app, but it can't reach the Curia that sent you here. Check that you're on a network that can open it, then try again.</p>
      <p id="offline-host"></p>
      <button type="button" id="offline-retry">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
