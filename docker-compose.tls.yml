# Optional HTTPS overlay. Enable by adding this file to COMPOSE_FILE in .env
# (install.sh does this for you when you choose the public-domain option):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
# Requires DOMAIN set and an A record pointing at this host (ports 80/443 open).
# LiveKit voice: the shipped Caddyfile routes call signaling (/rtc*, wss://) to
# livekit:7880. Media does not pass through Caddy: still expose 7881/tcp (WebRTC
# TCP fallback) and 7882/udp (media) directly through the firewall/NAT —
# otherwise calls connect with no audio.
# Because Caddy publishes /rtc*, LiveKit fails closed here: with LIVEKIT_COMMAND
# unset this overlay runs the keyless shipped config instead of the base file's
# --dev fallback (public devkey/secret), so LiveKit refuses to start until
# LIVEKIT_KEYS holds real keys. Only the command fallback changes; the base
# file's profile, mounts, environment and ports still apply.
services:
  livekit:
    command: ${LIVEKIT_COMMAND:---config /etc/livekit.yaml}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      curia:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
