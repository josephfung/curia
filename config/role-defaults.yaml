# Role-based permission defaults.
# Each role defines which permissions are granted and denied by default.
# Per-contact overrides (in contact_auth_overrides table) take precedence.
#
# Role lookup is case-insensitive: 'Spouse' matches the 'spouse' key.
# When a contact's free-text role (e.g. 'Sister', 'Head Instructor, Kicks') has no
# config match, the system falls back to trust_level_defaults keyed by the contact's
# trust_level ('ceo'|'high'|'medium'|'low'). Unknown roles with no trust_level
# fall back to the 'unknown' entry below.
#
# This means trust_level is the primary authorization primitive for confirmed contacts
# whose roles were set as free-text descriptions by the coordinator LLM.

roles:
  ceo:
    description: "Chief Executive Officer — full access"
    default_permissions:
      - "*"
    default_deny: []

  cfo:
    description: "Chief Financial Officer"
    default_permissions:
      - view_financial_reports
      - view_board_materials
      - request_action_items
      - schedule_meetings
    default_deny:
      - send_on_behalf
      - see_personal_calendar

  board_member:
    description: "Board of Directors member"
    default_permissions:
      - view_board_materials
      - request_meeting_notes
    default_deny:
      - view_financial_reports
      - access_internal_docs

  direct_report:
    description: "Direct report to CEO"
    default_permissions:
      - schedule_meetings
      - request_action_items
    default_deny:
      - view_board_materials
      - view_financial_reports

  advisor:
    description: "External advisor (legal, financial, strategic)"
    default_permissions:
      - schedule_meetings
    default_deny:
      - access_internal_docs
      - send_on_behalf

  investor:
    description: "Investor or board observer"
    default_permissions:
      - view_board_materials
      - request_meeting_notes
    default_deny:
      - view_financial_reports
      - access_internal_docs

  spouse:
    description: "Spouse or life partner"
    default_permissions:
      - see_personal_calendar
      - book_travel
      - manage_personal_appointments
    default_deny:
      - view_financial_reports
      - access_internal_docs

  family_member:
    description: "Family member"
    default_permissions:
      - see_personal_calendar
    default_deny:
      - "*"

  unknown:
    description: "Fallback for contacts with no assigned role"
    default_permissions: []
    default_deny:
      - "*"

# Tier defaults — fallback when a contact's role has no config match.
# Keyed by ContactTier value. A contact with tier='trusted' and role='Sister'
# (no 'sister' key in roles above) will use the 'trusted' entry below.
tier_defaults:
  principal:
    description: "Principal tier — full access"
    default_permissions:
      - "*"
    default_deny: []

  trusted:
    description: "Trusted tier — elevated access (family, close personal)"
    default_permissions:
      - see_personal_calendar
      - book_travel
      - manage_personal_appointments
      - schedule_meetings
      - request_action_items
      - request_meeting_notes
    default_deny:
      - view_financial_reports
      - view_board_materials
      - access_internal_docs

  known:
    description: "Known tier — standard confirmed contact"
    default_permissions:
      - schedule_meetings
      - request_action_items
    default_deny:
      - view_financial_reports
      - view_board_materials
      - access_internal_docs

  unknown:
    description: "Unknown tier — unconfirmed contact"
    default_permissions: []
    default_deny:
      - "*"
