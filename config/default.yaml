# Capability-tier model routing (ADR-014).
# Agents declare a tier (fast | standard | powerful) — this config maps each
# tier to a concrete model. The provider is resolved from the model registry.
# Change these values to upgrade all agents of a tier in one place.
model_routing:
  tiers:
    fast:
      model: claude-haiku-4-5
    standard:
      model: claude-sonnet-4-6
    powerful:
      model: claude-opus-4-6
  default_tier: standard

channels:
  cli:
    enabled: true
  max_message_bytes: 102400   # 100KB — inbound messages exceeding this are rejected before routing
  # Signal / Slack channel activation is controlled by vault credentials + the channel
  # registry (Settings → Channels), not this file. Trust policies live in channel-trust.yaml.
  slack:
    # Optional allowlist of Slack channel ids (C…) for @mentions. Empty = all channels
    # the bot is a member of. DMs are never filtered by this list.
    allowed_channel_ids: []
  voice:
    # Optional concrete model for voice turns. Empty = existing fast tier.
    model: ""
    # LiveKit RoomService base URL (server→LiveKit DeleteRoom / admin). Distinct from
    # the browser signaling URL in Settings → Channels → Voice (wss://…). Compose
    # default reaches the `livekit` service on the internal network. Host-side
    # `pnpm dev` with published ports: override to http://localhost:7880 in local.yaml.
    livekit_management_url: "http://livekit:7880"

# Rate limits for automatic contact creation from email participants.
# Prevents spam campaigns from flooding the contacts table.
# Both limits are anti-flood guardrails — normal business email should never hit them.
contact_creation_limits:
  max_per_message: 10    # max new contacts created from a single email's participant list
  max_per_hour: 100      # max new contacts created per hour, per email account

browser:
  # How long a browser session stays alive after its last action (ms). Long enough that a
  # multi-page form (e.g. a 60-question survey) isn't evicted mid-flow between agent turns —
  # eviction orphans every element ref the agent still holds.
  sessionTtlMs: 1800000   # 30 minutes
  # How often the session sweep runs to close expired sessions (ms).
  sweepIntervalMs: 120000  # 2 minutes
  # Persistent profile directory. Empty → ${HOME}/.curia/browser-profile.
  # Mount this on a volume in production so logins survive restarts.
  profileDir: ""
  # Browser channel: "chrome" for real Chrome (must be installed in the image),
  # empty for the bundled Playwright Chromium.
  channel: ""
  # Optional egress proxy for browser traffic. Full URL or bare host:port
  # (e.g. "http://browser-proxy:8888"). Empty → direct egress. Set this per-deployment
  # to route the browser through a residential exit and avoid a datacenter-IP bot signal.
  proxy: ""
  # Context locale (BCP 47).
  locale: "en-US"

agents:
  coordinator:
    config_path: agents/coordinator.yaml

dispatch:
  # Milliseconds of inactivity after the last agent response before a conversation.checkpoint
  # event fires and background memory extraction (extract-relationships, etc.) runs.
  conversationCheckpointDebounceMs: 600000   # 10 minutes

  # In-memory flood protection. Excess messages are dropped silently and
  # audit-logged as message.rejected. Changes take effect on restart.
  rate_limit:
    window_ms: 60000        # 1-minute fixed window
    max_per_sender: 15      # messages per sender per window (15 allows for an active chat burst)
    max_global: 100         # total messages per window across all senders

workingMemory:
  # TTL for working memory turns. Rows are expired by DreamEngine's nightly purge
  # pass (DELETE WHERE expires_at < now()). The idx_wm_expires partial index makes
  # this efficient. 30 days is long enough that re-opening a conversation after a
  # week still has full context; tune downward for high-volume deployments.
  ttlDays: 30

  # Rolling context summarization (spec §01-memory-system.md).
  # When the active turn count for a conversation exceeds `threshold`, the oldest
  # (count - keepWindow) turns are condensed into a synthetic summary turn via an
  # LLM call and archived. Active context assembly sees the summary instead of the
  # archived originals, preventing silent context-window overflow on long tasks.
  #
  # Summarization is best-effort — a failed LLM call is logged at error level and
  # skipped; the turn is still written and the next add() will retry automatically.
  #
  # Constraints: threshold must be >= 2, keepWindow must be >= 1, keepWindow < threshold.
  summarization:
    threshold: 20   # turns that trigger a summarization pass
    keepWindow: 10  # most-recent turns to retain as active after summarization

documentWorkspace:
  # Inactivity TTL for ephemeral `/scratch/<conversation-id>/…` documents. DreamEngine's
  # nightly pass soft-deletes (sets archived_at) on live scratch rows whose updated_at is
  # older than this many days. Omit `ttl_days` in frontmatter to inherit this default;
  # set `ttl_days: 0` on a scratch doc to opt out. `/projects/…` documents are never
  # auto-archived.
  scratchTtlDays: 7
  # When a planned parent completes, promote its curated deliverable into the KG via
  # extract-facts / extract-relationships, then archive the project's workspace docs.
  # Per-task override: error_budget.kg_promotion: false skips promotion for that task.
  kgPromotion:
    enabled: true
    maxFacts: 50
    maxRelationships: 50

skillOutput:
  # Maximum character length of a sanitized skill result before truncation.
  # Skills that return more than this (search results, page crawls, long calendar
  # lists) will have their output clipped and a truncation note appended.
  # Raise this if you routinely hit the limit on large-payload skills; lower it
  # to reduce LLM context pressure on installations with many concurrent agents.
  maxLength: 200000  # 200k characters (~50k tokens at 4 chars/token)

# Delegate skill configuration.
# Controls the default timeout for specialist agent delegations when no explicit
# timeout_ms is provided by the caller or runtime. Deployment-specific model
# latency (e.g. switching the standard tier to a higher-latency model) can be
# accommodated here without a code change or release.
# Override in config/local.yaml to match your deployment's model latency.
delegate:
  defaultTimeoutMs: 90000   # 90s — appropriate for interactive delegations with Sonnet-class models

# Scheduler configuration.
# Controls runtime defaults for the scheduler watchdog and recovery logic.
scheduler:
  # Assumed task duration for scheduled jobs that declare no expectedDurationSeconds.
  # Used by the watchdog to compute the recovery timeout (LEAST(expected × 7.5, expected + 3600)).
  # Raise this if you run long-running scheduled jobs without explicit duration hints.
  defaultExpectedDurationSeconds: 600  # 10 minutes

health:
  # Thresholds for time-based liveness checks
  liveness:
    email_stall_factor: 3      # fail if last poll older than N × pollingIntervalMs
    scheduler_max_tick_s: 120  # fail if scheduler watchdog last ticked > N seconds ago

  # Cron schedule for the daily credential/dependency canary job (server local time)
  canary_schedule: "0 6 * * *"

  # Heartbeat URLs — GET on successful canary (Better Stack, Healthchecks.io, Cronitor, etc.)
  # LLM keys are tier-named so they survive a model_routing provider swap.
  # Leave empty to skip the ping (canary still runs and logs).
  heartbeats:
    llm_fast: ""
    llm_standard: ""
    llm_powerful: ""
    embeddings: ""
    image_gen: ""
    nylas: ""
    nylas_calendar: ""
    signal: ""
    google_workspace: ""
    tavily: ""

# Context bridge TTL configuration.
# Controls how long outbound context entries remain active before automatic expiry.
# Auto-registered entries (when the caller doesn't pass explicit context_bridge metadata)
# use defaultExpiryHours. Entries with explicit delegation hints use explicitExpiryHours.
# A caller-specified expires_in_hours in the context_bridge JSON always overrides these.
contextBridge:
  defaultExpiryHours: 6      # auto-registered entries (proactive sends without metadata)
  explicitExpiryHours: 24    # entries with explicit context_bridge JSON

# Meeting debrief agent configuration (spec §17-meeting-debrief.md).
# Controls the proactive debrief prompt sent after external meetings end.
# The agent itself is defined in agents/meeting-debrief.yaml.
debrief:
  channel: signal                # channel for debrief prompts (signal | email)
  reminderDelayMinutes: 120      # minutes before a reminder is sent for unanswered debriefs
  contextBridgeTtlHours: 48      # TTL for context bridge entries linking replies to the debrief agent

security:
  # Additional prompt-injection regex patterns beyond the built-in defaults.
  # Each entry: { regex: "...", label: "human-readable name" } — case-insensitive.
  # ⚠️ Avoid unbounded nested quantifiers (e.g. (a+)+) — ReDoS risk on the hot path.
  # Changes take effect on restart.
  extra_injection_patterns: []

  # Message trust score computation weights (spec §06-audit-and-security.md).
  # messageTrustScore = (channelWeight × channelNormalized) + (contactWeight × contactConfidence)
  #                     − (maxRiskPenalty × injectionRiskScore), clamped to [0.0, 1.0]
  #
  # Channel trust normalized weights: high=1.0, medium=0.6, low=0.3
  trust_score:
    channel_weight: 0.4
    contact_weight: 0.4
    max_risk_penalty: 0.2

  # Action threshold values compiled into the ${security_context_block} prompt injection.
  # The coordinator checks messageTrustScore against these thresholds before acting
  # on behalf of a sender. Sourced from config at startup — changes take effect on restart.
  # All values must be in [0.0, 1.0]. Startup fails if this block is absent or malformed.
  trust_thresholds:
    information_query: 0.2   # answering questions, summaries
    scheduling: 0.5           # calendar changes, meeting requests
    data_export: 0.8          # sharing files, forwarding records
    financial: 0.8            # payments, financial commitments

# Bulk export controls (#201) — item-count threshold, destination allowlisting, and
# sensitivity ceiling for attachments (OutboundGateway) and MCP Drive/Sheets exports.
# Destination allowlisting applies only to confidential+ exports; internal/public
# Workspace exports proceed without CEO approval unless another control fires.
exportControls:
  confidentialThreshold: 10
  allowedDestinations:
    driveFolderIds: []
    urls: []
    filePaths: []

pii:
  # Additional PII patterns to scrub from LLM-facing error strings.
  # Each entry: { regex: "...", replacement: "[PLACEHOLDER]" } — gi flags applied.
  # ⚠️ Avoid unbounded nested quantifiers (e.g. (a+)+) — ReDoS risk.
  # Changes take effect on restart.
  extra_patterns: []

  # Outbound PII redaction policy for channel messages (email, Signal).
  # default: 'block' — all detected PII is redacted unless explicitly allowed per channel.
  # Principal bypass is handled structurally (ceoContactId UUID match at startup).
  outbound_redaction:
    enabled: true
    default: block
    channel_policies:
      email:
        allow: [email]         # email addresses are fine in email replies
      signal:
        allow: []              # everything blocked for Signal (except CEO)

# Intent drift detection (spec §06-audit-and-security.md — Intent Drift Detection).
# After each burst of a persistent scheduled task, the LLM compares the current
# task_payload against the original intent_anchor. If the task has drifted
# significantly with sufficient confidence, the job is paused and the CEO is notified.
#
# minConfidenceToPause controls the sensitivity:
#   "high"   — pause only on egregious, unambiguous deviations (default; fewest false positives)
#   "medium" — pause on probable deviations; some false positives expected
#   "low"    — pause whenever any drift is detected regardless of LLM confidence
#
# checkEveryNBursts: 1 checks on every burst. Set higher to reduce LLM call frequency
# for jobs that run very frequently and where occasional missed checks are acceptable.
#
# TODO: When multi-model support is added, add a provider field here so the drift
# judge can use a cheaper/faster model independently of the coordinator.
intentDrift:
  enabled: true
  checkEveryNBursts: 1
  minConfidenceToPause: high

# Outbound content filter — Stage 2 LLM-as-judge (issue #547, spec 15).
# Stage 1 (deterministic rules) always runs and has no config. Stage 2 is a
# single-purpose audience-leak judge: it blocks outbound messages that leak
# internal monologue, system/agent status, or side-channel notes ("To the CEO: ...")
# to a mixed audience (any non-principal recipient on the message). It is SKIPPED
# when the principal is the SOLE recipient (private channel).
filter:
  llmJudge:
    enabled: true
    # Recommended: use a different vendor/family than the agent tiers for model diversity
    # (an attack tuned for the coordinator should not also fool the reviewer).
    model: claude-haiku-4-5
    timeout_ms: 5000
    failMode: split   # split (default) | open | closed — see src/config.ts

# Escalation-line policy judge — classifies outbound disclosures and proposed actions,
# maps tier × class → allow/escalate. Fail-closed: timeout/error → escalate.
# Recommended: use a different model family than the coordinator (model diversity).
escalation:
  judge:
    enabled: true
    model: claude-haiku-4-5
    timeout_ms: 5000

# Audit log hardening (spec 10 / #1383).
# llm_call_archive stores redacted full prompts/responses keyed to llm.call rows.
# Kill-switch (`enabled: false`) stops new archive writes immediately; hot
# retention TTL is enforced by DreamEngine's nightly decay pass (DELETE older rows).
# Encryption-at-rest for this table is a tracked follow-up — treat the store as
# plaintext JSONB with best-effort redaction until then.
audit:
  llmCallArchive:
    enabled: true
    hotRetentionDays: 90

# Dream engine — background knowledge graph maintenance (issue #27).
# The decay pass runs on a configurable interval and reduces the confidence of
# slow_decay and fast_decay nodes/edges using an exponential half-life model.
# When confidence drops to or below archiveThreshold, the row is soft-deleted
# (archived_at is set); it no longer appears in queries but is retained for audit.
#
# halfLifeDays: the number of days for a fact's confidence to halve.
#   permanent: null — these nodes are never touched by the decay pass.
#   slow_decay: 180  — employer, residence; reliable for months/years.
#   fast_decay: 21   — coffee preference, current focus; unreliable after weeks.
dreaming:
  decay:
    intervalMs: 86400000     # daily
    archiveThreshold: 0.05
    halfLifeDays:
      permanent: null
      slow_decay: 180
      fast_decay: 21
    # Decay warning (#280): warn important nodes before archiving.
    # A node is "important" if it has high sensitivity (confidential/restricted)
    # OR high connectivity (edge count >= p95 of all nodes, floor 5).
    edgeCountPercentile: 0.95  # top 5% by edge count triggers a warning
    edgeCountFloor: 5           # minimum edge count threshold regardless of percentile
    warnHoldBackDays: 7         # days to hold a warned node before archiving anyway

  # Autonomy scoring — background Phase 3 auto-adjustment (issue #148).
  # Runs daily alongside the decay pass. Scores completed actions on three
  # dimensions (Competence, Commitment, Compatibility), then nudges the
  # autonomy score ±5 via a delta formula.
  autonomy_scoring:
    intervalMs: 86400000          # daily (same cadence as decay)
    model_tier: fast              # tier for the LLM judge (resolved via ModelRouter)
    batchSize: 50                 # max rows scored per pass
    minScoredActions: 30          # minimum before any adjustment fires
    halfLifeDays: 30              # time-decay half-life for weighting
    weakExpiredWeight: 0.3        # reduced weight for 'expired' compatibility signal
    ceoCooldownDays: 7            # days after CEO set-autonomy before auto-adjust resumes
    errorRateThreshold: 0.20      # competence error rate that blocks score increases

# Sensitivity classification rules for KG nodes (issue #200).
# Rules are evaluated in descending sensitivity order — 'restricted' rules are
# checked before 'confidential', so the most protective rule always wins.
# Add patterns in lowercase; matching is case-insensitive substring search across
# the node label and all string property values.
#
# Operator-overridable via config/local.yaml (#1369). Merge semantics are
# replace, not extend, like every other array in this config: a
# `sensitivity_rules` list in local.yaml REPLACES this entire list rather than
# adding to it. To customize, copy the rules you want to keep from here into
# local.yaml alongside your additions.
sensitivity_rules:
  # Credentials — blocked from bulk export entirely
  - category: credentials
    sensitivity: restricted
    patterns:
      - password
      - api key
      - api_key
      - secret key
      - private key
      - access token
      - credential
      - ssh key
      - client secret

  # Board-level materials — blocked from bulk export
  - category: board
    sensitivity: restricted
    patterns:
      - board meeting
      - board decision
      - board of directors
      - shareholder
      - equity grant
      - executive compensation
      - option grant
      - cap table

  # Litigation — blocked from bulk export
  - category: litigation
    sensitivity: restricted
    patterns:
      - lawsuit
      - litigation
      - legal hold
      - court order
      - subpoena
      - deposition
      - opposing counsel
      - legal dispute

  # Corporate strategy — blocked from bulk export
  - category: strategy
    sensitivity: restricted
    patterns:
      - acquisition
      - divestiture
      - investment banker
      - ipo
      - merger
      - strategic review
      - takeover
      - going public

  # Financial data — requires approval to export
  - category: financial
    sensitivity: confidential
    patterns:
      - salary
      - compensation
      - budget
      - revenue
      - invoice
      - payment
      - profit
      - loss
      - financial statement
      - bank account
      - payroll
      - expense report
      - annual report

  # Contracts and legal agreements — requires approval to export
  - category: contract
    sensitivity: confidential
    patterns:
      - contract
      - nda
      - non-disclosure
      - statement of work
      - sow
      - master service agreement
      - msa
      - agreement signed
      - binding agreement

  # HR matters — requires approval to export
  - category: hr
    sensitivity: confidential
    patterns:
      - performance review
      - performance improvement plan
      - pip
      - termination
      - resignation
      - headcount
      - layoff
      - reduction in force
      - rif
      - compensation band
      - hiring plan
      - offer letter

  # Personal identifiers — requires approval to export
  - category: personal
    sensitivity: confidential
    patterns:
      - sin number
      - social insurance
      - ssn
      - social security
      - passport number
      - date of birth
      - health condition
      - medical record
      - home address
      - personal phone

# Autonomous task execution — BacklogHeartbeat tuning (design 2026-06-04 §3, §9.1).
tasks:
  heartbeatIntervalMinutes: 60
  heartbeatMaxWakesPerTick: 5
  idleThresholdHours: 4
  staleWaitThresholdHours: 48
  # Seconds after a paused resumable task before its self-continuation wake fires.
  # Default 30s loops iterate leaves promptly (seconds → low minutes) instead of waiting
  # for the BacklogHeartbeat (heartbeatIntervalMinutes, typically 60) or its idle
  # threshold (idleThresholdHours, typically 4). At most one pending wake per task —
  # a lost continuation is re-surfaced by the heartbeat once idleThresholdHours elapses.
  resumableContinuationSeconds: 30
  # Progress-based circuit breaker for resumable iterate leaves (#1176).
  # Per-task error_budget may override any key (max_stalls, max_iterations,
  # max_wallclock_hours, max_cost_usd). A breach fails the task and escalates
  # via the backlog-surfacing path instead of looping silently.
  resumableCeilings:
    maxStalls: 3          # K — consecutive paused slices with no cursor/done advance
    maxIterations: 100    # hard cap on continuation slices
    maxWallclockHours: 24 # hours from first processed pause
    maxCostUsd: 10.00     # aggregate LLM spend across slices (USD)
    maxPlanDepth: 3       # max plan-decomposition depth per subtree (#1266)
    maxReplansPerSubtree: 5  # max adaptive re-plans per planned task (#1266)
    blockedStepHours: 48  # blocked child hours before divergence signal (#1266)
    throughputDivergenceRatio: 0.5  # measured/implied pace ratio floor (#1266)

# Autonomy authorization (#1125). The bypass ladder governs how much LINEAGE standing a
# heartbeat-woken/derived task inherits at the live autonomy score. The score can only ever
# DOWNGRADE inherited standing (woken/derived → propose-only at low trust), never grant it.
#   < same_task        : woken & derived → downgrade to agent (propose-only)
#   same_task–derived  : same-task heartbeat wake keeps lineage; derived child → agent
#   >= derived_child   : same-task wake AND derived child keep lineage standing
# See docs/specs/14-autonomy-engine.md (Effective standing / bypass ladder).
autonomy:
  bypass_ladder:
    same_task: 70      # posture B floor — must not drop below 60
    derived_child: 90  # posture D floor

  # Emoji → approval intent for inbound.reaction (#1479). Channel-agnostic —
  # Slack shortcodes and unicode glyphs both listed. Adapters never map intent.
  # Skin tones / VS16 are stripped before matching (see normalizeReactionEmoji).
  reaction_intents:
    approve:
      - thumbsup
      - "+1"
      - white_check_mark
      - heavy_check_mark
      - ok_hand
      - raised_hands
      - "100"
      - ok
      - "👍"
      - "✅"
      - "✔"
      - "✔️"
      - "👌"
      - "🙌"
      - "💯"
      - "🆗"
    reject:
      - thumbsdown
      - "-1"
      - x
      - no_entry
      - no_entry_sign
      - person_gesturing_no
      - "👎"
      - "❌"
      - "🚫"
      - "⛔"
      - "🙅"
