# MCP server configuration for Curia.
#
# Each entry under `servers` is an MCP server that Curia connects to at
# startup. Tools discovered via tools/list are registered in the skill
# registry alongside local skills — agents cannot tell them apart.
#
# Fields (all servers):
#   name         Unique identifier used in logs and error messages.
#   transport    "stdio" (spawn a local process) or "sse" (HTTP MCP endpoint).
#   action_risk  Required. Applied to all tools from this server.
#                none | low | medium | high | critical (or integer 0–100).
#   sensitivity  Optional. "normal" (default) or "elevated" (CEO-only).
#   timeout_ms   Optional. Per-invocation timeout in ms. Default: 30000.
#   fixed_inputs Optional. Constant parameter values injected into every tool call.
#                Keys are parameter names; values are literal strings or "env:VAR"
#                references. Listed parameters are stripped from the tool schema —
#                agents never see them. Use for deployment constants like account
#                identity that should not be in the agent reasoning layer.
#
# stdio-only fields:
#   command      Executable to spawn (e.g. "npx", "node").
#   args         Command-line arguments array.
#   env          Extra env vars merged on top of process.env for the child.
#
# sse-only fields:
#   url          HTTP MCP endpoint URL (uses StreamableHTTPClientTransport).
#   headers      HTTP headers sent with every request — useful for auth.
#                Values are literal strings; no env-var interpolation is done.
#                Store tokens in .env and inject via a startup wrapper if needed.
#                See docs/dev/google-drive.md for the recommended pattern.
#
# Example (Google-hosted MCP server, when available):
#
# servers:
#   - name: google-workspace
#     transport: sse
#     url: https://workspaceapis.googleapis.com/mcp   # confirm URL at launch
#     action_risk: low
#     headers:
#       Authorization: "Bearer <token>"   # generate at startup; see runbook
#
# See docs/dev/google-drive.md for setup instructions and the path forward
# for Google Drive / Workspace once Google ships their hosted MCP server.

servers:
  # Community Google Workspace MCP server (taylorwilsdon/google_workspace_mcp).
  # Covers Drive, Sheets, Docs, Gmail, Calendar, and more via OAuth 2.0 as Curia's
  # Gmail user. The "complete" tier is required for load-bearing Sheets tools:
  # create_sheet (new tab) and append_table_rows are both in the complete tier —
  # they were not promoted to extended in workspace-mcp's tool_tiers.yaml.
  #
  # Secrets are declared in the `secrets:` block and resolved from the encrypted
  # vault at spawn time. The `secrets:` list defines which credentials are required,
  # and how they are injected into the process:
  #   - `key:` vault key name (e.g. google_oauth_client_id)
  #   - `label:` human-readable field label for the web console
  #   - `required:` whether this secret must be present (if false, missing is OK)
  #   - `secret:` whether the value is sensitive (should be masked in the web console)
  #   - `inject:` how to pass it to the process:
  #       - `env: VAR_NAME` → set as environment variable
  #       - `fixed_input: tool_parameter_name` → inject into tool call as fixed_inputs
  #
  # A missing required secret skips this whole server. Only declared keys are passed
  # to the subprocess (plus a safe base set: PATH, HOME, USER, etc.). This enforces
  # least-privilege: DB_PASSWORD, ANTHROPIC_API_KEY, etc. never reach the third-party
  # process.
  - name: google-workspace
    transport: stdio
    command: uvx
    args:
      - workspace-mcp
      - --tool-tier
      - complete
    secrets:
      - key: google_oauth_client_id
        label: "Google OAuth client ID"
        required: true
        secret: false
        inject:
          env: GOOGLE_OAUTH_CLIENT_ID
      - key: google_oauth_client_secret
        label: "Google OAuth client secret"
        required: true
        secret: true
        inject:
          env: GOOGLE_OAUTH_CLIENT_SECRET
      - key: curia_google_email
        label: "Curia Google account email"
        required: true
        secret: false
        inject:
          fixed_input: user_google_email
    env:
      # Allow the workspace-mcp subprocess to read files from the TempFileStore
      # directory. Without this, create_drive_file rejects file:// URLs pointing
      # to /run/curia-tempfiles/ because validate_file_path only allows reads
      # from its own STORAGE_DIR by default.
      ALLOWED_FILE_DIRS: "/run/curia-tempfiles"
    action_risk: low
    sensitivity: normal
    timeout_ms: 60000
