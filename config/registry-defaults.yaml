# Trusted, in-repo list of tools/agents/skills enabled by default on a FRESH install.
# NOT read from individual manifests (which are attacker-controlled on upload) —
# this file ships with the codebase. Reconciliation enrolls these as enabled ONLY
# when no registry row already exists (it never overrides an admin's choice).
#
# The existing production deployment was migrated by a one-shot backfill script
# (now removed) that enrolled all on-disk items as enabled.
#
# MCP-backed tools (create_doc, search_drive_files, etc.) are NOT listed here —
# they are loaded by loadMcpServers and are not on-disk ToolDiscovery items.
#
# skills: — Phase 2 bundles (SKILL.md). Member tools still enroll via tools:.
skills:
  - tasks
  - documents
  - calendar
  # calendar skill may be enabled while calendar-* tools stay off until credentials
  # are configured (same pattern as the calendar agent).
  # NOTE: tasks = heartbeat + task-* tools; documents = doc-* workspace (pin both for
  #        the historical enable_task_management surface).
tools:
  - tool-registry
  - skill-activate
  # Core communication
  - email-send
  - email-reply
  - email-archive
  - email-list
  - email-get
  - email-download-attachment
  - email-draft-save
  - email-label
  - email-list-folders
  - email-create-folder
  - email-mark-read
  - send-draft
  - signal-send
  # Memory + knowledge
  - memory-query
  - memory-store
  - memory-confirm
  - entity-context
  # Scheduling
  - scheduler-create
  - scheduler-list
  - scheduler-cancel
  - scheduler-update
  - scheduler-report
  # Contacts
  - contact-create
  - contact-find-duplicates
  - contact-grant-permission
  - contact-link-identity
  - contact-list
  - contact-lookup
  - contact-merge
  - contact-register
  - contact-rename
  - contact-revoke-permission
  - contact-set-identity-status
  - contact-unlink-identity
  - contact-update
  # Tasks
  - checkpoint
  - plan
  - task-create
  - task-list
  - task-complete
  - task-update
  # Config + identity
  - config-store
  - doc-list
  - doc-read
  - doc-search
  - doc-write
  - executive-profile-get
  - executive-profile-update
  - behavioral-preferences-update
  # Utility
  - date-resolve
  - context-bridge-release
  - decay-warnings-list
  - delegate
  - file-parse
  - request-clarification
  - bullpen
  - web-fetch
  - web-browser
  - drive-download-file
  - image-generate
  # Autonomy
  - get-autonomy
  - set-autonomy
  - approve-action
  - deny-action
  - dismiss-action
  - list-pending-actions
  - activity-log
  - approval-expiry-sweep
  # NOTE: diagnostics skills (audit-query, audit-trace, ops-lookup) excluded — they
  #        read internal audit + operational state and are the principal-only
  #        diagnostics agent's toolset. Opt-in: enable them alongside the diagnostics
  #        agent (Settings → Skills), not on a fresh install.
  # NOTE: web-search excluded — gated by install.requires_secrets: [tavily_api_key].
  #        Stays admin-enabled: an operator provisions the Tavily key in the console
  #        (Settings → Skills → web-search), which lifts the gate and lets them install/enable it.
  # NOTE: calendar-* excluded — require Google Calendar credentials; enable after calendar setup
  # NOTE: ceo-inbox-* excluded — companion to the ceo-inbox agent; enable alongside it.
  #        The email-observation-learning companions (voice-learn, task-completion-from-sent,
  #        list-learning-digest, resolve-learning-digest) are likewise excluded and must be
  #        enabled alongside ceo-inbox — even though list/resolve are pinned to the coordinator,
  #        they only produce output once the ceo-inbox observer subsystem is running.
  # NOTE: KG skills (extract-facts, extract-relationships, query-relationships, delete-relationship)
  #        excluded — require OpenAI embeddings
agents:
  - coordinator
  - setup-wizard       # required for onboarding on a fresh install
  - contacts
  - research-analyst
  - meeting-debrief
  # NOTE: calendar excluded — calendar-* skills are not default; enable after calendar credentials configured
  # NOTE: ceo-inbox excluded — specialized inbox agent; must be enabled manually
  # NOTE: diagnostics excluded — principal-only, read-only forensic agent (#1356). Opt-in:
  #        reads internal audit + operational state, so an operator enables it (and its
  #        audit-query/audit-trace/ops-lookup skills) manually. First `powerful`-tier agent.
