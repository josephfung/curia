# Trusted, in-repo list of tools/agents/skills enabled by default on a FRESH install.
# NOT read from individual manifests (which are attacker-controlled on upload) —
# this file ships with the codebase. Reconciliation enrolls these as enabled ONLY
# when no registry row already exists (it never overrides an admin's choice).
#
# The existing production deployment was migrated by a one-shot backfill script
# (now removed) that enrolled all on-disk items as enabled.
#
# MCP-backed tools (create_doc, search_drive_files, etc.) are NOT listed here —
# they are loaded by loadMcpServers and are not on-disk ToolDiscovery items.
#
# skills: — SKILL.md bundles (Phase 2 + #1494). An enabled bundle enrolls EVERY member
# tool its SKILL.md lists (#1974) — membership is declared once, in the SKILL.md, not
# repeated here. Credential-dependent members are kept off by the gate on the tool
# itself (install.requires_secrets in its tool.json), not by omission: reconciliation
# skips a gated member until its keys are in the vault, then enrolls it on the next boot.
# That covers web-search (tavily_api_key), the calendar-* tools (nylas_api_key +
# ceo_nylas_grant_id) and query-/delete-relationship (openai_api_key).
# MCP-projected skills (google-workspace, etc.) are NOT listed — they appear in
# SkillRegistry at runtime from loadMcpServers (ADR-032).
skills:
  - tasks
  - documents
  - calendar
  - email
  - contacts
  - autonomy
  - scheduler
  - web
  - memory
  - context-bridge
  - executive-profile
  - setup
  # NOTE: tasks = heartbeat + task-*/plan/checkpoint; documents = doc-* workspace.
  # NOTE: ceo-inbox / learning / diagnostics skill bundles excluded — enable alongside
  #        their agents. Enabling one enrolls its member tools on the next boot.
tools:
  # STANDALONE tools only — tools that belong to no SKILL.md bundle. A bundle's member
  # tools are enrolled through the bundle (skills: above), never listed here; a unit test
  # (registry-defaults-coverage.test.ts) fails if a default bundle's member appears here.
  - tool-registry
  - skill-activate
  # Core communication
  - signal-send
  - sms-send
  - slack-send
  # Memory + knowledge
  - entity-context
  # Config
  - config-store
  # Utility
  - date-resolve
  - delegate
  - async-offramp
  - file-parse
  - request-clarification
  - bullpen
  - drive-download-file
  - image-generate
  # Personal vault (agent-captured user.* secrets)
  - secret-capture-request
  - list-user-secrets
  # Autonomy
  - activity-log
  - approval-expiry-sweep
  # Infrastructure-only: re-publishes a Gate C–withheld dispatcher relay after CEO
  # approve (#1733). Not pinned to any agent; allowed_callers: ["system"] so agents
  # cannot invoke it — only approve-action's humanApproved re-exec path reaches it.
  - dispatcher-relay
  # NOTE: diagnostics skills (audit-query, audit-trace, ops-lookup) excluded — they
  #        read internal audit + operational state and are the principal-only
  #        diagnostics agent's toolset. Opt-in: enable them alongside the diagnostics
  #        agent (Settings → Skills), not on a fresh install.
  # NOTE: ceo-inbox-* excluded — companion to the ceo-inbox agent; enable alongside it.
  #        The email-observation-learning companions (voice-learn, task-completion-from-sent,
  #        list-learning-digest, resolve-learning-digest) are likewise excluded and must be
  #        enabled alongside ceo-inbox — even though list/resolve are pinned to the coordinator,
  #        they only produce output once the ceo-inbox observer subsystem is running.
  # NOTE: KG extractors (extract-facts, extract-relationships) excluded — require OpenAI
  #        embeddings. Standalone tools, so no bundle enrolls them.
agents:
  - coordinator
  - setup-wizard       # required for onboarding on a fresh install
  - contacts
  - research-analyst
  - meeting-debrief
  # NOTE: calendar agent excluded — enable after calendar credentials are configured
  # NOTE: ceo-inbox excluded — specialized inbox agent; must be enabled manually
  # NOTE: diagnostics excluded — principal-only, read-only forensic agent (#1356). Opt-in:
  #        reads internal audit + operational state, so an operator enables it (and its
  #        audit-query/audit-trace/ops-lookup skills) manually. First `powerful`-tier agent.
