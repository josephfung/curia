version: 2

updates:
  # npm dependencies — production deps get individual PRs,
  # dev deps are grouped into a single PR to reduce noise
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Quarantine newly-published versions for 7 days before proposing a bump.
    # A compromised package version is most often caught and yanked within days of
    # publish; waiting 7 days lets Dependabot skip that window. We rely on this
    # PR-proposal-layer gate rather than pnpm's install-time `minimumReleaseAge`,
    # which would retroactively reject the existing lockfile and break CI.
    # NOTE: cooldown applies to version updates only — Dependabot *security*
    # updates (CVE fixes from alerts) bypass it, so CVE patches are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # nylas published a stray, higher-numbered release (17.13.1, 2025-09-17)
      # that is NOT the registry `latest` tag — the maintained line is 8.x
      # (latest 8.4.0, 2026-06-24) and Nylas kept shipping 8.x *after* 17.13.1.
      # Dependabot sees 17.13.1 > 8.4.0 by raw semver and proposes a "downgrade
      # in disguise" onto stale, divergent SDK code (curia#1273). Block nylas
      # majors; a genuine future major (a real 9.x) gets reviewed and bumped by
      # hand. 8.x minor/patch updates still flow normally.
      - dependency-name: "nylas"
        update-types: ["version-update:semver-major"]
      # @types/node major tracks the Node.js release line. Runtime is Node 24
      # (engines + node:24-slim); block major bumps until Node itself is bumped.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions (checkout, setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day quarantine on newly-published action versions (see npm block above).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images — the root Dockerfile (node:24-slim, digest-pinned).
  # Without this ecosystem the base image was never tracked and silently drifted
  # (prod ended up on node 26 Current via curia-deploy#87). Dependabot keeps the
  # @sha256 digest fresh within the pinned tag.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day quarantine on newly-published image digests (see npm block above).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # node 24 is the Active LTS. Do NOT auto-bump the major: the next even
      # release (26) is Current/unstable until it reaches LTS (~Oct 2026), and
      # Node.js says production should run only Active/Maintenance LTS. Digest +
      # minor/patch updates still flow; bump the major by hand when 26 goes LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Docker base images — docker/postgres.Dockerfile (pgvector/pgvector:pg16,
  # digest-pinned). Pin the pg major: a pg16→pg17 jump needs a deliberate DB
  # upgrade, so block majors and let only digest/minor refreshes land.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day quarantine on newly-published image digests (see npm block above).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
