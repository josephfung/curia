version: 2

updates:
  # npm dependencies — minor and patch bumps are grouped into one production PR and one
  # dev PR a week; majors still get individual PRs. The main ruleset requires a PR to be
  # up to date, so the Dependabot merge driver (curia-deploy scripts/dependabot) lands PRs
  # one at a time, each through a full CI run: five single-package PRs cost five CI
  # cycles, one group costs one. The trade: one bad bump holds its group until it is
  # excluded with `@dependabot ignore <name>` on the group PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Quarantine newly-published versions for 7 days before proposing a bump.
    # A compromised package version is most often caught and yanked within days of
    # publish; waiting 7 days lets Dependabot skip that window. We rely on this
    # PR-proposal-layer gate rather than pnpm's install-time `minimumReleaseAge`,
    # which would retroactively reject the existing lockfile and break CI.
    # NOTE: cooldown applies to version updates only — Dependabot *security*
    # updates (CVE fixes from alerts) bypass it, so CVE patches are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        # Held by the merge driver's policy (curia-deploy scripts/dependabot/policy.yaml
        # hold_dependencies): every patchright bump gets a human look at its release. In
        # the group it would hold every other production bump with it, so it keeps its
        # own PR.
        exclude-patterns:
          - "patchright"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # nylas published a stray, higher-numbered release (17.13.1, 2025-09-17)
      # that is NOT the registry `latest` tag — the maintained line is 8.x
      # (latest 8.4.0, 2026-06-24) and Nylas kept shipping 8.x *after* 17.13.1.
      # Dependabot sees 17.13.1 > 8.4.0 by raw semver and proposes a "downgrade
      # in disguise" onto stale, divergent SDK code (curia#1273). Block nylas
      # majors; a genuine future major (a real 9.x) gets reviewed and bumped by
      # hand. 8.x minor/patch updates still flow normally.
      # UNBLOCK-WHEN: `npm view nylas dist-tags.latest` resolves to a real >=9.x (not the stray 17.13.1).
      - dependency-name: "nylas"
        update-types: ["version-update:semver-major"]
      # @types/node major tracks the Node.js release line. Runtime is Node 26
      # (engines + node:26-slim); block major bumps until Node itself is bumped.
      # UNBLOCK-WHEN: package.json `engines.node` is bumped past 26 (moves in lockstep with the `node` docker ignore below).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.x is the native (Go) compiler rewrite with breaking internal
      # API changes. typescript-eslint doesn't support it yet — even the latest
      # (8.65.0) peer-caps at typescript '>=4.8.4 <6.1.0', so bumping TS to 7
      # leaves no compatible linter version and crashes CI lint
      # ("Cannot read properties of undefined (reading 'Cjs')", curia#1454).
      # Stay on 6.x; bump to 7 by hand once typescript-eslint supports it. 6.x
      # minor/patch updates still flow normally.
      # UNBLOCK-WHEN: `npm view typescript-eslint peerDependencies.typescript` allows >=7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions (checkout, setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day quarantine on newly-published action versions (see npm block above).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # workspace-mcp's Python dependency tree: the hash-pinned lockfile
  # scripts/workspace-mcp/requirements.txt, compiled by `uv pip compile` from
  # requirements.in (#2657). The `uv` ecosystem recompiles it with the options in its
  # header, upgrading only the one package (`-P`), so a CVE fix moves that package
  # alone. Security updates only: open-pull-requests-limit 0 turns off version updates,
  # which would otherwise move the tree weekly and bring in majors workspace-mcp never
  # tested (its dependencies are all open-ended). Security updates have their own limit
  # and bypass the cooldown. To move the tree on purpose, see docs/dev/google-drive.md
  # ("Bumping workspace-mcp").
  - package-ecosystem: "uv"
    directory: "/scripts/workspace-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0

  # Docker base images — the root Dockerfile (node:26-slim, digest-pinned).
  # Without this ecosystem the base image was never tracked and silently drifted
  # (prod ended up on node 26 Current via curia-deploy#87). Dependabot keeps the
  # @sha256 digest fresh within the pinned tag.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day quarantine on newly-published image digests (see npm block above).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # node 26 is the Active LTS (since 2026-10-28). Do NOT auto-bump the major:
      # from 27 on Node.js ships one major a year and every one becomes LTS, but
      # 27 is Current/unstable until then (LTS scheduled 2027-10-20), and Node.js
      # says production should run only Active/Maintenance LTS. Digest +
      # minor/patch updates still flow; bump the major by hand when 27 goes LTS.
      # UNBLOCK-WHEN: Node 27 reaches Active LTS (~2027-10) per https://nodejs.org/en/about/previous-releases.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Docker base images — docker/postgres.Dockerfile (pgvector/pgvector:pg16,
  # digest-pinned). Pin the pg major: a pg16→pg17 jump needs a deliberate DB
  # upgrade, so block majors and let only digest/minor refreshes land.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day quarantine on newly-published image digests (see npm block above).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # UNBLOCK-WHEN: a deliberate pg16->pg17 database upgrade is scheduled (human decision, not automatable).
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
