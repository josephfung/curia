name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 3'  # Weekly, Wednesday — staggered from CodeQL (06:00)

# Least privilege: workflow token defaults to read-only; the scan job grants
# `security-events: write` at the job level for the SARIF upload (Scorecard
# TokenPermissionsID).
permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required for SARIF upload
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep
        # continue-on-error so Semgrep's issue-found exit code (1) doesn't
        # halt the job before we can upload the SARIF results
        continue-on-error: true
        run: |
          semgrep \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/command-injection \
            --config p/secrets \
            --config p/dockerfile \
            --metrics=off \
            --sarif \
            --output semgrep.sarif \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude 'pnpm-lock.yaml' \
            --exclude 'tests/**/*.snap'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          sarif_file: semgrep.sarif
        # Upload even when Semgrep finds issues so alerts appear in Security tab
        if: always()
