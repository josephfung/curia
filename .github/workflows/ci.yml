name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**/*.md'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The work that used to be one serial `ci` job (~8.5 min: tests 4 min, typecheck 1.5,
  # Chromium 1.5, then lint and builds) runs as parallel jobs, and `ci` below is the one
  # check the ruleset requires. The `main` ruleset is strict (up to date before merge), so
  # every merge sends every other open PR, Dependabot's included, through this workflow
  # again: its wall-clock time is the cost of each merge in a batch.

  # Covers src/, skills/, tests/ and every workspace package (apps/*, packages/*)
  # via `pnpm -r run typecheck` — see #1726. There is deliberately no separate
  # console step: a hand-maintained per-package list here is how apps/console
  # came to be missing from the root script.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # Track .nvmrc so CI, engines (>=26), and the node:26 Docker image stay in lockstep
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Type check
        run: pnpm run typecheck

  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # Track .nvmrc so CI, engines (>=26), and the node:26 Docker image stay in lockstep
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Build console
        run: pnpm --filter @curia/console run build

      # Typecheck and vitest never load the built bundle, and vitest's CommonJS
      # interop accepts named imports that Node's own ESM loader rejects. #2393
      # passed CI and then crash-looped production on `import { generateVAPIDKeys }
      # from 'web-push'` (#2410). Build the bundle the image runs and load every
      # package it imports with plain Node.
      # The same command as the Dockerfile, so this checks the bundle the image ships.
      - name: Build backend bundle
        run: pnpm exec tsup src/index.ts --format esm --no-dts

      - name: Check bundle imports under Node ESM
        run: pnpm run check:dist-imports

      - name: Lint
        run: pnpm run lint

      - name: Shell setup/install tests
        run: pnpm run test:shell

  # Vitest's own sharding: each shard runs a fixed third of the test files, against its
  # own Postgres, so the shards share nothing. A file lands in the same shard every run.
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # One red shard is enough to fail `ci`; the others still finish, so a run reports
      # every failing file, not just the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        # Authenticated pull (#2095): anonymous Docker Hub pulls are rate-limited per
        # runner IP. Fork PRs get no secrets, and a literal `username:`/`password:`
        # pair then fails template validation at job setup ("Unexpected value ''",
        # #2153), so the whole block is one expression: the credentials when both
        # secrets are set, else an empty map, which makes the runner skip the login
        # and pull anonymously. toJSON escapes the values into the JSON. Same in
        # semgrep.yml and dast.yml; tests/unit/ci/docker-publish-dockerhub-login.test.ts
        # pins all three.
        credentials: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.DOCKERHUB_USERNAME), toJSON(secrets.DOCKERHUB_TOKEN))) || fromJSON('{}') }}
        env:
          POSTGRES_DB: curia_test
          POSTGRES_USER: curia
          POSTGRES_PASSWORD: curia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # Track .nvmrc so CI, engines (>=26), and the node:26 Docker image stay in lockstep
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Run database migrations
        run: pnpm tsx node_modules/node-pg-migrate/bin/node-pg-migrate.js up --migrations-dir src/db/migrations --migration-file-language sql
        env:
          DATABASE_URL: postgres://curia:curia_test@localhost:5432/curia_test

      # The saved-card fill test (tests/integration/web-browser-card-fill.test.ts) drives a real
      # headless Chromium through Patchright and fails, not skips, without one. Dependencies
      # install with --ignore-scripts, so the browser is fetched here. Any shard can hold a
      # browser test, so every shard installs it. The browser download is cached on the
      # lockfile (a Patchright bump is the only thing that moves its Chromium build); the
      # system libraries it needs still come from apt every run.
      - name: Cache Patchright's Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: patchright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Patchright
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec patchright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec patchright install-deps chromium

      # Bundled embedder weights (#2023): pinned in models/embedding/manifest.json and
      # downloaded only by `pnpm fetch:embedder`, which verifies size + sha256. Cached on
      # the manifest hash so a pin change is the only thing that re-downloads. Only the
      # weights directory (every manifest `dest` lives under it) is cached: the manifest
      # is the trust anchor the weights are verified against, so it must always come from
      # the checkout, never from a cache entry.
      - name: Cache embedder weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/embedding/all-MiniLM-L6-v2
          key: embedder-${{ hashFiles('models/embedding/manifest.json') }}

      - name: Fetch embedder weights
        run: pnpm fetch:embedder

      - name: Run tests
        run: pnpm test --shard=${{ matrix.shard }}/3
        env:
          DATABASE_URL: postgres://curia:curia_test@localhost:5432/curia_test
          LOG_LEVEL: error

  # The required status check (ruleset on main; scripts/dependabot policy in curia-deploy;
  # ci-docs-skip.yml reports the same name for docs-only PRs). Green only when every job
  # above succeeded. `!cancelled()`, not the default, so it still runs when one of them
  # fails and fails itself, rather than being skipped: a skipped required check never goes
  # green or red, and the PR waits forever. A superseded PR run is cancelled whole, and
  # then this is cancelled too instead of reporting red on the old commit.
  ci:
    runs-on: ubuntu-latest
    needs: [typecheck, build-lint, test]
    if: ${{ !cancelled() }}
    steps:
      - name: Every CI job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "typecheck, build-lint, test shards: $RESULTS"
          [ "$(echo "$RESULTS" | jq -r 'map(select(. != "success")) | length')" = "0" ] || {
            echo "::error::a CI job did not succeed: $RESULTS"
            exit 1
          }

  postgres-image:
    # Builds the real curia-postgres image and boots it on fresh volumes to guard
    # against curia#1350 (fresh-init crash-loop in verify-pgaudit.sh). The `ci` job's
    # postgres service uses the stock pgvector image, so the custom image is
    # otherwise never exercised on PRs — which is exactly how #1350 shipped.
    runs-on: ubuntu-latest
    # Read by the login step's `if:`, which cannot read `secrets` directly.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build pulls pgvector/pgvector from Docker Hub; authenticate it (#2095).
      # Skipped where the secrets are absent (fork and Dependabot PRs), which then
      # pull anonymously as before. Unlike docker-publish, this is a PR check, so it
      # degrades rather than failing on a missing token.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + boot curia-postgres (fresh-init regression)
        run: bash tests/docker/test-postgres-init.sh

  # Decides whether curia-image runs. Cheap (a checkout and a git diff) and always runs,
  # so curia-image can gate on its output without the skipped-dependency pitfall (a job
  # that `needs` a skipped job is skipped too). Modelled on trivy.yml's `changes` job and
  # fail-safe the same way: curia-image runs UNLESS this job explicitly outputs
  # image=false, so any error or doubt here errs toward building. Not a workflow-level
  # `paths` filter, which would leave a required check pending forever on a PR it skips.
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      # 'true' -> curia-image runs; 'false' -> it is skipped.
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the PR's base commit is present to diff against.
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Every push to main builds the image; only pull requests are filtered.
          if [ "$EVENT" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On a pull_request event SHA is the PR's merge commit, whose first parent is
          # BASE, so this diff is exactly what the PR changes. If BASE is missing or not
          # in the clone, build rather than guess.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(git diff --name-only "$BASE" "$SHA")"; then
            echo "git diff failed; building as a fail-safe" >&2
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What shapes the built image or this check: the Dockerfile and its context
          # filter, every package manifest and the lockfile/workspace (deps, overrides),
          # docker/ helpers, the pinned weights manifest, all of src/ and config/ (the
          # smoke run boots through src/config.ts, config/, src/db/, src/bus/ and
          # src/agents/llm/, not only src/memory/), every tsconfig, the fetch and smoke
          # scripts, the egress test, and this workflow. Whole trees rather than a list of
          # files: a list goes stale as imports change, and a stale list skips a needed build.
          # A here-string, not `echo | grep -q`: grep -q exits at the first match, and under
          # pipefail the echo's SIGPIPE would fail the pipeline and skip a needed build.
          # grep's status is captured rather than tested with `if`: only 1 (no match) skips
          # the build; 0 (a match) and anything else (2, a grep error) build, as promised above.
          rc=0
          grep -qE '^Dockerfile$|^\.dockerignore$|(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^docker/|^models/embedding/|^src/|^config/|(^|/)tsconfig[^/]*\.json$|^scripts/fetch-embedder\.ts$|^scripts/bundled-embedder-smoke\.ts$|^tests/docker/test-bundled-embedder-egress\.sh$|^\.github/workflows/ci\.yml$' <<<"$changed" || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            [ "$rc" -eq 0 ] || echo "grep exited $rc; building as a fail-safe" >&2
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  curia-image:
    # Builds the real Curia image (amd64, the runner's native arch) and proves the bundled
    # embedding model works with no network (#2023). The build itself runs the image's
    # fail-closed checks: the weights' sha256 against the pinned manifest, the
    # onnxruntime-node platform prune (node_modules and the kept pnpm store), and a
    # build-time model load (native builds only, so it runs here). The egress script then
    # runs entity memory on an internal Docker network with no route out. The `ci` job
    # never builds the image, so without this a regression that only shows in the
    # container (a pruned binary, weights left out, a first-use download) would surface at
    # a deploy.
    #
    # A full, uncached image build is expensive (trivy.yml keeps its image build off PRs
    # for that reason), so pull requests build only when `changes` sees an image-relevant
    # file; pushes to main always build. `!cancelled()` lets this run when `changes`
    # failed (fail-safe), while a real cancellation still stops it.
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes or fetches, so the token is not left in .git/config
          # for the build or the egress script to reach.
          persist-credentials: false

      # The build pulls node:26-slim from Docker Hub; authenticate it (#2095). Skipped
      # where the secrets are absent (fork and Dependabot PRs), as in postgres-image.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the Curia image
        run: docker build -t curia:ci .

      # The amd64 footprint of the bundled embedder (design §4, "Image size"): compare
      # with the same figure from a main build.
      - name: Report the image size
        run: |
          size="$(docker image inspect -f '{{.Size}}' curia:ci)"
          echo "curia:ci (amd64) image size: ${size} bytes"
          echo "Curia image (amd64): ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Bundled embedder works with egress blocked
        run: bash tests/docker/test-bundled-embedder-egress.sh curia:ci
