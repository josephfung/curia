name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**/*.md'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: curia_test
          POSTGRES_USER: curia
          POSTGRES_PASSWORD: curia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Track .nvmrc so CI, engines (>=24), and the node:24 Docker image stay in lockstep
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Run database migrations
        run: pnpm tsx node_modules/node-pg-migrate/bin/node-pg-migrate.js up --migrations-dir src/db/migrations --migration-file-language sql
        env:
          DATABASE_URL: postgres://curia:curia_test@localhost:5432/curia_test

      - name: Type check
        run: pnpm run typecheck

      - name: Type check console
        run: pnpm --filter @curia/console run typecheck

      - name: Build console
        run: pnpm --filter @curia/console run build

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://curia:curia_test@localhost:5432/curia_test
          LOG_LEVEL: error

      - name: Shell setup/install tests
        run: pnpm run test:shell

  postgres-image:
    # Builds the real curia-postgres image and boots it on fresh volumes to guard
    # against curia#1350 (fresh-init crash-loop in verify-pgaudit.sh). The `ci` job's
    # postgres service uses the stock pgvector image, so the custom image is
    # otherwise never exercised on PRs — which is exactly how #1350 shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build + boot curia-postgres (fresh-init regression)
        run: bash tests/docker/test-postgres-init.sh
