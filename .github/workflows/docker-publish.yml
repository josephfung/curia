name: docker-publish

# Build, push, sign, and SBOM-attest the Curia app + Postgres images to GHCR.
# - release published -> semver + latest (app), pg16 + latest (postgres)
# - push to main      -> edge (both), for dogfood / curia-deploy pulls
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.40.0"
        required: false

# Least privilege at the workflow level; jobs opt into the scopes they need
# (mirrors release.yml). Only the `build` job touches GHCR / OIDC, so the
# `packages: write` + `id-token: write` scopes live there, not here — the
# `guard` job (which only validates a tag string) never receives them.
permissions:
  contents: read

# Only the newest run per ref needs to publish. A rapid batch of main merges
# (e.g. several back-to-back dependency bumps) each retag `edge`, so keeping
# every superseded ~10min build running is pure waste — cancel the in-flight
# one when a newer commit for the same ref arrives.
#
# Keying on `github.ref` (not just the workflow name) keeps the trigger types
# independent: `push` to main collapses into one group (refs/heads/main) so
# older edge builds get cancelled, while each `release` sits in its own
# per-tag group (refs/tags/vX.Y.Z) and is never cancelled by another release
# or by a main push. `edge` is a mutable last-write-wins tag, so cancelling a
# partial push just leaves the previous `edge` in place until the winner lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Validate a workflow_dispatch tag input against strict semver to avoid
  # injection (mirrors release.yml). No-op on release/push triggers.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate dispatch tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        # Pass the input through an env var so the shell never sees raw
        # expression output — prevents injection if the value contains
        # shell metacharacters (mirrors the pattern in release.yml).
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' \
            || { echo "Invalid tag format"; exit 1; }

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read    # actions/checkout
      packages: write   # push + sign images in GHCR
      id-token: write   # keyless cosign via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: curia
            image: curia
            dockerfile: Dockerfile
            # App tags: semver+latest on release, edge on main.
            tags: |
              type=semver,pattern=v{{version}}
              type=semver,pattern=v{{major}}.{{minor}}
              type=raw,value=latest,enable=${{ github.event_name == 'release' }}
              type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          - name: curia-postgres
            image: curia-postgres
            dockerfile: docker/postgres.Dockerfile
            # DB is versioned by pg major, not app semver.
            tags: |
              type=raw,value=pg16,enable=${{ github.event_name == 'release' }}
              type=raw,value=latest,enable=${{ github.event_name == 'release' }}
              type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a manual workflow_dispatch re-publish, check out the requested
          # tag so the built image matches inputs.tag (validated in the guard
          # job). For release/push triggers inputs.tag is empty, so fall back to
          # the event ref (the release tag or the pushed branch).
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ matrix.tags }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # Turn a failed publish into an active notification (#1699).
  #
  # Why this is needed: when a publish fails, the mutable `edge` tag silently keeps
  # pointing at the PREVIOUS commit. Nothing downstream notices — curia-deploy pulls
  # `:edge` and ships older code, and its older migrations, while reporting success.
  # The only prior signal was a red run nobody is obliged to look at before deploying.
  # (The deploy-side half — asserting the pulled image's revision — is curia-deploy#213.)
  #
  # `if: failure()` deliberately excludes cancellation: `cancel-in-progress` cancels
  # superseded builds on a rapid batch of main merges, and that is normal, not an
  # incident. `failure()` is false for cancelled runs; `always()` or `!success()`
  # would page on every superseded build and train everyone to ignore this.
  notify-failure:
    needs: build
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write     # file / comment on the tracking issue
    steps:
      - name: Open or update the publish-failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'publish-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 8);

            const body = [
              `**\`docker-publish\` failed on \`${context.ref}\` at \`${sha}\`.**`,
              '',
              `Run: ${runUrl}`,
              '',
              'Until a publish succeeds, `ghcr.io/josephfung/curia:edge` still points at the',
              'previous commit. A deploy now would ship older code **and skip any migrations**',
              'added since, while appearing to succeed. Either re-run the failed job or pin',
              '`CURIA_IMAGE_TAG` deliberately before deploying.',
              '',
              'Transient npm registry drops are the known cause (#1699); re-running is usually',
              'enough. If it recurs, the retry wrapper in `docker/pnpm-retry.sh` is not holding.',
            ].join('\n');

            // Reuse one open issue rather than filing a new one per failure — a flaky
            // registry could otherwise produce a stream of duplicates and get muted.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              core.notice(`Commented on existing publish-failure issue #${open[0].number}`);
              return;
            }

            // The label may not exist yet on a fresh repo; create it first so the
            // dedupe lookup above works on the next failure.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'A docker-publish run failed; :edge may be stale',
              });
            } catch (err) {
              if (err.status !== 422) throw err;   // 422 = already exists, fine
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `docker-publish failed on main — :edge is stale at ${sha}`,
              labels: [label, 'infra'],
              body,
            });
            core.notice(`Opened publish-failure issue #${created.number}`);
