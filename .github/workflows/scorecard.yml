name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly — Scorecard is a repo-level check, not per-PR
    - cron: '30 6 * * 1'  # Monday 06:30 UTC
  # Required for SARIF upload when triggered by schedule/push
  workflow_dispatch:

# Minimal top-level permissions; write permissions scoped to the job because
# the Scorecard API rejects workflows where security-events: write is global.
permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for SARIF upload
      id-token: write         # for publishing results to OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # required by Scorecard

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true  # publishes to OpenSSF API for badge

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        if: always()
