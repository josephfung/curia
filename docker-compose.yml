services:
  postgres:
    image: ghcr.io/josephfung/curia-postgres:${CURIA_POSTGRES_TAG:-pg16}
    restart: unless-stopped
    # POSTGRES_PORT is parameterized so a second stack can coexist on the same
    # host (e.g. testing a fresh `pnpm run setup` against a sibling clone while
    # the dev stack runs on 5432). Defaults to the standard port if unset.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: curia
      POSTGRES_USER: ${DB_USER:-your-db-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your-db-password}
    # Load pgAudit and configure session-level auditing via command args.
    # All pgAudit settings are here (not in the init script) so there's one
    # place to look. The init script only handles CREATE EXTENSION and role setup.
    # IMPORTANT: shared_preload_libraries is the critical line — without it, the
    # other pgaudit.* settings are silently accepted but have no effect.
    command: >
      postgres
      -c shared_preload_libraries=pgaudit
      -c pgaudit.log=write,ddl
      -c pgaudit.log_parameter=on
      -c pgaudit.log_relation=on
      -c pgaudit.role=pgaudit_role
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-curia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    # Opt-in: plain `docker compose up` must not publish LiveKit ports or start
    # a --dev server. Enable with `docker compose --profile voice up -d livekit`.
    profiles:
      - voice
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Local/dev default under the voice profile. LiveKit --dev uses known
    # credentials (devkey / secret) — never expose that on a public interface.
    # Production must set LIVEKIT_COMMAND to a real config (e.g.
    # "--config /etc/livekit.yaml") with keys matching Settings → Channels → Voice,
    # plus a bind mount of ./docker/livekit.yaml:/etc/livekit.yaml:ro.
    command: ${LIVEKIT_COMMAND:---dev --bind 0.0.0.0}
    ports:
      # HTTP/WebSocket signaling. Use wss://<host> when served behind TLS.
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      # WebRTC TCP fallback.
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      # WebRTC UDP. Open this on the host firewall/NAT.
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"

  curia:
    image: ghcr.io/josephfung/curia:${CURIA_IMAGE_TAG:-latest}
    # No explicit container_name — Docker Compose generates `<project>-curia-1`,
    # which is namespaced by COMPOSE_PROJECT_NAME. The previous `container_name: curia`
    # was global to the Docker daemon and made it impossible to run a second curia
    # stack on the same host (e.g. for testing a fresh install alongside a dev one).
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    env_file: .env
    environment:
      # Override DATABASE_URL so the container reaches postgres by service name,
      # not localhost (which resolves to the container itself inside Docker).
      # The .env value uses localhost for host-side tools (pnpm migrate, dev mode).
      DATABASE_URL: "postgres://${DB_USER:-curia}:${DB_PASSWORD}@postgres:5432/curia"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      # start_period matches the Dockerfile's HEALTHCHECK — see the Dockerfile
      # comment for why 60s. Keep the two values in sync.
      start_period: 60s
      retries: 3
    volumes:
      # Persist OAuth token cache for the google-workspace MCP server.
      # Tokens are written here on first OAuth login and auto-refreshed thereafter.
      # Without this volume, re-authentication is required on every container restart.
      # See docs/dev/google-drive.md for first-time OAuth setup.
      # Path matches $HOME/.google_workspace_mcp; HOME=/tmp is set in the Dockerfile.
      - google_workspace_tokens:/tmp/.google_workspace_mcp
    tmpfs:
      # uid/gid match the pinned curia UID/GID (1001) in the Dockerfile.
      # Without these options the tmpfs is mounted root:root with mode=0700,
      # which is inaccessible to the non-root curia runtime user.
      - /run/curia-tempfiles:size=50M,noexec,nosuid,nodev,mode=0700,uid=1001,gid=1001

volumes:
  pgdata:
  google_workspace_tokens:
