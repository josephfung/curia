# Workspaces — apps/* are treated as separate pnpm packages.
# deps of each app are installed by the root pnpm install.
packages:
  - 'apps/*'
  - 'packages/*'

# Explicitly declare pnpm v11 default: prevent transitive (indirect) dependencies
# from being resolved via exotic sources (git repos, direct tarball URLs).
# Note: this does NOT restrict direct dependencies listed in package.json,
# and file: references are not considered exotic by pnpm.
# We declare this explicitly so the policy is visible and survives future
# pnpm default changes.
blockExoticSubdeps: true

# Fail install if a package's trust evidence is weaker than an earlier publish
# (e.g. previously trusted-publisher, now unsigned). Blocks compromised republishes
# that drop provenance. Requires pnpm >=10.21.0. Ref: https://pnpm.io/settings#trustpolicy
#
# trustPolicyIgnoreAfter: skip the check for packages published >7 days ago — older
# releases often predate trusted-publishing / provenance, and a prior trusted
# prerelease/provenance publish would otherwise false-positive on the stable line
# (chokidar@4.0.3 and pino@9.14.0 hit this on first enable). New publishes still
# get the full no-downgrade gate within the first week.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

# Supply-chain hardening: quarantine newly-published package versions. pnpm refuses
# to resolve/verify any version published less than this many minutes ago, blunting
# the "publish a malicious patch, install it within minutes" attack class.
#
# 1440 minutes = 24h. This is a deliberate floor, NOT the primary quarantine:
#   - The primary 7-day quarantine lives in .github/dependabot.yml (`cooldown`),
#     which stops Dependabot from ever PROPOSING a version younger than 7 days.
#   - This 24h pnpm gate is the in-tree backstop that catches anything the cooldown
#     doesn't cover (e.g. a manual `pnpm add` of a brand-new package), and declares
#     the policy where it's visible (and where Semgrep checks for it).
#
# Why 24h and not 7 days here: this value is verified against the COMMITTED lockfile
# on every `pnpm install --frozen-lockfile` — CI, local installs, AND the production
# image build (curia-deploy/deploy/compose/Dockerfile.curia copies this file and runs
# frozen installs at both stages). A 7-day floor (10080) fails today's lockfile (it
# holds entries <7 days old) and would block builds/deploys; 24h is satisfied by the
# current lockfile. With the 7-day Dependabot cooldown upstream, lockfile entries are
# effectively always far older than 24h by the time they're merged, so this rarely
# bites in practice. Requires pnpm >=10.16.0. Ref: https://pnpm.io/settings#minimumreleaseage
#
# Semgrep's pnpm-minimum-release-age rule wants 10080 here; we keep 1440 deliberately
# (see above). The Dependabot cooldown is the 7-day gate.
# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
minimumReleaseAge: 1440

# -- Registry request resilience (#1699) --
#
# These raise pnpm's own retry budget for request failures it CATCHES and classifies
# as retryable (e.g. ERR_SOCKET_TIMEOUT, which it logs as "Will retry in Ns").
# Defaults are fetchRetries: 2 with a 10s floor, which is thin for the emulated
# linux/arm64 leg of docker-publish: it installs ~1000 packages under QEMU, so it
# stays connected to the registry far longer than a native build and sees more of
# any registry wobble.
#
# These settings alone are NOT the whole fix. The failure in run 33556099876 was an
# UNHANDLED undici stream error (UND_ERR_SOCKET) that aborted the Node process before
# pnpm could retry anything — no value here would have prevented it. The command-level
# retry in docker/pnpm-retry.sh covers that case; these cover the softer ones, so a
# hard process abort stays rare rather than routine.
#
# pnpm v10+ reads these from this file (camelCase), not .npmrc — the same reason
# `overrides` lives here. The Dockerfile COPYs pnpm-workspace.yaml before every
# install, so they apply inside the image build, not just on a developer machine.
# Purely transport-level: no interaction with minimumReleaseAge or the Dependabot
# cooldown, which govern WHICH versions may be selected, not how they are fetched.
# Kept deliberately modest. These compose MULTIPLICATIVELY with the command-level
# retry: worst case is (fetchRetries + 1) requests x fetchTimeout, inside up to
# PNPM_RETRY_ATTEMPTS runs, at each of the three install sites. Chasing a bigger budget
# buys little against a sustained outage and mostly delays an honest failure, so the
# `build` job also carries a timeout-minutes bound. Note the two knobs read differently:
# fetchRetries counts RETRIES (so 3 = 4 tries), PNPM_RETRY_ATTEMPTS counts TOTAL attempts.
fetchRetries: 3
fetchRetryFactor: 2
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
fetchTimeout: 90000

# Dependency version overrides. pnpm v10+ reads `overrides` ONLY from this file —
# a `pnpm.overrides` block in package.json is silently ignored. These pins force
# transitive deps onto patched versions to clear known CVEs.
#
# HOW TO SET A FLOOR. Not at the version that patched the advisory you are looking at —
# at the lowest version above which EVERY published release is clean. Those differ
# whenever a later advisory lands on the line, and the difference is silent: the floor
# still resolves clean by accident of natural resolution, so Dependabot stays quiet.
# That mistake has been made repeatedly here: qs, fast-uri and ip-address once each
# (#1933), shell-quote once, and hono and @hono/node-server TWICE each — once in #1933,
# and again on the auditor's first run against main (792fbabe, Refs #1934), which found
# all three as LIVE exposure and deferred them behind minimumReleaseAge. They are raised
# here now that the window has cleared. The two repeats are the point: a floor set at the
# patched version of the advisory in front of you goes stale the moment the next one lands
# on the same line, so it has to sit above EVERY known advisory, not the current one. No
# running count is kept here — `pnpm audit:override-floors` enforces this, and a
# hand-maintained tally went stale twice on its own.
#
# DO NOT AUDIT THIS BY HAND. `pnpm audit:override-floors` does it, and
# .github/workflows/override-floor-audit.yml runs it daily and on any PR touching this
# file. For every entry below it enumerates the published releases the floor admits and
# tests each one against both GitHub's global advisory DB and the package's own repo
# advisories, then reports the computed safe floor. It exists because all three traps
# that produced #1933 are invisible to a careful read of this file:
#   - A floor on one major does not constrain another. `undici: >=7.28.0` admitted the
#     entire 8.x line, which carried five HIGH advisories the floor never spoke to.
#   - The Dependabot alert list lags upstream. Advisories published on a project's own
#     repo may not be in GitHub's global DB yet, so a floor can look clean and not be.
#   - Nothing resolves to the floor, so nothing notices it has stopped protecting you.
# Deliberate exceptions go in that script's DEFAULT_POLICY, which requires a GHSA id and
# a reason so an UNEXPECTED advisory on the same package still fails the check.
# It also reads `minimumReleaseAge` above: when the safe floor is a version younger than
# that quarantine, pinning to it would make `pnpm install` unsatisfiable, so the audit
# reports it as blocked with the timestamp it becomes installable and does not fail. That
# state clears itself — raise the floor once the timestamp has passed.
#   - uuid: nylas@8.1.2 pins uuid@8.3.2 (CVE-2026-41907). uuid@11 is the last major
#     that still ships a CommonJS build, which the CJS Nylas SDK requires; uuid@12+
#     is ESM-only and would break `require('uuid')`.
overrides:
  # Three MED GHSAs, all fixed in 4.13.5. Consumers are @hono/node-server and
  # @modelcontextprotocol/sdk, which had both resolved 4.13.1 under the old >=4.12.27 floor:
  #   - GHSA-crvj-82cr-hjcx: query parser reads parameters after the URL fragment
  #     (cache-key / proxy interpretation differential)
  #   - GHSA-g6gw-c38x-mqfc: unbounded dot-notation nesting in parseBody() exhausts memory
  #   - GHSA-gqvv-2mrq-wpjv: toSSG() still writes outside the output dir (incomplete fix
  #     for CVE-2026-39408)
  # Raised off >=4.13.5, the follow-up 792fbabe deferred (Refs #1934): that floor admitted
  # 4.13.5-4.13.10, which carry two more MED advisories, NEITHER in GitHub's global
  # advisory DB (both 404 on /advisories), so Dependabot raises no alert for them:
  #   - GHSA-5r4p-p66f-jhc7 (>=4.12.4 <4.13.11): serveStatic decodes the request path a
  #     second time, so middleware on static paths can be bypassed
  #   - GHSA-hxh3-vqpv-xpqv (<4.13.7): hono/jsx renders plain strings unescaped in
  #     boundary components (XSS)
  # 4.13.11, not 4.13.7: the serveStatic advisory runs four patches further up the line.
  # And 4.13.11, not the newer 4.13.12: 4.13.12 is clean but younger than
  # minimumReleaseAge, so pinning to it would make the `pnpm install --frozen-lockfile`
  # in ci.yml and both Dockerfile stages unsatisfiable. Resolution moves up on its own
  # once the quarantine passes.
  hono: '>=4.13.11'
  # fast-uri ships authority-parser advisories faster than any floor keeps up with, so
  # this pin is deliberately set at the newest published release rather than at the
  # minimum patched version. The prior >=4.1.2 floor was satisfied by 4.1.3, so ajv
  # (fastify's schema compiler, and the MCP SDK's) stayed vulnerable while
  # @fastify/ajv-compiler had already moved to 4.2.1. Note that >=4.1.4 would NOT have
  # been enough either: 4.1.4 still carries the two MED advisories below, neither of
  # which is in GitHub's global advisory DB yet, so Dependabot raises no alert for them.
  # Moving off 4.1.3 clears four:
  #   - GHSA-58mr-gqgx-xq4g / CVE-2026-84394 (HIGH): host confusion via an unclosed bracket
  #   - GHSA-qw65-cvwx-89v3 / CVE-2026-84292 (HIGH): authority injection via unvalidated port
  #   - GHSA-jvvf-x445-j334 / CVE-2026-86818 (MED, <4.1.5): mailto header injection
  #   - GHSA-hrr3-gc8f-f4qj / CVE-2026-86472 (MED, <4.1.5): inconsistent host case normalization
  # RE-CHECK against `gh api /repos/fastify/fast-uri/security-advisories`, not just the
  # Dependabot alert list, which lags the upstream repo advisories.
  fast-uri: '>=4.2.1'
  # >=8.0.5 was satisfied by 8.0.5-8.0.15, all of which carry GHSA-fx2h-pf6j-xcff
  # (HIGH) and GHSA-v6wh-96g9-6wx3 (MED); both fixed in 8.0.16.
  vite: '>=8.0.16'
  # Two DoS advisories, both fixed in 6.16.0. The prior >=6.15.2 floor was satisfied by
  # 6.15.3, so googleapis-common stayed on the vulnerable version:
  #   - CVE-2026-82417 / GHSA-4mjr-xmp4-gh2g: stringify() DoS via attacker-controlled isBuffer
  #   - CVE-2026-82562 / GHSA-x5fp-wj9c-mxmx: array-limit bypass via bracket-key comma parsing
  qs: '>=6.16.0'
  # Two MED SSRF / trust-boundary advisories, both fixed in 10.5.1. The prior >=10.1.1
  # floor was satisfied by 10.5.0, so @fastify/rate-limit and express-rate-limit (the
  # MCP SDK's) kept resolving a vulnerable version even though socks already had 10.7.2:
  #   - GHSA-rpw4-54j3-4h4q / CVE-2026-101913: Address6.isLinkLocal() matches fe80::/64, not fe80::/10
  #   - GHSA-2vr4-cq9g-pvrc / CVE-2026-101910: no classifier recognizes NAT64 local-use 64:ff9b:1::/48
  # Floored at the newest release (not the 10.5.1 patch) for the same reason as fast-uri:
  # this package has shipped six advisories across 10.x, each outrunning the last floor.
  ip-address: '>=10.7.2'
  uuid: '^11.1.1'
  # Security pins for v0.35 release gate (HIGH CVEs flagged by Trivy image scan):
  ws: '>=8.21.0'         # CVE-2026-48779
  form-data: '>=4.0.6'   # CVE-2026-12143
  esbuild: '>=0.28.1'    # GHSA-gv7w-rqvm-qjhr (dev-server SSRF)
  # Reached via promptfoo. The old >=7.28.0 floor did NOT "patch all": it admitted the
  # whole 8.x line, and 8.0.0-8.10.1 carry twelve advisories the 7.x floor says nothing
  # about — GHSA-4cwx-7wf7-3272, GHSA-38rv-x7px-6hhq, GHSA-hm92-r4w5-c3mj,
  # GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q (HIGH) and seven MED/LOW. The last of them
  # (GHSA-3wwx-pv8p-q78v, <8.10.2) sets the floor. Constrain the line you resolve into.
  undici: '>=8.10.2'
  # Scorecard vulnerability pins (GHSA alerts flagged in code-scanning #155):
  '@opentelemetry/core': '>=2.8.0'          # GHSA-8988-4f7v-96qf (unbounded baggage header memory allocation)
  # Targeted to onnxruntime-web only, so the 7.x line is what this constrains. >=7.6.3
  # was satisfied by 7.6.3/7.6.4, which carry GHSA-j3f2-48v5-ccww (MED, <=7.6.4).
  # The untargeted 8.x line needs 8.6.6 (not the 8.6.0 this comment used to claim);
  # promptfoo resolves 8.8.0, which is clean.
  'onnxruntime-web>protobufjs': '>=7.6.5 <8'
  # >=0.6.0 was satisfied by 0.6.0, which carries GHSA-7q85-xj36-vmfc (HIGH) as well as
  # GHSA-xcpc-8h2w-3j85, the advisory this pin was added for. 0.6.1 published 2026-09-11
  # and also escapes GHSA-vwc7-r8mq-g2x9 (range caps at <=0.6.0), which the block at the
  # bottom of this file used to list as unfixable. Only consumer is optional onnxruntime-node.
  adm-zip: '>=0.6.1'
  # HIGH CVEs from Dependabot, 2026-07-24:
  # GHSA-f88m-g3jw-g9cj (libvips CVEs) is fixed in 0.35.0, but >=0.35.0 then admitted
  # 0.35.0-0.35.3, which carry GHSA-rgj7-g3m4-5g8c (HIGH, <0.35.4).
  # allowBuilds stays false (prebuilt binary).
  sharp: '>=0.35.4'
  find-my-way: '>=9.7.0'                    # GHSA-c96f-x56v-gq3h (HTTP/2 DoS)
  # Raised off >=1.9.0, which sat INSIDE the vulnerable range of a HIGH published only on
  # ljharb/shell-quote and absent from GitHub's global advisory DB: GHSA-pqg4-j6r4-53mv
  # (>=1.8.4 <1.11.0), quote() command injection via a line terminator in a token after a
  # `{ comment }` token. This one was NOT a backstop: resolution was 1.10.0, inside that
  # range, so the exposure was live. The trap here is the second one named in the header —
  # an upstream-only advisory that GitHub's global DB does not carry, so no Dependabot
  # alert ever contradicted the old floor.
  shell-quote: '>=1.11.0'
  # MED/LOW CVEs from Dependabot, 2026-07-24 (#1518):
  body-parser: '>=2.3.0'                    # GHSA-v422-hmwv-36x6 (invalid limit disables size enforcement DoS)
  # GHSA-frvp-7c67-39w9 (Windows serve-static path traversal via %5C) is fixed in 2.0.5,
  # but >=2.0.5 then admitted 2.0.5-2.0.9, which carry GHSA-9mqv-5hh9-4cgg (MED, <=2.0.9).
  # Consumer is @modelcontextprotocol/sdk (^1.19.9).
  # Raised off >=2.0.10: that floor admitted 2.0.10-2.1.2, which carry
  # GHSA-rmxm-3fg6-px4f (MED, >=1.19.10 <2.1.3) — the same serveStatic double-decode
  # middleware bypass as hono's GHSA-5r4p-p66f-jhc7, and likewise not in GitHub's global
  # advisory DB.
  '@hono/node-server': '>=2.1.3'
  # GHSA-724g-mxrg-4qvm (!!omap) + GHSA-pm4m-ph32-ghv5 (nested flow DoS); targeted —
  # js-yaml@4.x via @apidevtools/json-schema-ref-parser stays on 4.x. Raised off >=5.2.2
  # (#1934): that floor admitted 5.2.2-5.4.0, which carry GHSA-r3ph-w7gj-g6xm (MED,
  # >=5.0.0 <=5.4.0), published only on nodeca/js-yaml and absent from GitHub's global
  # advisory DB. Resolution already sits at 5.4.2, so the lockfile does not move — this is
  # a backstop against resolution dropping back onto a vulnerable version.
  'promptfoo>js-yaml': '>=5.4.1'
  # HIGH/MED CVEs from Scorecard + Dependabot, 2026-07-26:
  # GHSA-mh99-v99m-4gvg (unbounded expansion length OOM DoS) is fixed in 5.0.8, but
  # >=5.0.8 then admitted 5.0.8 itself, which carries GHSA-rgw5-rvv9-x895 (HIGH, <5.0.9).
  # No 2.x patch exists, hence the 5.x floor rather than a same-major bump.
  # >=5.0.9 in turn admitted 5.0.9-5.0.11, which carry three more advisories published only
  # on juliangruber/brace-expansion and absent from the global advisory DB (#1934):
  # GHSA-6j4f-fj2g-mc7p (HIGH, <5.0.10), GHSA-qhr7-859c-m2p7 (HIGH, <5.0.11) and
  # GHSA-q2hr-2g5m-vwhr (MED, <5.0.12). Resolution already sits at 5.0.12, so the lockfile
  # does not move.
  brace-expansion: '>=5.0.12'
  # Drop the only brace-expansion@2.x path (promptfoo→gaxios→rimraf@5→glob@10→minimatch@9).
  # rimraf@6 uses glob@11+/minimatch@10 which consume brace-expansion@5; gaxios only needs
  # rimraf for temp cleanup and the v6 API is compatible for that call site.
  'gaxios>rimraf': '>=6.1.2'
  # MED CVEs from Scorecard, 2026-09-09 (#1752):
  fflate: '>=0.8.3'                         # GHSA-px8p-9vwx-vf98 (unzipSync infinite loop on malformed ZIP64); only consumer is @openai/codex-security via promptfoo (dev-only), which pinned 0.8.2
  # HIGH CVE from Dependabot, 2026-09-09:
  # GHSA-7w5x-hrqm-74c2 / CVE-2026-85730 (DoS via malformed TOML, <=1.7.0); same story as
  # fflate above - only consumer is @openai/codex-security via promptfoo (dev-only), which
  # pins an exact 1.6.1, so nothing but an override moves it.
  # Raised off >=1.7.1 (#1934): that floor admitted 1.7.1/1.7.2/1.8.0 and 1.8.0 was what
  # resolved, all three covered by GHSA-r4xh-jqrq-34v2 (MED, <=1.8.0) — upstream-only, so
  # no Dependabot alert. This one was invisible to the new auditor at first too: smol-toml
  # publishes `repository: "github:squirrelchat/smol-toml"`, the npm shorthand, which the
  # first repo-URL parser returned null for, silently skipping the upstream-advisory leg.
  smol-toml: '>=1.9.0'
  #
  # Advisories deliberately left WITHOUT a clearing override (re-check before assuming
  # they were missed — the adm-zip entry that used to sit here was fixed by 0.6.1):
  #   - extract-zip GHSA-7pqw-9j4j-h8q3 and GHSA-jmr9-qjv8-65gv (symlink archive entries ->
  #     arbitrary file write, both HIGH). Affect <=2.0.1, the latest publish, so there is
  #     nothing to pin to. Dev-only, reached via promptfoo -> @openai/codex-security, and
  #     the prod image installs with --prod, so this never ships to production.
  #   - uuid GHSA-qmq6-f8pr-cx5x (missing buffer bounds check in v3/v5/v6, LOW). Only fix
  #     is 14.0.0, which the deliberate ^11.1.1 cap above cannot reach: uuid@11 is the last
  #     major shipping a CommonJS build, which the CJS Nylas SDK requires. Accepted: LOW,
  #     and nothing in this codebase passes a `buf` argument to v3/v5/v6.
  # These stay as accepted warnings until upstream ships a fix (extract-zip) or the Nylas
  # SDK stops needing CJS (uuid).

# esbuild requires a postinstall step to download the platform binary.
# Both versions (used by vite and tsup) are approved here.
# promptfoo brings in several native-module packages; only esbuild actually needs
# to run its build script for this project. The others are blocked.
allowBuilds:
  esbuild: true
  '@playwright/browser-chromium': false
  '@swc/core': false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
