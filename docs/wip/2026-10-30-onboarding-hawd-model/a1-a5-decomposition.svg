<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560"><style>
  text { fill: #1d1d1f; font-size: 12px; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t-sm { font-size: 10.5px; fill: #6b6b70; }
  .t-b { font-weight: 600; font-size: 13px; }
  .t-node { font-size: 10px; fill: #6b6b70; font-weight: 600; }
  .shape { fill: #ffffff; stroke: #1d1d1f; stroke-width: 1.4; }
  .gap { stroke: #d97706; stroke-dasharray: 5 3; stroke-width: 2; }
  .arrow, .a2 { stroke: #1d1d1f; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  .a2 { marker-end: url(#ah2); }
  .loop { stroke: #2563eb; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#ahb); }
</style><rect width="1120" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
  

  <!-- A1 -->
  <rect class="shape" x="30" y="40" width="190" height="80" rx="3"/>
  <text x="125" y="72" text-anchor="middle" class="t-b">Invite &amp; hold the</text><text x="125" y="90" text-anchor="middle" class="t-b">first conversation</text>
  <text x="212" y="114" text-anchor="end" class="t-node">A1</text>
  <!-- A2 hexagon -->
  <polygon class="shape" points="270,190 290,150 440,150 460,190 440,230 290,230" style="stroke-width:2"/>
  <text x="365" y="186" text-anchor="middle" class="t-b">Grant mailbox &amp;</text><text x="365" y="203" text-anchor="middle" class="t-b">calendar access</text>
  <text x="440" y="224" text-anchor="end" class="t-node">A2</text>
  <!-- A3 -->
  <rect class="shape" x="500" y="260" width="190" height="80" rx="3"/>
  <text x="595" y="292" text-anchor="middle" class="t-b">Infer rules, priorities</text><text x="595" y="310" text-anchor="middle" class="t-b">&amp; writing voice</text>
  <text x="682" y="334" text-anchor="end" class="t-node">A3</text>
  <!-- A4 hexagon -->
  <polygon class="shape" points="730,410 750,370 900,370 920,410 900,450 750,450" style="stroke-width:2"/>
  <text x="825" y="406" text-anchor="middle" class="t-b">Review &amp; confirm</text><text x="825" y="423" text-anchor="middle" class="t-b">the drafts</text>
  <text x="900" y="444" text-anchor="end" class="t-node">A4</text>
  <!-- A5 -->
  <rect class="shape" x="910" y="470" width="190" height="80" rx="3"/>
  <text x="1005" y="502" text-anchor="middle" class="t-b">Run, tune &amp;</text><text x="1005" y="520" text-anchor="middle" class="t-b">earn autonomy</text>
  <text x="1092" y="544" text-anchor="end" class="t-node">A5</text>

  <!-- flows -->
  <path class="a2" d="M220,80 L365,80 L365,148"/><text x="230" y="72" class="t-sm">sign-in link</text>
  <path class="a2" d="M460,190 L595,190 L595,258"/><text x="470" y="182" class="t-sm">connected grant</text>
  <path class="a2" d="M690,300 L825,300 L825,368"/><text x="700" y="292" class="t-sm">drafts as Google Docs</text>
  <path class="a2" d="M920,410 L1005,410 L1005,468"/><text x="925" y="402" class="t-sm">confirmed docs</text>
  <path class="a2" d="M125,120 L125,510 L908,510"/><text x="135" y="502" class="t-sm">style, autonomy, preferences, review format, triage switch on</text>
  <!-- loop back -->
  <path class="loop" d="M1100,500 L1110,500 L1110,20 L125,20 L125,38"/>
  <text x="530" y="14" class="t-sm" style="fill:#2563eb">next session (one at a time, tapering to weekly) and approvals that raise the autonomy score</text>
</svg>
