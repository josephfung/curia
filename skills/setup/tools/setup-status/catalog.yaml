# skills/setup-status/catalog.yaml
# The Setup checklist (#2358): the console's Setup page and the setup agent both read it,
# through src/setup/checklist.ts, which implements each completion_check type.
# Every task is required unless it says `optional: true`; setup_complete is true when every
# required task is done. Order is the Setup page's order.
#
# Principal content (persona, tone, debrief, how Curia refers to the principal, inbox
# sending) is not here: the principal sets it during onboarding, not the operator.
tasks:
  - id: who
    label: "Who it's for"
    value_prop: "Who Curia works for: their name, email and timezone, and, when you are setting it up for someone else, your details as its operator."
    tier: instant
    handoff: console
    handoff_path: /setup
    completion_check:
      type: principal_basics
    credential_how_to: "On the Setup page, choose Myself or Someone else. For someone else, add your name and email as the operator, then the principal's name, email and timezone."
    docs_url: /get-started/check-your-setup

  - id: curia_name
    label: "Curia's name"
    value_prop: "The name, title and email signature Curia uses when it writes and speaks."
    tier: instant
    handoff: console
    handoff_path: /setup
    completion_check:
      type: office_identity_configured
    credential_how_to: "On the Setup page, save Curia's name, title and email signature. You can change them later under Settings → Behaviour → Personality."
    docs_url: /get-started/check-your-setup

  - id: email
    label: "Email"
    value_prop: "Curia's own mailbox, so it can send and receive email."
    tier: heavy
    handoff: console
    handoff_path: /setup
    completion_check:
      type: email_channel_ready
    credential_how_to: "Get your Nylas API key at dashboard-v3.nylas.com (an application used only by this Curia: a sandbox suits a single install, with Nylas's built-in Google connector and up to 5 connected accounts; use a production application for more, or for your own Google app). Paste the key in the Email step, then Connect with Google for Curia's own mailbox (or paste a grant ID from the Nylas dashboard). Curia's mailbox starts after the restart."
    docs_url: /get-started/curia-email

  - id: messaging
    label: "Messaging"
    value_prop: "How Curia messages the principal: the Curia app, Signal, text message or Slack."
    tier: medium
    handoff: console
    handoff_path: /setup
    completion_check:
      type: messaging_route_ready
    credential_how_to: "In the Messaging step, choose one route. The Curia app needs Curia on an https address with a real hostname and push notifications set up. Signal needs Curia's Signal number (a signal-cli daemon Curia can reach) and the principal's. Text message needs a Telnyx API key, Curia's number, the webhook public key and the principal's mobile. Slack needs the bot token, the app-level token and the principal's Slack member ID. Channels other than the app start after the restart."
    docs_url: /get-started/reach-your-principal

  - id: voice
    label: "Voice"
    value_prop: "How the principal talks to Curia: in the Curia app or by Signal call."
    tier: medium
    handoff: console
    handoff_path: /setup
    completion_check:
      type: voice_route_ready
    credential_how_to: "In the Voice step, choose the Curia app or a Signal call, then add the Deepgram and Cartesia keys and pick Curia's spoken voice. LiveKit comes with Curia itself (set up when it's installed), so it needs nothing here. Signal calls also need the Signal channel and SIGNAL_VOICE_CALLS_ENABLED=true on the server. Voice starts after the restart."
    docs_url: /get-started/voice

  - id: mailbox_signin
    label: "Email & calendar"
    value_prop: "Lets the principal connect their own Gmail accounts by signing in with Google, with no grant IDs to copy."
    tier: heavy
    handoff: console
    handoff_path: /setup
    completion_check:
      type: nylas_signin_ready
    credential_how_to: "Uses the Nylas API key from the Email step and APP_ORIGIN set to this console's public https:// address. The Email & calendar step finds the region and registers Curia's sign-in callback with Nylas on its first check. A sandbox application needs nothing more: it uses Nylas's built-in Google connector. A production application needs a Google connector: paste your Google Cloud OAuth client id and secret there, and in Google Cloud add only the Nylas redirect URI shown (https://api.us.nylas.com/v3/connect/callback, or the eu one) to the OAuth client. After the API key or region is first saved or changed, restart Curia once."
    docs_url: /get-started/principal-email-calendar

  # ── Optional extras: never block setup_complete ──────────────────────────

  - id: working_style
    label: "Working style"
    value_prop: "A starting tone and level of independence. The principal is offered them in the first conversation and can change them."
    tier: instant
    handoff: console
    handoff_path: /setup
    optional: true
    completion_check:
      type: always_available
    credential_how_to: "Optional: in the Working style extra on the Setup page, pick a tone and how much Curia does before checking in. Each choice saves when picked. Leave them and the defaults apply until the principal chooses in their first conversation."
    docs_url: /get-started/check-your-setup

  - id: principal_mailboxes
    label: "Principal mailboxes and calendars"
    value_prop: "The principal's own Gmail accounts, so Curia can triage their inboxes, draft and send mail, and book on their calendars."
    tier: heavy
    handoff: console
    handoff_path: /settings/email-calendar
    optional: true
    completion_check:
      type: principal_mailbox_ready
    credential_how_to: "Under Settings → Behaviour → Email & Calendar, add each Gmail account with Connect with Google, with the principal beside you, or leave it for onboarding. If sign-in is not available, use Paste a grant ID instead."
    docs_url: /get-started/principal-email-calendar

  - id: google_workspace
    label: "Google Workspace"
    value_prop: "Lets Curia work in Google Docs, Sheets, Slides and Drive under its own Google account."
    tier: heavy
    handoff: console
    handoff_path: /setup
    optional: true
    completion_check:
      type: vault_secrets_all
      keys:
        - curia_google_email
        - google_oauth_client_id
        - google_oauth_client_secret
    credential_how_to: "In the Google Workspace extra on the Setup page, add Curia's Google address and an OAuth client ID and secret from Google Cloud (the project from Email & calendar can be reused). Signing in as Curia still follows the Google Workspace guide."
    docs_url: /get-started/google-docs

  - id: web_research
    label: "Higher web search limit"
    value_prop: "Live web search works out of the box; a Tavily key raises the hourly limit."
    tier: instant
    handoff: console
    handoff_path: /setup
    optional: true
    completion_check:
      type: always_available
    # Keyless Tavily search is free but capped per hour (#2445). The key raises the cap.
    optional_upgrade:
      keys:
        - tavily_api_key
      value_prop: "Raises the web search limit — keyless search is capped at a few dozen searches an hour."
      credential_how_to: "Get a free API key at tavily.com (1,000 searches a month, no card) and paste it in the Higher web search limit extra, or under Settings → Tools → web."
    credential_how_to: null
    docs_url: /integrations/tavily

  - id: web_browser
    label: "Web browser"
    value_prop: "Lets Curia use pages that need JavaScript, sign-ins or forms — runs in its own container, no key needed."
    tier: instant
    handoff: console
    handoff_path: /setup
    optional: true
    completion_check:
      type: browser_ready
    credential_how_to: "The shipped docker-compose.yml runs the browser as the `browser` service: start it with `docker compose up -d browser`, and check it with `docker compose logs browser`. An install whose docker-compose.yml predates that service has none: add it by following \"Upgrading from an older install\" in the web browser docs. Ordinary sites work; bot-protected sites may block it, especially from a datacenter IP."
    docs_url: /integrations/web-browser

  - id: capabilities
    label: "Capabilities"
    value_prop: "Turn Curia's capabilities on or off: meetings, debriefs, web research, projects and tasks, diagnostics and email triage."
    tier: instant
    handoff: console
    handoff_path: /setup
    optional: true
    completion_check:
      type: always_available
    credential_how_to: "Optional: in the Capabilities extra on the Setup page, or later under Settings → Behaviour → Capabilities, switch each capability on or off. Meetings is always on; email triage is left for the principal to choose, later in Settings. Changes apply at the next restart."
    docs_url: /get-started/check-your-setup
