# skills/setup-status/catalog.yaml
# Setup-wizard task catalog. Owned here — not a core module.
# Each completion_check type is implemented in handler.ts.
tasks:
  - id: persona
    label: "Assistant persona & preferences"
    value_prop: "Tune standing preferences and behavioral guidelines — takes one conversation turn, no credentials."
    tier: instant
    handoff: in-chat
    completion_check:
      type: behavioral_preferences
    credential_how_to: null
    docs_url: null

  - id: principal_profile
    label: "How Curia refers to you"
    value_prop: "Your preferred name, pronouns and title, so emails written on your behalf never guess — takes one conversation turn, no credentials."
    tier: instant
    handoff: in-chat
    completion_check:
      type: principal_profile
    credential_how_to: "Tell Curia what to call you, your pronouns and your title; it saves them on your contact. You can also set them in the console under Contacts → your principal."
    docs_url: /core-concepts/how-curia-refers-to-you

  - id: debrief
    label: "Scheduled debrief"
    value_prop: "Regular digest at end of day or end of week — takes one conversation turn, no credentials."
    tier: instant
    handoff: in-chat
    completion_check:
      type: scheduler_has_active_debrief
    credential_how_to: null
    docs_url: null

  - id: capability_tour
    label: "Capability tour"
    value_prop: "See what is ready to use right now — zero setup needed."
    tier: instant
    handoff: in-chat
    completion_check:
      type: always_available
    credential_how_to: null
    docs_url: null

  - id: email
    label: "Email (Nylas)"
    value_prop: "Lets Curia read, draft, and send email on your behalf — unlocks ceo-inbox."
    tier: heavy
    handoff: console
    handoff_path: /channels
    completion_check:
      type: email_channel_ready
    credential_how_to: "Get your Nylas API key at app.nylas.com (free tier works) and connect Curia's mailbox there to get its grant ID. In Settings → Channels → Email, install the channel, save the API key, add the mailbox under Email accounts (name, address, grant ID), then enable the channel and restart."
    docs_url: /channels/email-setup

  - id: signal
    label: "Signal"
    value_prop: "Private, end-to-end encrypted messaging — Curia's highest-trust channel."
    tier: medium
    handoff: console
    handoff_path: /channels
    completion_check:
      type: vault_secrets_all
      keys:
        - channel.signal.socket_path
        - channel.signal.phone_number
    credential_how_to: "Run signal-cli as a JSON-RPC daemon on a Unix socket Curia can reach (the shipped docker-compose.yml does not include it) and register Curia's Signal number with it, then enter the socket path and that number in Settings → Channels → Signal. After enabling, open Contacts → your principal and add your Signal number as a channel identity so outbound principal detection works."
    docs_url: /channels/signal-setup

  - id: slack
    label: "Slack"
    value_prop: "Let your team DM and @mention your agent in Slack — medium-trust workspace messaging."
    tier: medium
    handoff: console
    handoff_path: /channels
    completion_check:
      type: vault_secrets_all
      keys:
        - channel.slack.bot_token
        - channel.slack.app_token
    credential_how_to: "Import Curia's Slack app manifest, name the bot after your office identity, install it into your workspace, then enter the bot token and app-level token in Settings → Channels → Slack. After enabling, open Contacts → your principal and add your Slack user ID (U…) as a channel identity so DMs to you skip the outbound judge."
    docs_url: /channels/slack-setup

  - id: sms
    label: "SMS"
    value_prop: "Two-way text messaging on a dedicated Telnyx office DID — medium-trust SMS for the principal and third parties."
    tier: medium
    handoff: console
    handoff_path: /channels
    completion_check:
      type: vault_secrets_all
      keys:
        - channel.sms.api_key
        - channel.sms.from_number
        - channel.sms.webhook_public_key
    credential_how_to: "Create a Telnyx account (complete Low-Volume Mixed 10DLC for a US long code, or use a Canadian DID outside 10DLC), buy a voice+SMS number, point the Messaging Profile webhook at https://<your-host>/api/webhooks/telnyx/sms, then enter the API key, office DID, and webhook public key in Settings → Channels → SMS. After enabling, open Contacts → your principal and add your personal mobile as an sms channel identity (and optionally CRM phone) so outbound principal detection works. Do not port consumer apps like TextNow as the office DID. Carrier STOP is enforced by Telnyx; Curia records natural-language opt-out as a contact KG fact."
    docs_url: /channels/sms-setup

  - id: voice
    label: "Voice (console)"
    value_prop: "Live duplex spoken conversation from the web console via WebRTC."
    tier: medium
    handoff: console
    handoff_path: /channels
    completion_check:
      type: vault_secrets_all
      keys:
        - channel.voice.livekit_url
        - channel.voice.livekit_api_key
        - channel.voice.livekit_api_secret
        - channel.voice.deepgram_api_key
        - channel.voice.cartesia_api_key
        - channel.voice.cartesia_voice_id
    credential_how_to: "Run a self-hosted LiveKit server (see docs/dev/voice-setup.md), create Deepgram and Cartesia API keys, and pick a Cartesia voice id from play.cartesia.ai, then enter the browser LiveKit signaling URL (wss://…) plus API key/secret, Deepgram and Cartesia keys, and the Cartesia voice ID in Settings → Channels → Voice. Server-side room admin uses channels.voice.livekit_management_url in YAML (compose default http://livekit:7880) — not the public signaling URL. Enable the channel and restart."
    docs_url: /channels/voice-setup

  - id: phone_app
    label: "Phone app"
    value_prop: "Install Curia on your phone, pair it, and hear from it when the chat is closed."
    tier: medium
    handoff: console
    handoff_path: /system/devices
    optional: true
    completion_check:
      type: paired_push_subscription
    credential_how_to: "Needs Curia on an https:// address with a hostname. On a computer, open Settings → System → Devices and show a pairing code. On the phone, open the link or type the code, add Curia to your home screen, then turn on notifications. On http://, a bare IP, or a LAN name, the phone gets the plain mobile site and this task cannot finish."
    docs_url: /channels/phone-app

  - id: web_research
    label: "Web research (Tavily)"
    value_prop: "Live web search for research tasks and news monitoring."
    tier: one-key
    handoff: in-chat
    completion_check:
      type: vault_secrets_all
      keys:
        - tavily_api_key
    credential_how_to: "Get a free API key at tavily.com. I'll send you a secure link to enter it. Web search turns on after the next restart."
    docs_url: /integrations/tavily
