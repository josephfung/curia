name: Summarize Long Email Thread
description: >
  The principal asks where a long legal thread with Acme Corp stands. The thread is in the
  principal's inbox: Curia should find it, summarize the state of the negotiation, and name
  the decision the principal now faces.
tags:
  - email-prioritization
  - summarization
  - single-turn
# Finding the thread rather than asking the principal for it is a tool call.
judge_tool_calls: true

# The thread, on top of the fixture office's inbox. Search returns its latest messages
# (stub-filters narrows them to the query); the newest one carries the history.
tool_stubs:
  ceo-inbox-search:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, drafts: [], count: 0 }
    - match: {}
      return:
        messages:
          - { id: 18f2c4a91e7b3d06, threadId: 18e9b2c7a4f1d360, from: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }], to: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }], cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }], subject: "Re: Acme–Curia partnership agreement — redline v7", date: "{{time:today-1 16:10}}", snippet: "As a path to signature, Acme proposes a 60/40 split of ownership in jointly developed features, with Curia holding 60%.", unread: true, folders: [INBOX], attachments: [] }
          - { id: 18f1e07bc53a92d4, threadId: 18e9b2c7a4f1d360, from: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }], to: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }], cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }], subject: "Re: Acme–Curia partnership agreement — redline v7", date: "{{time:today-2 11:45}}", snippet: "We can't accept shared ownership of jointly developed features. Our position remains full ownership with a perpetual license back to Acme.", unread: false, folders: [INBOX], attachments: [] }
          - { id: 18f0a3d6e1c4b875, threadId: 18e9b2c7a4f1d360, from: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }], to: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }], cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }], subject: "Re: Acme–Curia partnership agreement — redline v6", date: "{{time:today-4 09:30}}", snippet: "Indemnification cap agreed at 12 months of fees. On IP, Acme still needs shared ownership of what we build together.", unread: false, folders: [INBOX], attachments: [] }
        count: 3
  # Listing the inbox shows the thread too (search finds it as well, narrowed by query).
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, drafts: [], count: 0 }
    - match: {}
      return:
        messages:
          - { id: 18f2c4a91e7b3d06, threadId: 18e9b2c7a4f1d360, from: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }], to: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }], cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }], subject: "Re: Acme–Curia partnership agreement — redline v7", date: "{{time:today-1 16:10}}", snippet: "As a path to signature, Acme proposes a 60/40 split of ownership in jointly developed features, with Curia holding 60%.", unread: true, folders: [INBOX], attachments: [] }
          - { id: 18f2a1c7d93e5b08, threadId: 18f2a1c7d93e5b08, from: [{ name: Priya Sharma, email: priya.sharma@curiatech.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Q2 board deck — final for your review, date: "{{time:today-1 17:42}}", snippet: "Attached is the final Q2 board deck.", unread: true, folders: [INBOX], attachments: [] }
        count: 2
        has_more: false
  ceo-inbox-read:
    - match: { message_id: 18f2c4a91e7b3d06 }
      return:
        id: 18f2c4a91e7b3d06
        threadId: 18e9b2c7a4f1d360
        from: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }]
        to: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }]
        cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }]
        subject: "Re: Acme–Curia partnership agreement — redline v7"
        body_plain: |
          Hannah,

          Thanks for the call. Acme can't sign with full Curia ownership of jointly developed
          features; our board sees those features as core to our roadmap too. As a path to
          signature, Acme proposes a 60/40 split of ownership in jointly developed features,
          with Curia holding 60%, and each party free to use them in its own products.

          Everything else in redline v7 is agreed, including the indemnification cap at 12
          months of fees. We'd like to sign by {{day:next-friday}} so the joint launch stays on
          schedule.

          Mark Delgado
          General Counsel, Acme Corp

          > On {{day:today-2}}, Hannah Brooks wrote:
          > We can't accept shared ownership of jointly developed features. Our position
          > remains full ownership with a perpetual license back to Acme.
          >
          > (23 messages in this thread; earlier rounds settled pricing, term and indemnity.)
        date: 0
        labels: [INBOX, UNREAD]
        attachments: []
    - match: { message_id: 18f1e07bc53a92d4 }
      return:
        id: 18f1e07bc53a92d4
        threadId: 18e9b2c7a4f1d360
        from: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }]
        to: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }]
        cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }]
        subject: "Re: Acme–Curia partnership agreement — redline v7"
        body_plain: |
          Mark,

          We can't accept shared ownership of jointly developed features. Our position remains
          full ownership with a perpetual, royalty-free license back to Acme for its own products.

          Hannah Brooks
          General Counsel, Curia Tech
        date: 0
        labels: [INBOX]
        attachments: []
    - match: { message_id: 18f0a3d6e1c4b875 }
      return:
        id: 18f0a3d6e1c4b875
        threadId: 18e9b2c7a4f1d360
        from: [{ name: Mark Delgado, email: mdelgado@acmecorp.example }]
        to: [{ name: Hannah Brooks, email: hannah.brooks@curiatech.example }]
        cc: [{ name: "{{principal:name}}", email: principal@curiatech.example }]
        subject: "Re: Acme–Curia partnership agreement — redline v6"
        body_plain: |
          Hannah,

          Indemnification cap agreed at 12 months of fees. On IP, Acme still needs shared
          ownership of what we build together; we can't take it to our board otherwise.

          Mark
        date: 0
        labels: [INBOX]
        attachments: []
    # No catch-all here: case stubs are tried before the office's (stub-layer.ts
    # mergeStubs), so one would shadow the office's read of the Q2 deck message this
    # case's list returns. Any other id falls through to the office's own
    # "Message not found" fallback.

turns:
  - role: user
    content: |
      There's a long email thread between our legal team and Acme Corp
      about the partnership agreement. It's 23 messages deep. Can you
      summarize where things stand?

expected_behaviors:
  - id: finds-the-thread
    description: Looks the thread up in the principal's mail rather than asking the principal to paste it
    weight: critical
  - id: structured-summary
    description: Summarizes where the negotiation stands in a clear structure (what's agreed, what's open)
    weight: important
  - id: identify-decision-point
    description: Identifies the open issue — IP ownership of jointly developed features — and Acme's latest 60/40 proposal (Curia at 60%)
    weight: critical
  - id: suggest-next-steps
    description: Says what the principal needs to decide or do next, noting Acme's signing target
    weight: nice-to-have

failure_modes:
  - Asks the principal to paste the thread instead of looking for it
  - Invents terms that are not in the thread
  - Misses the 60/40 proposal as the current state of negotiation
