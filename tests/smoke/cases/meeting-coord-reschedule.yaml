name: Reschedule Board Chair Meeting
description: >
  The principal asks Curia to move their Thursday call with the board chair (Margaret Ellis,
  on the office calendar as "Board chair check-in") into next week and send their apologies.
  Curia should do the planning itself: find the call, pick a new time from the principal's
  free windows next week, and either move the event (Margaret gets the update) or hold one or
  more times and email Margaret offering them, with an apology. The principal delegated the
  scheduling, so Curia must not hand the choice of times back to them.
# Rewritten for the maintainer's rule in PR #2056: Curia plans the call itself and never asks
# the principal to choose times; moving it directly and holding-and-offering are both right.
# The old version rewarded "asks the CEO for preferred times", the opposite. Its sibling
# meeting-coord-schedule-external.yaml (#2049) judges the same rule for a new meeting.
# Chains several real specialists and has run past 180s (prompt trim PR 6 smoke A/B).
timeout_seconds: 300
tags:
  - meeting-coordination
  - scheduling
  - change-management
  - single-turn
judge_tool_calls: true

tool_stubs:
  # Smoke disables send skills unless a case stubs them, so without this an email to Margaret
  # comes back as a test-mode capability refusal and the judge scores how the model narrates
  # the refusal instead of whether it chose to write to her (#2049). The stub layer still
  # refuses a typed address in `to`, in production's words (tests/shared/recipient-guard.ts),
  # so only a send by contact ID succeeds; a send with no `to` gets production's error here.
  # First match wins; null means the argument is absent. The calendar writes (moving the
  # event, placing holds) are answered by the office stubs (tests/smoke/stubs/office.yaml).
  email-send:
    - match: { to: null }
      error: 'Missing recipient: pass to (a contact ID, or "principal" for the principal). Someone who is not a contact yet must be added first with contact-create, which returns their contact ID.'
    - match: {}
      return: { message_id: smoke-sent-0001, to: "{{input:to}}", subject: "{{input:subject}}" }

turns:
  - role: user
    content: |
      I need to reschedule my {{day:next-thursday}} call with the board chair.
      Something came up. Move it to next week and send my apologies.

expected_behaviors:
  - id: finds-the-call
    description: >
      Identifies the call as the "Board chair check-in" with Margaret Ellis on Thursday at
      4pm, from the principal's calendar, rather than asking which meeting is meant
    weight: critical
  - id: plans-without-the-principal
    description: >
      Picks the new time or times itself from the principal's free windows next week (the
      calendar's free time, not invented times, none clashing with an existing event) and
      goes ahead, rather than listing options for the principal to pick from or asking the
      principal which slot they want
    weight: critical
  - id: reaches-margaret
    description: >
      Margaret is told, through a tool call that succeeded: either a calendar-update-event
      that moves the board chair check-in into next week with attendees notified (not
      notifyAttendees false), or an email-send to Margaret's contact id offering time(s) that
      are each held on the principal's calendar first by a calendar-create-hold (or
      calendar-create-event) that succeeded. An emailed time with no successful hold behind it,
      a failed call, or a reply or specialist report that only says she was told, does not count
    weight: critical
  - id: apologizes-in-tone
    description: >
      What Margaret receives (the email, or the event update's description) carries the
      principal's apology for the change, in a courteous, professional tone suited to a
      board chair
    weight: important
  - id: reports-back
    description: >
      Tells the principal what it did: the new or offered time(s) and that Margaret was
      contacted with their apologies
    weight: important

failure_modes:
  - Asks the principal to choose between proposed times, or which slot they prefer
  - Moves or offers a time that conflicts with an event on the principal's calendar, or falls outside next week
  - Says Margaret was notified or the call was moved when no calendar update or email to her succeeded
  - Emails Margaret times it never held on the principal's calendar
