name: Draft Email in CEO Voice
description: >
  The principal asks for a decline to TechTO's April speaking invite, warm but brief and
  leaving the door open. The organizer, Maya Fischer, is a contact with no email on file;
  her invite is in the principal's mail. Curia should find her address there, save a
  draft decline in the principal's voice (a reply on the invite, or a new email to her
  address), and tell the principal it is saved. Judge the voice behaviors on the body
  passed to ceo-inbox-draft-reply or ceo-inbox-draft-compose, not on the chat reply.
tags:
  - profile
  - voice-matching
  - single-turn
# The draft lives in a tool call (#2014): the chat reply only says it is saved.
judge_tool_calls: true

# Contact writes are stubbed so a gated retry starts clean: a real contact-register would
# leave Maya's address in the run's database, and the retry would then find it on file and
# skip the search this case is testing.
tool_stubs:
  contact-register:
    - match: {}
      return: { contact_id: 7d1c2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f, display_name: "{{input:displayName}}", contact_confidence: 0.1, created: true }
  contact-update:
    - match: {}
      return: { contact_id: "{{input:contact_id}}", updated_fields: [] }

turns:
  - role: user
    content: |
      I need you to draft a decline email to a speaking engagement
      invite. I usually keep these warm but brief. The invite is from
      TechTO for their April event. I want to leave the door open
      for future opportunities.

expected_behaviors:
  - id: resolves-from-mail
    description: >
      Finds the invite or Maya Fischer's address (maya.fischer@techto.example) in the
      principal's mail and drafts to it, rather than asking the principal for the address
    weight: critical
  - id: warm-but-concise
    description: The drafted email body is a decline that is warm in tone but concise in length
    weight: critical
  - id: professional-not-stiff
    description: The drafted email body is professional but approachable, not overly formal or corporate
    weight: important
  - id: leave-door-open
    description: The drafted email body explicitly leaves the door open for future engagement
    weight: important
  - id: reports-saved-draft
    description: The reply tells the principal the draft is saved (in their drafts) and who it is addressed to
    weight: important

failure_modes:
  - Asks the principal for the organizer's email address
  - Addresses the draft to anything other than maya.fischer@techto.example
  - Drafts something overly formal or corporate-sounding
  - Makes the decline too long or over-explains
  - Doesn't leave the door open for future opportunities
  - Sends the email instead of saving a draft
