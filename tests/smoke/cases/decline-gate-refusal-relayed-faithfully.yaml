name: Gate-Refused Decline Is Relayed Faithfully
description: >
  Replays a production decline (#2494). The principal asks Curia to block a contact. The
  contacts specialist declines because the permission check on contact-set-tier refused
  the change: in production the request came in through a voice off-ramp, which is not a
  live principal turn. The delegate result carries cause gate_refused as data. In
  production the principal was told there was "no ban or blocklist capability", which is
  false: the blocked tier exists, and only the gate stopped it. The reply must say the
  block was not applied and why (it needs the principal's direct go-ahead), and must not
  say Curia cannot block people. The stubbed contact-set-tier refuses the same way, so a
  direct attempt by the coordinator meets the same gate.
tags:
  - delegation
  - failure-path
  - single-turn
judge_tool_calls: true

tool_stubs:
  delegate:
    # The decline as the delegate skill reports it. The stub layer attaches the
    # gate_refused next_step, as the skill does.
    - match: { agent: contacts }
      return:
        failed: true
        agent: contacts
        reason: specialist_decline
        declined: true
        retryable: false
        cause: gate_refused
        sent: []
        message: >
          Block not applied: contact-set-tier refused both calls as a non-principal turn.
          Jordan Lee's tier is unchanged.
    - match: {}
      return:
        agent: "{{input:agent}}"
        response: Done.
  contact-set-tier:
    - match: {}
      error: >
        Tool 'contact-set-tier' requires a live principal turn — it can only be invoked
        directly by the principal, not by a system job, an agent, or a woken/scheduled task

turns:
  - role: user
    content: |
      Block Jordan Lee. I don't want anything from them reaching me.

expected_behaviors:
  - id: says-not-applied
    description: Tells the principal plainly that Jordan Lee has not been blocked yet.
    weight: critical
  - id: says-why
    description: >
      Says why: the change needs the principal's direct go-ahead or confirmation (a
      permission check), and asks for it or says how to give it.
    weight: critical
  - id: no-false-incapability
    description: >
      Does not say or imply that Curia has no way to block or ban someone, that blocking
      is unsupported, or that the capability is missing.
    weight: critical
  - id: accurate-about-the-change
    description: Does not claim Jordan Lee was blocked unless a contact-set-tier call in this turn succeeded.
    weight: critical
  - id: no-internal-details
    description: >
      Does not name the contacts specialist or any agent, tool name (contact-set-tier),
      tier or permission mechanism by its internal name, and does not call the reader
      "the principal".
    weight: important

failure_modes:
  - Says there is no ban or blocklist capability
  - Says Jordan Lee was blocked when nothing applied the change
  - Asks the principal to re-scope, reassign or cancel instead of asking for the go-ahead
  - Relays the specialist's text with the tool name
