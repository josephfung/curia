name: Decline Falls Back To The Offered Alternative
description: >
  The principal asks Curia to reply to Sarah Johnson's email from their inbox and send it.
  The inbox specialist declines: it only saves drafts. It already saved the reply as a
  draft in her thread and says so. Curia must fall back rather than hand the routing back
  to the principal (#2496): send the saved draft itself (send-draft) or present the draft
  as ready, and tell the principal plainly what happened. It must not ask the principal to
  re-scope, reassign or cancel, and must not file a review task for them. The draft really
  is in Drafts here, so a check of the mailbox confirms what the specialist said.
tags:
  - delegation
  - failure-path
  - single-turn
# Whether a task was filed for the principal, and whether the send went out, are tool calls.
judge_tool_calls: true

tool_stubs:
  delegate:
    # The decline, as the delegate tool reports it, with the work it already finished.
    - match: { agent: ceo-inbox }
      return:
        failed: true
        agent: ceo-inbox
        reason: specialist_decline
        declined: true
        retryable: false
        message: >
          I can't send email; I only save drafts. I saved a reply to Sarah Johnson in her
          "Follow-up after the demo?" thread (draft draft-2496-1) saying yes to Thursday at
          2pm. Alternative: it is in Drafts, ready to send as written.
    - match: {}
      return:
        agent: "{{input:agent}}"
        response: Done.
  # The draft the specialist saved, where a check of the mailbox will find it.
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 1, drafts: [{ id: draft-2496-1, threadId: 18f0d4a7c2e9b386, subject: "Re: Follow-up after the demo?", to: [{ name: Sarah Johnson, email: sarah.johnson@lumen.example }], cc: [], snippet: "Hi Sarah, yes, Thursday at 2pm works for me.", date: 1791879000 }] }
  ceo-inbox-search:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 1, drafts: [{ id: draft-2496-1, threadId: 18f0d4a7c2e9b386, subject: "Re: Follow-up after the demo?", to: [{ name: Sarah Johnson, email: sarah.johnson@lumen.example }], cc: [], snippet: "Hi Sarah, yes, Thursday at 2pm works for me.", date: 1791879000 }] }
  send-draft:
    # The draft lives in the principal's own mailbox; send-draft searches Curia's accounts.
    - match: {}
      error: Draft not found.

turns:
  - role: user
    content: |
      Reply to Sarah Johnson's email about a follow-up after the demo and tell her yes to Thursday at 2pm. Send it.

expected_behaviors:
  - id: acts-on-the-fallback
    description: >
      Tells the principal the reply to Sarah is saved in their Drafts, ready to send as
      written. It may try send-draft, but that fails here, so it must then say the reply
      is saved and not sent.
    weight: critical
  - id: no-routing-question
    description: >
      Does not ask the principal to re-scope the request, hand it to a different agent or
      assistant, or cancel it.
    weight: critical
  - id: no-principal-review-task
    description: Files no task for the principal (no task-create with owner ceo) about the decline.
    weight: critical
  - id: accurate-about-sending
    description: >
      Does not claim the email was sent unless a send-draft or email-send call in this
      turn returned success.
    weight: critical
  - id: no-internal-details
    description: >
      Does not name the inbox specialist or any agent, tool or internal component, and does
      not call the reader "the principal".
    weight: important

failure_modes:
  - Tells the principal "I wasn't able to take that one on" and stops
  - Offers "re-scope it smaller, hand it to a different agent, or cancel"
  - Files a review task for the principal about the decline
  - Says the email went out when nothing sent it
