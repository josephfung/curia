name: Triage Batch of Mixed Emails
description: Agent should prioritize and categorize a batch of emails by urgency and action type, surfacing what needs CEO attention first
# Chains several real specialists and has run past 180s (prompt trim PR 6 smoke A/B).
timeout_seconds: 300
tags:
  - email-prioritization
  - urgency
  - multi-task
  - single-turn

# Test mode gives the execution layer no bullpen service, so a real post fails. Triage
# may escalate an urgent item to the coordinator, or consult calendar about a meeting
# request; those posts succeed with their own thread ids. Anything else (another bullpen
# tool, a missing participant) still fails loudly. Case-level only: targeted cases drive
# real bullpen threads.
tool_stubs:
  bullpen-post:
    - match: { participants: [coordinator] }
      return: { thread_id: thread-0001, message_id: bullpen-msg-0001, deduplicated: false }
    - match: { participants: [calendar] }
      return: { thread_id: thread-0002, message_id: bullpen-msg-0002, deduplicated: false }

# Triage reads the fixture office's inbox (stubs/office.yaml): seven unread, among them a
# same-day board-matter call request, the Globex renewal due next Friday, a customer
# complaint Daniel Okafor forwarded, a board deck to review, a meeting request, an invoice
# and a newsletter. The prompt used to claim "50 unread" with three meeting requests and two
# newsletters; Curia rightly corrected it from the real mailbox, and the judge then graded
# against the prompt's list (2026-11-16 gate). The expectations name the office's messages.
turns:
  - role: user
    content: |
      My inbox is piling up: invoices, meeting requests, a customer
      complaint, newsletters, a contract deadline. Walk me through
      what needs my attention first.

expected_behaviors:
  - id: prioritize-critical
    description: >
      Puts the time-critical items first: Elena Ruiz's request for a call today on a board
      matter, the Globex contract renewal that must be countersigned by next Friday, and the
      Northwind customer complaint Daniel Okafor forwarded. Any order among these three is fine,
      as long as all three come before the deck review, the meeting request, the invoice and
      the newsletter.
    weight: critical
  - id: group-by-action
    description: >
      Says what each item needs from the principal (call, sign, reply, review, hand off, or no
      action), whether the walkthrough is grouped by action or by urgency.
    weight: important
  - id: identify-delegatable
    description: >
      Treats the Acme invoice as routine (no action from the principal now, or one for
      accounts payable) and the Lumen meeting request as lower priority than the three
      time-critical items.
    weight: important
  - id: flag-archive
    description: Flags the newsletter as archive-worthy or low priority
    weight: nice-to-have

failure_modes:
  - Treats all items as equal priority
  - Misses the contract deadline or the same-day board call
  - Puts the newsletter ahead of the customer complaint
  - Lists everything without saying what each item needs
