      count: 7
ceo-inbox-search:
  - match: { folder: DRAFTS }
    return: { folder: DRAFTS, drafts: [], count: 0 }
  - match: {}
    return: *inbox

ceo-inbox-read:
  - match: { message_id: msg-investor-1 }
    return: { id: msg-investor-1, threadId: thr-investor-1, from: [{ name: Elena Ruiz, email: elena.ruiz@northstar.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Need to talk today — board matter, body_plain: "Hi {{principal:first}},\n\nSomething came up on the board side that I'd rather not put in writing. Can you get on a call with me today? Any time after 1pm works.\n\nElena", date: 0, labels: [INBOX, UNREAD], attachments: [] }
  - match: { message_id: msg-deck-1 }
    return: { id: msg-deck-1, threadId: thr-deck-1, from: [{ name: Priya Sharma, email: priya.sharma@curiatech.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Q2 board deck — final for your review, body_plain: "Hi {{principal:first}},\n\nAttached is the final Q2 board deck. Pages 4 (ARR bridge) and 9 (hiring plan) changed since the draft.\n\nPriya", date: 0, labels: [INBOX, UNREAD], attachments: [{ id: att-deck-1, filename: Q2-board-deck-final.pdf, contentType: application/pdf, size: 2481152 }] }
  - match: {}
    error: Message not found in this mailbox.

ceo-inbox-draft-reply:
  - match: {}
    return: { draft_id: draft-0001, subject: Re, to: [], cc: [] }
ceo-inbox-draft-compose:
  - match: {}
    return: { draft_id: draft-0002, subject: "{{input:subject}}", to: "{{input:to}}", cc: [] }
ceo-inbox-mark-read:
  - match: {}
    return: { marked_read: true }
ceo-inbox-archive:
  - match: {}
    return: { archived: true }

# The coordinator's own mailbox (Curia's), separate from the principal's.
email-list:
  - match: {}
    return: { messages: [], count: 0 }

# ── Tasks, scheduler, docs, approvals ──────────────────────────────────────

task-list:
  - match: {}
    return: { tasks: [], count: 0, displayTimezone: "{{timezone}}" }
task-create:
  - match: {}
    return:
      task_id: 0e5d6c7b-1a2b-4c3d-8e9f-000000000001
      title: "{{input:title}}"
      status: open
      owner: "{{input:owner}}"
      priority: 3
      tags: []
      created_at: "{{at:now}}"
      displayTimezone: "{{timezone}}"
task-update:
  - match: {}
    return: { task_id: "{{input:task_id}}", title: (updated), status: open, updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
task-complete:
  - match: {}
    return: { task_id: "{{input:task_id}}", title: (completed), status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }

scheduler-list:
  - match: {}
    return: { jobs: [], count: 0, truncated: false, limit: 50, displayTimezone: "{{timezone}}" }
scheduler-create:
  - match: {}
    return: { jobId: 0f0f0f0f-0000-4000-8000-000000000001 }
scheduler-update:
  - match: {}
    return: { jobId: "{{input:job_id}}", action: "{{input:action}}" }
scheduler-cancel:
  - match: {}
    return: { cancelled: true, jobId: "{{input:job_id}}" }

doc-search:
  - match: {}
    return: { query: "{{input:query}}", path_prefix: "/", match_count: 0, matches: [] }
doc-list:
  - match: {}
    return: { directory: /, index_path: /index.md, manifest: "# Documents\n\n(no documents)", document_count: 0, documents: [], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
doc-read:
  - match: {}
    error: Document not found.

list-pending-actions:
  - match: {}
    return: { pending: [], message: No pending approval requests. }
activity-log:
  - match: {}
    return: { actions: [], count: 0, displayTimezone: "{{timezone}}" }

# No headless browser in test mode; web-fetch (a plain read) still runs for real.
web-browser:
  - match: {}
    error: The browser is not available right now.
