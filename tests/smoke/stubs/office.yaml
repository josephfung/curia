calendar-find-free-time:
  - match: {}
    return:
      displayTimezone: "{{timezone}}"
      freeWindows:
        - { start: "{{time:next-monday 11:00}}", end: "{{time:next-monday 14:00}}" }
        - { start: "{{time:next-monday 15:00}}", end: "{{time:next-monday 17:00}}" }
        - { start: "{{time:next-tuesday 09:00}}", end: "{{time:next-tuesday 13:00}}" }
        - { start: "{{time:next-tuesday 14:00}}", end: "{{time:next-tuesday 17:00}}" }
        - { start: "{{time:next-thursday 11:00}}", end: "{{time:next-thursday 16:00}}" }
        - { start: "{{time:next-friday 12:00}}", end: "{{time:next-friday 14:00}}" }

calendar-check-conflicts:
  - match: {}
    return: { conflicts: [], clear: true, displayTimezone: null }

calendar-create-event:
  - match: {}
    return:
      displayTimezone: "{{timezone}}"
      event:
        id: evt-created-0001
        title: "{{input:title}}"
        description: "{{input:description}}"
        location: "{{input:location}}"
        startTime: "{{input:start}}"
        endTime: "{{input:end}}"
        participants: "{{input:attendees}}"
        conferencing: "{{input:conferencing}}"
        status: confirmed
        calendarId: cal-principal-work
        busy: true

# Only the id: echoing fields the call didn't set would read as "cleared". The case's
# CalendarState applies the changed fields to later listings (stub-filters.ts).
calendar-update-event:
  - match: {}
    return:
      displayTimezone: "{{timezone}}"
      event:
        id: "{{input:eventId}}"
        status: confirmed
        calendarId: cal-principal-work

calendar-create-hold:
  - match: {}
    return:
      held: true
      holdEventId: evt-hold-0001
      display: "{{input:start}} -- {{input:end}}"
      displayTimezone: "{{timezone}}"

calendar-delete-event:
  - match: {}
    return: { deleted: true }

# ── Principal's inbox (ceo-inbox) ──────────────────────────────────────────

ceo-inbox-list:
  - match: { folder: DRAFTS }
    return: { folder: DRAFTS, drafts: [], count: 0 }
  - match: {}
    return: &inbox
      messages:
        - { id: msg-investor-1, threadId: thr-investor-1, from: [{ name: Elena Ruiz, email: elena.ruiz@northstar.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Need to talk today — board matter, date: "{{at:now-45m}}", snippet: "Something came up on the board side that I'd rather not put in writing. Can you get on a call with me today?", unread: true, folders: [INBOX], attachments: [] }
