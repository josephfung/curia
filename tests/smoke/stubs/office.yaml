ceo-inbox-search:
  - match: { folder: DRAFTS }
    return: { folder: DRAFTS, drafts: [], count: 0 }
  - match: {}
    return: *inbox

ceo-inbox-read:
  # One entry per message ceo-inbox-list returns. A listed message the agent cannot open
  # turns triage into a retry loop that exhausts the specialist's error budget, so the
  # case measures the harness instead of the model.
  - match: { message_id: 18f2d9e40b6c1a73 }
    return: { id: 18f2d9e40b6c1a73, threadId: 18f2d9e40b6c1a73, from: [{ name: Elena Ruiz, email: elena.ruiz@northstar.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Need to talk today — board matter, body_plain: "Hi {{principal:first}},\n\nSomething came up on the board side that I'd rather not put in writing. Can you get on a call with me today? Any time after 1pm works.\n\nElena", date: 0, labels: [INBOX, UNREAD], attachments: [] }
  - match: { message_id: 18f2a1c7d93e5b08 }
    return: { id: 18f2a1c7d93e5b08, threadId: 18f2a1c7d93e5b08, from: [{ name: Priya Sharma, email: priya.sharma@curiatech.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Q2 board deck — final for your review, body_plain: "Hi {{principal:first}},\n\nAttached is the final Q2 board deck. Pages 4 (ARR bridge) and 9 (hiring plan) changed since the draft.\n\nPriya", date: 0, labels: [INBOX, UNREAD], attachments: [{ id: ANGjdJ8x2Q4fQ2RlY2s, filename: Q2-board-deck-final.pdf, contentType: application/pdf, size: 720 }] }
  - match: { message_id: 18eff2b6a1d8c530 }
    return: { id: 18eff2b6a1d8c530, threadId: 18eff2b6a1d8c530, from: [{ name: Maya Fischer, email: maya.fischer@techto.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: "Speaking at TechTO in April?", body_plain: "Hi {{principal:first}},\n\nWe'd love to have you on the main stage at our April event: a 20-minute talk on building AI products in Toronto, followed by a short Q&A. About 400 founders and engineers attend.\n\nWould you be up for it? Happy to jump on a call if that's easier.\n\nMaya Fischer\nProgramming Lead, TechTO", date: 0, labels: [INBOX], attachments: [] }
  - match: { message_id: 18f1f6b2e8a4c917 }
    return: { id: 18f1f6b2e8a4c917, threadId: 18f1f6b2e8a4c917, from: [{ name: Contracts Desk, email: contracts@globex.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: "Contract renewal — signature needed by {{weekday:next-friday}}", body_plain: "Hello,\n\nYour Globex master agreement renews on {{date:next-friday}}. Please countersign the renewal order by end of day {{weekday:next-friday}}. After that the current terms lapse and service moves to month-to-month at list price.\n\nGlobex Contracts Desk", date: 0, labels: [INBOX, UNREAD], attachments: [] }
  - match: { message_id: 18f2b5d81c7e4a29 }
    return: { id: 18f2b5d81c7e4a29, threadId: 18f2b5d81c7e4a29, from: [{ name: Daniel Okafor, email: daniel.okafor@curiatech.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: "Fwd: Unacceptable outage response", body_plain: "{{principal:first}}, forwarding below. Northwind's COO is unhappy with how we handled Tuesday's outage, and they renew this quarter. I think this needs a call from you this week.\n\nDaniel\n\n---------- Forwarded message ----------\nFrom: Northwind COO <coo@northwind.example>\nSubject: Unacceptable outage response\n\nWe were down for four hours on Tuesday and heard nothing from your team for the first two. That is not the partnership we signed up for, and it will come up at renewal.", date: 0, labels: [INBOX, UNREAD], attachments: [] }
  - match: { message_id: 18f0c8e3a6d2b154 }
    return: { id: 18f0c8e3a6d2b154, threadId: 18f0c8e3a6d2b154, from: [{ name: Acme Logistics Billing, email: billing@acmelogistics.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Invoice 4471 — due in 30 days, body_plain: "Hello,\n\nPlease find attached invoice 4471 for September services. Payment is due within 30 days.\n\nAcme Logistics Billing", date: 0, labels: [INBOX, UNREAD], attachments: [{ id: ANGjdJ9k1V0aW52b2lj, filename: invoice-4471.pdf, contentType: application/pdf, size: 803 }] }
  - match: { message_id: 18f0d4a7c2e9b386 }
    return: { id: 18f0d4a7c2e9b386, threadId: 18f0d4a7c2e9b386, from: [{ name: Sarah Johnson, email: sarah.johnson@lumen.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: Follow-up after the demo?, body_plain: "Hi {{principal:first}},\n\nThanks again for the September demo. Could we find 30 minutes next week to go through pricing? Tuesday or Thursday afternoon works best on our side.\n\nSarah Johnson\nFounder and CEO, Lumen Analytics", date: 0, labels: [INBOX, UNREAD], attachments: [] }
  - match: { message_id: 18f1a9e5d3c7b042 }
    return: { id: 18f1a9e5d3c7b042, threadId: 18f1a9e5d3c7b042, from: [{ name: SaaS Weekly, email: newsletter@saasweekly.example }], to: [{ name: "{{principal:name}}", email: principal@curiatech.example }], cc: [], subject: "SaaS Weekly: pricing pages that convert", body_plain: "This week: five pricing page teardowns, and why an annual-plan toggle converts better than you'd think.\n\nYou are receiving this because you subscribed to SaaS Weekly. Unsubscribe: https://saasweekly.example/unsubscribe", date: 0, labels: [INBOX, UNREAD], attachments: [] }
  - match: {}
    error: Message not found in this mailbox.

# Small, valid one-page PDFs, so file-parse (pdf-parse, local) extracts their text. Any
# other attachment id is not in this mailbox.
ceo-inbox-download-attachment:
  - match: { attachment_id: ANGjdJ9k1V0aW52b2lj }
    return: { filename: invoice-4471.pdf, content_type: application/pdf, size: 803, content_base64: "" }
  - match: { attachment_id: ANGjdJ8x2Q4fQ2RlY2s }
    return: { filename: Q2-board-deck-final.pdf, content_type: application/pdf, size: 720, content_base64: "" }
  - match: {}
    error: Attachment not found in this mailbox.

ceo-inbox-draft-reply:
  # The real skill reports the reply-all recipients; a bare `to: []` reads as "addressed to nobody".
  - match: { reply_to_message_id: 18eff2b6a1d8c530 }
    return: { draft_id: draft-0001, subject: "Re: Speaking at TechTO in April?", to: [{ name: Maya Fischer, email: maya.fischer@techto.example }], cc: [] }
  - match: {}
    return: { draft_id: draft-0001, subject: Re, to: [], cc: [] }
ceo-inbox-draft-compose:
  - match: {}
    return: { draft_id: draft-0002, subject: "{{input:subject}}", to: "{{input:to}}", cc: [] }
# Triage writes (ceo-inbox SKILL.md): test mode withholds the mailbox credentials, so
# these would fail for real. Shadow drafts have no working-docs repo in test mode, so
# the stub reports what that path reports: nothing captured, with the reason.
ceo-inbox-label:
  - match: {}
    return: { success: true, message_id: "{{input:message_id}}", applied: "{{input:labels}}", created: [], folders: [] }
ceo-inbox-mark-starred:
  - match: { starred: false }
    return: { success: true, message_id: "{{input:message_id}}", starred: false }
  - match: {}
    return: { success: true, message_id: "{{input:message_id}}", starred: true }
ceo-inbox-shadow-draft:
  - match: {}
    return: { captured: false, skipped_reason: shadow drafts are not recorded in this office }
ceo-inbox-draft-edit:
  - match: {}
    return: { draft_id: "{{input:draft_id}}", subject: "{{input:subject}}", to: "{{input:to}}", cc: "{{input:cc}}" }
ceo-inbox-mark-read:
  - match: {}
    return: { marked_read: true }
ceo-inbox-archive:
  - match: {}
    return: { archived: true }
# Succeeds without listing folders: the real result lists folder ids, which no case reads.
ceo-inbox-update-folders:
  - match: {}
    return: { success: true, message_id: "{{input:message_id}}", folders: [], created: [], removed_unresolved: [] }

# ── Attachments ────────────────────────────────────────────────────────────

# file-parse needs infraLlm, which test mode does not provide. These answer only for the
# exact bytes ceo-inbox-download-attachment returns above, so any other file still gets
# test mode's missing-capability error. The text is what pdf-parse extracts from them.
file-parse:
  - match: { content_base64: "", extract_as: invoice }
    return: { type: pdf, raw_text: "Acme Logistics Inc. - INVOICE 4471\nBill to: CuriaTech\nPeriod: September freight and warehousing services\nAmount due: USD 18,450.00\nTerms: Net 30 from invoice date\nRemit to: billing@acmelogistics.example", structured: { vendor: Acme Logistics Inc., invoice_number: "4471", amount_due: 18450.00, currency: USD, payment_terms: Net 30 from invoice date, description: September freight and warehousing services }, confidence: 0.95 }
  - match: { content_base64: "" }
    return: { type: pdf, raw_text: "Acme Logistics Inc. - INVOICE 4471\nBill to: CuriaTech\nPeriod: September freight and warehousing services\nAmount due: USD 18,450.00\nTerms: Net 30 from invoice date\nRemit to: billing@acmelogistics.example", structured: null, confidence: 1.0 }
  - match: { content_base64: "" }
    return: { type: pdf, raw_text: "Q2 Board Deck - FINAL\np.4 ARR bridge: updated since the draft\np.9 Hiring plan: updated since the draft\nPrepared by Priya Sharma", structured: null, confidence: 1.0 }

# The coordinator's own mailbox (Curia's), separate from the principal's.
email-list:
