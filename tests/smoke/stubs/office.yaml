# The fixture office every smoke case runs in (#1956): the principal's calendar, inbox,
# task list and scheduler, for the tools test mode cannot reach. Tried after a case's own
# tool_stubs, so a case overrides any of it. The people named here are seeded as real
# contacts (fixtures/people.yaml).
#
# Dates are relative to the day the suite runs (date-placeholders.ts), and list/search
# results are narrowed to the call's time range or query (stub-filters.ts), so one
# fixture answers "today", "Wednesday" and "mail from Priya" alike. Writes succeed and
# echo their inputs ({{input:…}}). Without this office the specialists find every
# system down and decline, and a case can only test how Curia says "I couldn't".

# ── Calendar ───────────────────────────────────────────────────────────────

calendar-list-calendars:
  - match: {}
    return:
      calendars:
        - id: cal-principal-work
          name: Work
          description: ""
          timezone: "{{timezone}}"
          isPrimary: true
          readOnly: false
          isOwnedByUser: true
          registered: true
          contactId: "{{principal:contact_id}}"
          contactName: "{{principal:name}}"
          registryLabel: primary

