# ceo-inbox's housekeeping on a message it handled, for cases that run it for real
# (#2027): labelling, filing, archiving, marking read, recording the sender and what it
# learned. Scoped to ceo-inbox. Each succeeds; a case that scores one of these stubs it itself.
ceo-inbox-label:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg, applied: ["✍️ Drafted"], created: [], folders: [INBOX, "✍️ Drafted"] }
ceo-inbox-update-folders:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg, folders: [INBOX, "✍️ Drafted"], created: [], removed_unresolved: [] }
ceo-inbox-archive:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg }
ceo-inbox-mark-read:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg }
ceo-inbox-mark-starred:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg, starred: true }
memory-store:
  - agent: ceo-inbox
    match: {}
    return: { stored: true, action: created, node_id: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8, sensitivity: internal }
# Sending from the principal's mailbox (#2474): refused as production refuses a send nobody
# asked for on a live turn (PRINCIPAL_SEND_REFUSALS.not_requested in
# src/skills/outbound-gateway.ts; keep the two in step). A through_gateway case runs the real tool.
ceo-inbox-send-draft:
  - agent: ceo-inbox
    match: {}
    error: "Curia sends from the principal's mailbox only when the principal asks on a live turn. Nothing was sent; the draft is still in their Drafts folder."
# The sender is the case's seeded Sam Rivera, already a contact. ceo-inbox threads this
# contact_id into later calls (entity-context runs for real), so it must be the seeded row:
# a case using this set must seed contact `sam` (the loader rejects one that does not).
contact-register:
  - agent: ceo-inbox
    match: {}
    return: { contact_id: "{{contact:sam}}", display_name: Sam Rivera, contact_confidence: 0.9, created: false, verified: true }
# Two principal mailboxes (#2475): `work` (Work, a company domain) and `personal` (Personal, a
# consumer account). A compose with a stated mailbox succeeds in that mailbox; the case stubs
# the no-mailbox call (needs_mailbox plus the evidence), which differs per case. Evidence that
# agrees gets the handler's result for it (chosenAccountFields in
# src/principal-mailboxes/evidence.ts; keep the two in step): no label, and the note.
ceo-inbox-draft-compose:
  - agent: ceo-inbox
    match: { mailbox: work }
    return: { draft_id: draft-r7f3a9c2, mailbox: work, evidence: agrees, account_note: "The history with these recipients all points to this account, so the choice was obvious: leave the account out of what you report (no account or calendar line, no account name, no account address)." }
  - agent: ceo-inbox
    match: { mailbox: personal }
    return: { draft_id: draft-r4b81d6e, mailbox: personal, evidence: agrees, account_note: "The history with these recipients all points to this account, so the choice was obvious: leave the account out of what you report (no account or calendar line, no account name, no account address)." }
