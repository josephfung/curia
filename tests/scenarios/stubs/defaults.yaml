# Applied to EVERY case, after the case's own stubs and its stub_sets (so either can
# override). An "empty office": reads that cannot run in test mode — no mail client, no
# task, working-docs or approval services — answer as a quiet day instead of failing.
#
# Without these the model sees tool failures production never shows and spirals (one
# early run made 29 calls in 131s chasing a broken email-list). Only reads, the harmless
# task-create, and follow-ups on the task it returns belong here; a case that tests a
# write stubs it itself. task-update and task-complete answer only for the one task
# task-create returns (#2059).
email-list:
  - match: {}
    return: { messages: [], count: 0 }
email-get:
  - match: {}
    error: Message not found in this mailbox.
email-get-thread:
  - match: {}
    error: No messages found for this thread in this mailbox.
email-list-folders:
  - match: {}
    return: { folders: [{ id: INBOX, name: Inbox }], count: 1 }
doc-search:
  - match: {}
    return: { query: "", path_prefix: "/", match_count: 0, matches: [] }
doc-read:
  - match: {}
    error: Document not found.
doc-list:
  - match: {}
    return:
      directory: /
      index_path: /index.md
      manifest: "# Documents\n\n(no documents)"
      document_count: 0
      documents: []
      updated_at: "2026-10-01T09:00:00-04:00"
      displayTimezone: America/Toronto
scheduler-list:
  - match: {}
    return: { jobs: [], count: 0, truncated: false, limit: 50, displayTimezone: America/Toronto }
task-list:
  - match: {}
    return: { tasks: [], count: 0, displayTimezone: America/Toronto }
activity-log:
  - match: {}
    return: { actions: [], count: 0, displayTimezone: America/Toronto }
# Semantic search needs the knowledge graph, which test mode does not serve. An empty
# result is a quiet office; a refusal here is a failure production never shows (#2059).
memory-query:
  - match: {}
    return: { results: [], count: 0 }
# Test mode has no executive profile service. This is the profile a new deployment
# seeds from config/executive-profile.yaml, with the summary the tool builds from it.
executive-profile-get:
  - match: {}
    return:
      profile:
        writingVoice:
          tone: [direct, warm]
          formality: 50
          patterns: [Concise and to the point, Professional but approachable]
          vocabulary: { prefer: [], avoid: [] }
          signOff: ""
          guide: ""
      summary: "Tone: direct, warm\nFormality: 50/100\n\nWriting patterns:\n  - Concise and to the point\n  - Professional but approachable"
list-pending-actions:
  - match: {}
    return: { pending: [], message: No pending approval requests. }
config-store:
  - match: { action: list_namespaces }
    return: { namespaces: [] }
  - match: { action: retrieve }
    return: { found: false }
task-create:
  - match: {}
    return:
      task_id: 0e5d6c7b-1a2b-4c3d-8e9f-000000000001
      title: (created)
      status: open
      owner: curia
      priority: 3
      tags: []
      created_at: "2026-10-01T12:00:00-04:00"
      displayTimezone: America/Toronto
# A headless browser is not available to scenario runs; web-fetch (a plain read) still
# passes through.
web-browser:
  - match: {}
    error: The browser is not available right now.
# Inbox housekeeping on an inbound email: legitimate, and harmless as a stub.
email-mark-read:
  - match: {}
    return: { marked_read: true }
email-archive:
  - match: {}
    return: { archived: true }
# Completing the task task-create above returned, and only that one: closing any other
# task is a write a case must stub itself, so it is still refused and trips the gate.
task-complete:
  - match: { task_id: 0e5d6c7b-1a2b-4c3d-8e9f-000000000001 }
    return:
      task_id: 0e5d6c7b-1a2b-4c3d-8e9f-000000000001
      title: (completed)
      status: done
      completed_at: "2026-10-01T12:05:00-04:00"
      displayTimezone: America/Toronto
# Updating the task task-create above returned, and only that one. task-update takes
# status, so a catch-all would close any other task unseen. Editing a different task
# is a write a case must stub itself; it is refused and counted (#2059).
task-update:
  - match: { task_id: 0e5d6c7b-1a2b-4c3d-8e9f-000000000001 }
    return:
      task_id: 0e5d6c7b-1a2b-4c3d-8e9f-000000000001
      title: (updated)
      status: open
      owner: curia
      priority: 3
      tags: []
      updated_at: "2026-10-01T12:05:00-04:00"
      displayTimezone: America/Toronto
