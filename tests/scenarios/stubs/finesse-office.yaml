# The writes a finesse case's agents may make on the way (#2556), for cases that run their
# specialists for real. Use it with human-channels, calendar-office and calendar-specialist.
# Every write here succeeds, so a case that forbids one still has the wrong path open and
# tests the model's choice, not a refusal. A case's own stubs for these tools come first:
# one that scores a write (a contact saved after a lookup, say) stubs it itself.
#
# No stub here names a seeded row ({{contact:x}}): a set cannot know which contacts a case
# seeds. Shapes follow each tool.json's outputs.

# Saving what Curia learned about someone: a new contact, a filled-in title or
# organization, an identity, a role. The lookup cases (information level 4) score these.
contact-create:
  - match: {}
    return: { contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f1, display_name: (created), role: null, kg_node_id: null, identities_added: 1 }
contact-update:
  - match: {}
    return: { contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f1, updated_fields: [title, organization] }
contact-link-identity:
  - match: {}
    return: { identity_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f2, verified: false, already_linked: false }
contact-set-role:
  - match: {}
    return: { contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f1, display_name: (updated), role: contact }
memory-store:
  - match: {}
    return: { stored: true, action: created, node_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f3, sensitivity: internal }
memory-confirm:
  - match: {}
    return: { action: confirmed, nodeId: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f3, label: (confirmed) }
# The contacts specialist checks how a person is connected before writing. No case seeds a
# relationship, so the real read answers with none, which is what this says. A stub, not a
# passthrough: the read needs entity memory, which a machine without the ONNX runtime lacks
# (an Intel Mac), and there it was refused, so the case measured the harness.
query-relationships:
  - match: {}
    return: { relationships: [], count: 0 }
# A reminder Curia sets itself ("check again early next week"): the right call in 54a.
scheduler-create:
  - match: {}
    return: { jobId: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f4 }
record-outreach:
  - match: {}
    return: { recorded: true, outreach_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f5 }
calendar-holds-sweep:
  - agent: calendar
    match: {}
    return: { scanned: 0, expired: 0, failed: 0, calendarErrors: 0 }
# Drafts in the principal's own mailbox: the right call when a message should come from
# Avery personally (57b, 56c). Composing succeeds in either mailbox; sending one is refused
# as production refuses a send nobody asked for on a live turn (ceo-inbox-office keeps the
# same wording, from PRINCIPAL_SEND_REFUSALS.not_requested in src/skills/outbound-gateway.ts).
ceo-inbox-draft-compose:
  - match: { mailbox: personal }
    return: { draft_id: draft-f1n35e02, mailbox: personal, mailbox_label: Personal, evidence: none }
  - match: {}
    return: { draft_id: draft-f1n35e01, mailbox: work, mailbox_label: Work, evidence: none }
ceo-inbox-draft-reply:
  - match: {}
    return: { draft_id: draft-f1n35e03, subject: "Re: (thread)", to: [], cc: [], already_exists: false }
ceo-inbox-draft-edit:
  - match: {}
    return: { draft_id: draft-f1n35e01, subject: (draft), to: [], cc: [], mailbox: work, mailbox_label: Work }
ceo-inbox-send-draft:
  - match: {}
    error: "Curia sends from the principal's mailbox only when the principal asks on a live turn. Nothing was sent; the draft is still in their Drafts folder."
# The principal's mailbox reads (test mode has no mail client): a quiet mailbox, so a
# specialist looking for context finds nothing instead of a refusal production never shows.
# A case that seeds an earlier thread (information level 5) stubs these itself, first.
ceo-inbox-list:
  - match: {}
    return: { messages: [], count: 0 }
ceo-inbox-search:
  - match: {}
    return: { messages: [], count: 0 }
ceo-inbox-read:
  - match: {}
    error: Message not found in this mailbox.
# A working note an agent keeps on the way (58c): a fair write.
doc-write:
  - match: {}
    return: { action: created, path: /scratch/notes.md, version: 1, displayTimezone: America/Toronto }
# ceo-inbox's housekeeping on a message it handled.
ceo-inbox-label:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg, applied: ["✍️ Drafted"], created: [], folders: [INBOX, "✍️ Drafted"] }
ceo-inbox-update-folders:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg, folders: [INBOX, "✍️ Drafted"], created: [], removed_unresolved: [] }
ceo-inbox-archive:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg }
ceo-inbox-mark-read:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg }
ceo-inbox-mark-starred:
  - agent: ceo-inbox
    match: {}
    return: { success: true, message_id: scenario-msg, starred: true }
# Sending a draft from Curia's own mailbox. Production refuses a draft ID from the principal's
# mailbox (the ceo-inbox drafts above) with this message, pointing at ceo-inbox, which sends
# those (skills/email/tools/send-draft/handler.ts draftNotFoundError). A draft of Curia's own
# sends: the from-Alex path stays open for a case to score.
send-draft:
  - match: { draft_id: draft-f1n35e01 }
    error: "Draft not found: draft-f1n35e01. Searched Curia's email accounts: curia. Drafts in the principal's own mailbox aren't in Curia's accounts; the ceo-inbox specialist sends those: pass this draft ID to it. Do not retry this draft ID with this tool."
  - match: { draft_id: draft-f1n35e02 }
    error: "Draft not found: draft-f1n35e02. Searched Curia's email accounts: curia. Drafts in the principal's own mailbox aren't in Curia's accounts; the ceo-inbox specialist sends those: pass this draft ID to it. Do not retry this draft ID with this tool."
  - match: { draft_id: draft-f1n35e03 }
    error: "Draft not found: draft-f1n35e03. Searched Curia's email accounts: curia. Drafts in the principal's own mailbox aren't in Curia's accounts; the ceo-inbox specialist sends those: pass this draft ID to it. Do not retry this draft ID with this tool."
  - match: {}
    return: { message_id: scenario-out-draft-1, to: recipient@example.test, subject: (sent) }
# Tidying the contact book on the way (54b merged a duplicate it had just created; 56b renamed
# one). Fair writes; a dry run reports itself as one.
contact-merge:
  - match: { dry_run: true }
    return: { primary_contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f1, secondary_contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f6, golden_record: {}, dry_run: true }
  - match: {}
    return: { primary_contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f1, secondary_contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f6, golden_record: {}, dry_run: false, merged_at: "{{at:now}}", review_tasks_closed: 0 }
contact-rename:
  - match: {}
    return: { contact_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f1, display_name: (renamed), role: null }
# ceo-inbox's Sent-folder check (54e called it to see whether a reply had come): a quiet
# mailbox, nothing new.
ceo-inbox-sent-observe:
  - agent: ceo-inbox
    match: {}
    return: { messages_scanned: 0, draft_matches: 0, task_candidates: 0, shadow_reconciled: 0, shadow_judge_failed: 0, shadow_deferred: 0, shadow_fetch_failed: 0, shadow_record_failed: 0, watermark_advanced_to: null, watermark_held: false, backfill_active: false }
# A specialist asking another for help (57b: ceo-inbox asked contacts for Ruth's address).
bullpen-post:
  - match: {}
    return: { thread_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f7, message_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000f8, deduplicated: false }
