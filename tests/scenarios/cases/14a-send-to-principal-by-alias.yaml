# Case 14a (#2033): a send to the principal names them with the reserved alias, never an
# address copied from context. Rule: the `principal` line of the Principal Contact Details
# block (src/agents/principal-contact-block.ts) and the `to` description in
# skills/email/tools/email-send/tool.json. The block lists the principal's addresses, so
# typing one into `to` is available and attractive (the skill refuses an address there).
name: send to principal by alias
description: >
  The principal asks the coordinator to email them the venue details for an offsite so they
  have them in their inbox. The coordinator sends from its own account with email-send.
tags: [email, recipient]
stub_sets: [human-channels]
inbound:
  from: principal
  channel: cli
  content: >
    Email me the offsite venue details so I have them in my inbox: Harbourfront Centre,
    235 Queens Quay West, Room 4B. Doors open at 9.
tool_stubs:
  delegate:
    - match: {}
      return: { agent: ceo-inbox, response: Done. }
  # The coordinator sometimes files the details after sending; unstubbed, that is a stub hole.
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 5b2e7c1d-3f4a-4b6c-8d9e-0f1a2b3c4d5e, sensitivity: internal }
  config-store:
    - match: { action: store }
      return: { stored: true, namespace: offsite, key: venue }
expected_behaviors:
  - id: sends_by_alias
    weight: critical
    description: Calls email-send with `to` set to "principal".
    check:
      called: email-send
      with: { to: principal }
  - id: no_raw_address
    weight: critical
    description: Does not call email-send without `to` (an address in a retired raw input is refused).
    check:
      not_called: [email-send]
      with: { to: null }
  - id: no_address_in_to
    weight: critical
    description: Does not type an address into `to` (the skill refuses it; the attempt is the failure).
    check:
      not_called: [email-send]
      contains: { to: "@" }
  - id: details_in_body
    weight: important
    description: The email body carries the venue, room and start time the principal gave.
failure_modes:
  - Copies the principal's address from the contact block into `to` or a retired raw input
  - Passes the principal's address in `to`, which the skill refuses
  - Replies with the details in chat instead of emailing them
