# Case 48j (#2362): the deep-dive review, confirmed. Rule: skills/onboarding/SKILL.md,
# "Deep-dive review": import only after the principal confirms in the conversation. Working
# rules are written `Status: active`, so Curia first reads back a one-line list of the rules it
# is about to add and gets an explicit yes; only then does it delegate inbox rules to ceo-inbox
# and calendar rules to calendar. Priorities go to /shared/principal/priorities.md with
# doc-write, the voice guide through executive-profile-update (with `guide` and `note`).
# Confirmed or corrected topics are marked done.
#
# Two turns. The first message confirms the three documents (the rules with one correction) and
# asks Curia to bring them in; that is not the yes the skill wants, which comes after the
# read-back. The second is `inbound.then` (the principal's next turn, on Signal), whose context
# is the note of the first turn ("Your other recent turns").
#
# The harness has no ordering check between a message and a tool call, and both turns' calls are
# listed together, so "no delegate before the yes" is a judge-scored behavior (`reads_back_first`);
# the checkable half is that nothing is delegated or written until the work is done at all.
#
# The drafts are the Curia documents (doc-read), the fallback the skill names; the Google Docs'
# ids are not seeded, so the Drive tools are stubbed only against a stray read.
name: deep dive confirm imports rules by delegation after a read-back
description: >
  The deep-dive drafts (working rules, time and priorities, writing voice) are ready and the
  Review session is open. The principal says they have been through all three: the rules are
  right except that Friday afternoon should start at 1pm, the priorities and the voice are fine.
  Curia reads the current drafts, reads back the one-line list of rules it will add and asks for
  a yes. On the principal's explicit yes it delegates the inbox rules to ceo-inbox and the
  calendar rule to calendar, writes the priorities with doc-write, writes the voice with
  executive-profile-update, and marks the three topics done. It does not email the principal.
tags: [onboarding, deep-dive]
# New in #2362: an eval until it holds over about 10 runs (docs/dev/behavior-tests.md).
release_gate: false
stub_sets: [human-channels, deferred-work]
seed:
  onboarding:
    task: 6e0b0a2d-2362-4c00-8a00-00000000048a
    topics:
      - { id: review-rules, title: Working rules, session: review }
      - { id: review-priorities, title: Time and priorities, session: review }
      - { id: review-voice, title: Writing voice, session: review }
inbound:
  from: principal
  channel: web
  content: >
    I've been through all three documents you sent. The rules are right except that Friday
    afternoon should start at 1pm, not noon. The priorities and the writing voice are fine as
    they are. Please bring them in.
  then:
    channel: signal
    content: Yes, add those rules, and go ahead with the priorities and the voice too.
tool_stubs:
  onboarding-progress:
    - match: { op: status }
      return:
        taskId: 6e0b0a2d-2362-4c00-8a00-00000000048a
        sessions:
          - id: first-conversation
            title: First conversation
            opened: true
            open: []
            done:
              - { topicId: hello, title: Hello }
              - { topicId: about-you, title: Tell me about yourself }
          - id: review
            title: Review
            opened: true
            open:
              - { topicId: review-rules, title: Working rules, needsMailbox: false,
                  body: "I need Avery to check the rules I drafted before I follow any of them. For the document: confirm / correct / set aside." }
              - { topicId: review-priorities, title: Time and priorities, needsMailbox: false,
                  body: "I need to learn what Avery is trying to move, so I weigh work against it. For the document: confirm / correct / set aside." }
              - { topicId: review-voice, title: Writing voice, needsMailbox: false,
                  body: "I need Avery to check how I described the way they write. For the document: confirm / correct / set aside." }
            done: []
        mailboxConnected: true
        greetingSent: true
        setupFor: other
        operatorName: Jordan Vale
    - match: { op: topic_done, topic_id: review-rules }
      return: { topicId: review-rules, sessionId: review, outcome: done, onboardingComplete: false }
    - match: { op: topic_done, topic_id: review-priorities }
      return: { topicId: review-priorities, sessionId: review, outcome: done, onboardingComplete: false }
    - match: { op: topic_done, topic_id: review-voice }
      return: { topicId: review-voice, sessionId: review, outcome: done, onboardingComplete: false }
    - match: { op: topic_done }
      return: { recorded: true, outcome: done, onboardingComplete: false }
  # The drafts, as the Curia documents the deep dive wrote (src/onboarding/deep-dive/paths.ts).
  doc-read:
    - match: { path: /meetings/onboarding/deep-dive/working-rules.md }
      return:
        path: /meetings/onboarding/deep-dive/working-rules.md
        version: 3
        content: |
          # Working rules (draft)

          Nothing here is in effect until Avery confirms it.

          ## Inbox
          1. Newsletters and promotions from senders at example.com go to Later. Status: active
          2. Mail from board@example.com is always flagged to Avery the same day. Status: active

          ## Calendar
          3. Keep Friday afternoons from noon free of meetings. Status: active
    - match: { path: /meetings/onboarding/deep-dive/time-and-priorities.md }
      return:
        path: /meetings/onboarding/deep-dive/time-and-priorities.md
        version: 2
        content: |
          # Time and priorities (draft)

          1. The Toronto office launch.
          2. Hiring a head of operations.
          3. Keeping the three largest accounts happy.
    - match: { path: /meetings/onboarding/deep-dive/writing-voice.md }
      return:
        path: /meetings/onboarding/deep-dive/writing-voice.md
        version: 2
        content: |
          # Writing voice (draft)

          Concise and direct. Short paragraphs. Plain words over formal ones. Signs off with the
          first name. Never uses exclamation marks with customers.
  delegate:
    - match: { agent: ceo-inbox }
      return:
        agent: ceo-inbox
        response: >
          Added the two inbox rules as active and kept the existing ones. No conflicts.
    - match: { agent: calendar }
      return:
        agent: calendar
        response: >
          Added the Friday-afternoon rule (meetings kept out from 1pm) as active and kept the
          existing ones. No conflicts.
    - match: {}
      return:
        agent: other
        response: Nothing on file for this request.
  doc-write:
    - match: { path: /shared/principal/priorities.md }
      return: { action: created, path: /shared/principal/priorities.md, version: 1 }
    - match: {}
      return: { action: updated, path: /meetings/onboarding/deep-dive/working-rules.md, version: 4 }
  executive-profile-update:
    - match: {}
      return:
        profile: { writing_voice: { guide_set: true } }
        summary: Writing voice guide updated.
        changes: guide
  # The Doc banner and any stray Drive reads: the Google file ids are not seeded.
  modify_doc_text:
    - match: {}
      return: Updated the document.
  get_doc_content:
    - match: {}
      error: Document not found.
  # The wrong paths, stubbed so the case tests the choice rather than a refusal.
  email-send:
    - match: {}
      return: { sent: true }
  email-reply:
    - match: {}
      return: { sent: true }
expected_behaviors:
  - id: rules_to_inbox_specialist
    weight: critical
    description: Delegates the confirmed inbox rules to ceo-inbox.
    check:
      called: delegate
      with: { agent: ceo-inbox }
      min: 1
  - id: rules_to_calendar_specialist
    weight: critical
    description: Delegates the confirmed calendar rule to the calendar specialist.
    check:
      called: delegate
      with: { agent: calendar }
      min: 1
  - id: priorities_written
    weight: critical
    description: Writes the priorities to /shared/principal/priorities.md with doc-write.
    check:
      called: doc-write
      with: { path: /shared/principal/priorities.md }
      success: true
  - id: voice_written
    weight: critical
    description: Writes the voice with executive-profile-update, carrying the guide and the confirmation note.
    check:
      called: executive-profile-update
      contains: { guide: concise, note: deep dive }
      success: true
  - id: rules_topic_done
    weight: important
    description: Marks the working-rules topic done (corrected counts as done).
    check:
      called: onboarding-progress
      with: { op: topic_done, topic_id: review-rules, outcome: done }
  - id: priorities_topic_done
    weight: important
    description: Marks the priorities topic done.
    check:
      called: onboarding-progress
      with: { op: topic_done, topic_id: review-priorities, outcome: done }
  - id: voice_topic_done
    weight: important
    description: Marks the voice topic done.
    check:
      called: onboarding-progress
      with: { op: topic_done, topic_id: review-voice, outcome: done }
  - id: nothing_declined
    weight: important
    description: Declines no topic; the principal confirmed all three.
    check:
      not_called: [onboarding-progress]
      with: { outcome: declined }
  - id: read_before_import
    weight: important
    description: Reads the drafts before it delegates anything.
    check:
      order: [doc-read, delegate]
  - id: never_emails_principal
    weight: critical
    description: Sends the principal nothing by email; the review runs on their messaging route.
    check:
      not_called: [email-send, email-reply]
  - id: reads_back_first
    weight: critical
    # The harness cannot order a message against a tool call (both turns' calls are listed
    # together), so the judge scores it from the transcript.
    description: >
      On the first turn, Curia reads back a short list of the rules it is about to add (the two
      inbox rules and the Friday-afternoon rule, with the 1pm correction) and asks for a yes,
      and delegates nothing until the principal's explicit yes on the second turn. "Please bring
      them in" is not that yes. The delegations to ceo-inbox and calendar happen after it.
  - id: receipt_names_where
    weight: nice-to-have
    description: >
      The final reply says where each now lives (the rules with the inbox and calendar
      specialists, priorities and voice in Curia) without technical jargon.
failure_modes:
  - Delegates the rules on the first turn, treating "please bring them in" as the confirmation
  - Writes the rules itself instead of delegating them to ceo-inbox and calendar
  - Writes the priorities or voice somewhere other than doc-write and executive-profile-update
  - Imports the Friday rule at noon, ignoring the correction
  - Emails the principal the drafts, links or receipt
