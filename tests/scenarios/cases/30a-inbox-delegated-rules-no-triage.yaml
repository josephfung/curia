# ceo-inbox, delegated mode (#2025). Rule: agents/ceo-inbox.yaml, Operating Mode
# "Delegated mode" and "Rule Management (delegated mode only)": a request from the
# coordinator is handled directly, without running the triage protocol. The inbox has
# unread mail, so a triage would be visible (ceo-inbox-list with unread_only, archives).
name: inbox delegated rules request runs no triage
description: >
  The coordinator hands ceo-inbox the principal's request to list the inbox's standing
  rules. Two rules are stored. The inbox also holds unread mail. ceo-inbox should read the
  rules (and the decision-tagging setting) from config-store and report them, and do
  nothing else: no triage of the unread mail.
tags: [ceo-inbox, delegated-mode, specialist, specialist-ceo-inbox]
agent: ceo-inbox
stub_sets: [ceo-inbox-office]
seed:
  contacts:
    - key: sam
      display_name: Sam Rivera
      channel: email
      identifier: sam@example.test
inbound:
  from: delegate
  content: "The principal asked: what inbox rules do I have set up right now? List them."
tool_stubs:
  config-store:
    - match: { action: retrieve, key: rules }
      return:
        found: true
        namespace: ceo_inbox
        key: rules
        value: '[{"condition":"From the board (anyone @board.example.test)","instruction":"Label BOARD and classify as 🚨 Urgent","active":true},{"condition":"Newsletters from Substack","instruction":"Archive (✔️ Cleared)","active":false}]'
    - match: { action: retrieve, key: decision_tagging }
      return: { found: true, namespace: ceo_inbox, key: decision_tagging, value: '{"enabled": true}' }
  ceo-inbox-list:
    - match: {}
      return:
        count: 1
        has_more: false
        messages:
          - id: msg-unread-1
            threadId: thr-unread-1
            subject: Quick question about Thursday
            from: [{ name: Sam Rivera, email: sam@example.test }]
            date: 1790064300
            unread: true
            snippet: Are we still on for Thursday?
expected_behaviors:
  - id: reads_rules
    weight: critical
    description: Reads the stored rules from config-store.
    check:
      called: config-store
      with: { action: retrieve, key: rules }
  - id: no_triage
    weight: critical
    description: Runs no triage (no unread-mail listing, no archiving, labelling or marking read).
    check:
      not_called: [ceo-inbox-list, ceo-inbox-archive, ceo-inbox-label, ceo-inbox-mark-read, ceo-inbox-update-folders]
  - id: lists_both_rules
    weight: critical
    description: >
      The reply lists both stored rules with their condition and instruction, and shows that
      the Substack rule is paused (inactive) while the board rule is active.
  - id: no_rule_changes
    weight: important
    description: Does not store anything to config-store (a list request changes no rule).
    check:
      not_called: [config-store]
      with: { action: store }
failure_modes:
  - Starts an inbox triage (lists unread mail, archives or labels it) instead of answering the question
  - Lists only the active rule, or presents the paused rule as active
  - Rewrites the rules while listing them
