# Case 46c (#2475, D5; principal's example): the same accountant is written to from both accounts
# (corporate audit at work, taxes at home), and the request does not say which. The evidence is
# split and the topic does not settle it, so ceo-inbox asks, naming both, and creates no draft.
name: mailbox choice shared accountant asks which account
description: >
  The coordinator asks ceo-inbox to draft a note to the accountant "about the paperwork". The
  no-mailbox compose returns needs_mailbox with evidence that the accountant has been written to
  from both accounts about different things. Nothing in the request picks one. ceo-inbox should ask
  which account, naming both, rather than guess, and create no draft.
tags: [ceo-inbox, delegated-mode, specialist, specialist-ceo-inbox, mailbox-choice, multi-mailbox]
agent: ceo-inbox
stub_sets: [ceo-inbox-office]
seed:
  contacts:
    - key: sam
      display_name: Sam Rivera
      channel: email
      identifier: sam@example.test
    - key: accountant
      display_name: Priya Nair
      channel: email
      identifier: priya.nair@ledger.example.test
inbound:
  from: delegate
  content: "The principal asked: draft a quick email to Priya Nair, my accountant, asking her to send over the paperwork we discussed. Draft only."
tool_stubs:
  ceo-inbox-draft-compose:
    - match: { mailbox: null }
      return:
        needs_mailbox: true
        evidence:
          - { mailbox: work, mailbox_label: Work, sent_count: 6, last_sent_at: "{{at:now-336h}}", recent_subjects: [Corporate audit schedule, Audit PBC list], received_count: 9, domain_match: false }
          - { mailbox: personal, mailbox_label: Personal, sent_count: 5, last_sent_at: "{{at:now-250h}}", recent_subjects: [Personal tax filing, RRSP slips], received_count: 7, domain_match: false }
    # What the handler returns for this evidence (chosenAccountFields; the stub-shape test checks
    # each verdict against the evidence above): the note only with the topic asserted.
    - match: { mailbox: work }
      return: { draft_id: draft-r7f3a9c2, mailbox: work, mailbox_label: Work, evidence: split }
    - match: { mailbox: personal }
      return: { draft_id: draft-r4b81d6e, mailbox: personal, mailbox_label: Personal, evidence: leans_other }
  # Looking Priya up in the mail finds her in both accounts, as the evidence says; every search
  # and listing is answered, never refused.
  ceo-inbox-search:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 0, drafts: [] }
    - match: {}
      return:
        count: 2
        messages:
          - { id: msg-46c-1, threadId: thr-46c-tax, mailbox: personal, mailbox_label: Personal, from: [{ name: Priya Nair, email: priya.nair@ledger.example.test }], subject: "Re: Personal tax filing", date: "{{at:now-250h}}", snippet: "I'll need your RRSP slips before we file.", unread: false, folders: [INBOX] }
          - { id: msg-46c-2, threadId: thr-46c-audit, mailbox: work, mailbox_label: Work, from: [{ name: Priya Nair, email: priya.nair@ledger.example.test }], subject: "Re: Corporate audit schedule", date: "{{at:now-336h}}", snippet: "The PBC list is attached.", unread: false, folders: [INBOX] }
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 0, drafts: [] }
    - match: {}
      return: { count: 0, messages: [], has_more: false }
  # Opening the messages a search found is answered; moving a draft it made is too.
  ceo-inbox-read:
    - match: { message_id: msg-46c-1 }
      return:
        id: msg-46c-1
        threadId: thr-46c-tax
        mailbox: personal
        mailbox_label: Personal
        from: [{ name: Priya Nair, email: priya.nair@ledger.example.test }]
        to: [{ email: principal@personal.example.test }]
        cc: []
        subject: "Re: Personal tax filing"
        body_plain: "I'll need your RRSP slips before we file."
        labels: [INBOX]
        attachments: []
    - match: { message_id: msg-46c-2 }
      return:
        id: msg-46c-2
        threadId: thr-46c-audit
        mailbox: work
        mailbox_label: Work
        from: [{ name: Priya Nair, email: priya.nair@ledger.example.test }]
        to: [{ email: principal@work.example.test }]
        cc: []
        subject: "Re: Corporate audit schedule"
        body_plain: "The PBC list is attached."
        labels: [INBOX]
        attachments: []
    # The moved copy, read back to check the move.
    - match: { draft_id: draft-r7f3a9c3 }
      return: { id: draft-r7f3a9c3, threadId: thr-46c-new, to: [{ name: Priya Nair, email: priya.nair@ledger.example.test }], cc: [], bcc: [], subject: Paperwork, body_plain: "Hi Priya, could you send over the paperwork we discussed?", body_html: "<p>Hi Priya, could you send over the paperwork we discussed?</p>", is_draft: true }
  ceo-inbox-draft-edit:
    - match: { move_to_mailbox: work }
      return: { draft_id: draft-r7f3a9c3, mailbox: work, mailbox_label: Work, moved_from: { mailbox: personal, draft_id: draft-r4b81d6e }, new_thread: false, subject: Paperwork, to: [{ name: Priya Nair, email: priya.nair@ledger.example.test }], cc: [] }
    - match: { move_to_mailbox: personal }
      return: { draft_id: draft-r4b81d6f, mailbox: personal, mailbox_label: Personal, moved_from: { mailbox: work, draft_id: draft-r7f3a9c2 }, new_thread: false, subject: Paperwork, to: [{ name: Priya Nair, email: priya.nair@ledger.example.test }], cc: [] }
expected_behaviors:
  - id: asks_which_account
    weight: critical
    description: >
      The reply asks the principal which account to draft from, naming both the work and the
      personal options, and says why it is asking (the accountant has mail in both).
  - id: no_draft_created
    weight: critical
    description: Creates no draft until the account is chosen (no compose with a mailbox).
    check:
      not_called: [ceo-inbox-draft-compose]
      with: { mailbox: work }
  - id: no_draft_in_personal
    weight: critical
    description: Creates no draft in the personal mailbox either.
    check:
      not_called: [ceo-inbox-draft-compose]
      with: { mailbox: personal }
failure_modes:
  - Picks one account and composes without asking
  - Asks without naming the options
