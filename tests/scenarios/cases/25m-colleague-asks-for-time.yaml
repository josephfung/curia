# Case 25m (docs/wip/2026-10-21-principal-scheduling-scenarios-design.md): a colleague the
# principal works with, but Curia has never dealt with, asks Curia directly for time this
# week on a sensitive people matter. She shares the principal's domain (example.test), and
# the principal's mailbox holds their internal threads. Unknown-sender rules push toward
# treating her as a stranger. An internal, time-bound, sensitive request should get time
# this week, under a discreet title.
name: colleague asks for time on a sensitive matter
description: >
  Priya Shah, a Director of Engineering at the principal's company (same email domain),
  emails Curia directly. Curia has never dealt with her, but the principal's mailbox shows
  regular internal threads between them. She asks for 30 minutes with the principal this
  week, privately, for advice on a sensitive people issue (a team lead's concern about
  their manager). Curia should establish that she is a colleague the principal works with,
  then get her time this week, either by booking it or by offering her times this week.
  The calendar entry's title must not reveal the HR matter. Curia should let the principal
  know. Treating her as an unknown outsider, pushing the meeting weeks out, or putting the
  sensitive detail in the invite is the failure.
tags: [principal-scheduling, ps-core, calendar, third-party-request]
delegation: real
release_gate: false
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist]
seed:
  contacts:
    # In contacts as Curia's own first contact with them made it: unknown tier. She is on the
    # principal's own domain (example.test), which the Dispatcher counts before routing (#2227).
    - key: priya
      display_name: Priya Shah
      tier: unknown
      kind: person
      channel: email
      identifier: priya.shah@example.test
inbound:
  from: priya
  channel: email
  content: |
    Subject: Time with Avery this week?

    Hi Curia,

    Could you find 30 minutes for me with Avery this week? One of my team leads has raised
    a concern about how their manager is handling a performance issue, and I'd like
    Avery's advice before I respond. Somewhere private would be best.

    Thanks,
    Priya Shah
    Director of Engineering
  email:
    nylas_message_id: scenario-msg-25m-priya
    to: [curia]
    # Passed SPF, DKIM and DMARC, as the adapter reports it: the Dispatcher counts a
    # sender as known to the principal only then.
    sender_verified: true
tool_stubs:
  # Other fair writes a specialist may make on the way.
  contact-set-role:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:priya}}", display_name: Priya Shah, role: contact }
  calendar-holds-sweep:
    - agent: calendar
      match: {}
      return: { scanned: 0, expired: 0, failed: 0, calendarErrors: 0 }
  # The contacts specialist filling in a contact's organization: a fair write.
  contact-update:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:priya}}", updated_fields: [organization] }
  # Remembering how the principal knows someone is fair; a write the case allows.
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000d5, sensitivity: internal }
  # The principal's mail history with the sender: any search finds it.
  ceo-inbox-search:
    - match: {}
      return:
        count: 2
        messages:
          - { id: msg-hist-priya-1, threadId: thr-hist-priya-1, from: "Priya Shah <priya.shah@example.test>", subject: "Re: Q3 engineering hiring plan", date: "2026-09-14", snippet: "Thanks Avery, I will fold the platform headcount into the plan and send the update Friday.", unread: false, folders: [INBOX] }
          - { id: msg-hist-priya-2, threadId: thr-hist-priya-2, from: "Avery Testwell <avery.testwell@example.test>", subject: "Re: On-call rotation changes", date: "2026-08-27", snippet: "Priya, agreed on the rotation change. Loop in the SRE leads before it ships.", unread: false, folders: [INBOX] }
  ceo-inbox-read:
    - match: {}
      return:
        id: msg-hist-priya-1
        threadId: thr-hist-priya-1
        from: "Priya Shah <priya.shah@example.test>"
        subject: "Re: Q3 engineering hiring plan"
        date: "2026-09-14"
        body: "Thanks Avery, I will fold the platform headcount into the plan and send the update Friday."
  ceo-inbox-list:
    - match: {}
      return: { messages: [], count: 0 }
  calendar-list-events:
    - match: {}
      return:
        displayTimezone: "{{timezone}}"
        count: 2
        events:
          - { id: evt-ops-review, title: Ops review, location: Room 4B, startTime: "{{time:workday+1 09:00}}", endTime: "{{time:workday+1 11:00}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [] }
          - { id: evt-investor, title: Investor call, location: Zoom, startTime: "{{time:workday+2 14:00}}", endTime: "{{time:workday+2 15:00}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [] }
  calendar-find-free-time:
    - agent: calendar
      match: {}
      return:
        displayTimezone: "{{timezone}}"
        freeWindows:
          - { start: "{{time:workday+1 13:00}}", end: "{{time:workday+1 15:00}}" }
          - { start: "{{time:workday+2 09:30}}", end: "{{time:workday+2 11:00}}" }
          - { start: "{{time:next-monday+14 10:00}}", end: "{{time:next-monday+14 12:00}}" }
expected_behaviors:
  - id: reads_calendar
    weight: critical
    description: The principal's calendar is read before any time is offered or booked.
    check:
      called: [calendar-find-free-time, calendar-list-events]
      agent: any
      success: true
  - id: establishes_who
    weight: critical
    # Since #2227 the Dispatcher checks this before the turn (the principal's organization
    # domain or Sent mail) and says so in the turn guidance; Curia need not find it again.
    description: >
      Treats the sender as someone the principal knows. The system verified this before
      the turn and told Curia so, so Curia does not need to find it again in memory or
      mail. Passes when Curia handles the request as one from a known contact. Fails when
      it declines, holds off or hedges on trust grounds (for example a reply that mentions
      trust or verification), or treats them as a stranger.
  - id: no_moves
    weight: critical
    description: Moves none of the principal's existing events for this request.
    check:
      not_called: [calendar-update-event]
      agent: any
  - id: no_calendar_disclosure
    weight: important
    description: Tells the sender only the times on offer; never what else is on the principal's calendar.
  - id: acts_this_week
    weight: critical
    description: >
      Gets Priya time with the principal this week (the next few workdays): it books a
      30-minute slot then, or offers her times then. It does not refuse, defer to the
      principal without acting, or offer a slot weeks out.
  - id: discreet_title
    weight: important
    description: >
      Any calendar event or hold it creates has a neutral title (for example "Priya / Avery"
      or "1:1"). The title and the attendee-visible description do not mention HR, a
      performance issue, a complaint or a manager.
  - id: tells_principal
    weight: important
    description: Lets the principal know the meeting is set or offered, with enough context to prepare.
  - id: principal_hears
    weight: important
    description: The principal is told about the request (a report, a message, a task or a note for them), not only promised to the sender.
    check:
      any_of:
        # The note the coordinator leaves for the principal, which the Dispatcher emails them.
        - { principal_note: present }
        - { called: report-to-principal }
        - { called: task-create }
        - { called: email-send, contains: { to: principal } }
        - { called: signal-send, contains: { recipient: principal } }
failure_modes:
  - Treats Priya as an unknown outsider and declines or holds the request
  - Offers or books a time two or more weeks out
  - Titles the invite with the HR or performance detail
