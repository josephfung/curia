# Case 48l (#2362): the deep-dive drafts are ready, but Google will not take them. Rule:
# skills/onboarding/SKILL.md, "Deep-dive review": "If creating or sharing fails: op
# `operator_notice` with `deep_dive_delivery_failed`, and point the principal at the drafts on
# the console's Documents page. The review runs from the Curia drafts." The drafts and links are
# never emailed. Nothing is imported before the principal confirms.
#
# The wake carries production's drafts-ready note (handoffNote, src/onboarding/deep-dive/handoff.ts).
# The Google Docs create and the share both fail, as when Curia's Google Workspace is not signed in.
name: deep dive workspace failure falls back to the console drafts
description: >
  The deep-dive drafts are ready and the onboarding task wakes with the note. Curia activates
  Google Workspace and tries to copy the drafts to Google Docs, but creating the Docs fails.
  Curia records a deep_dive_delivery_failed operator notice, tells the principal on their
  messaging route that the drafts are on the console's Documents page and the review will run
  from there, imports nothing and does not email the principal.
tags: [onboarding, deep-dive]
# New in #2362: an eval until it holds over about 10 runs (docs/dev/behavior-tests.md).
release_gate: false
stub_sets: [human-channels, deferred-work]
inbound:
  from: task-wake
  task:
    id: 6e0b0a2d-2362-4c00-8a00-00000000048c
    title: Onboarding for Avery Testwell
    intent: >
      Set Curia up with Avery Testwell through the onboarding program: the first conversation,
      the review of what the deep dive found, and the check-in.
    tags: [onboarding]
    active_skills: [onboarding]
    notes:
      - at: "{{at:now-2m}}"
        note: >
          Deep-dive drafts ready: /meetings/onboarding/deep-dive/working-rules.md,
          /meetings/onboarding/deep-dive/time-and-priorities.md,
          /meetings/onboarding/deep-dive/writing-voice.md. Contacts added: 42. Coverage:
          {{date:today-92}}–{{date:today-2}}. Copy each to a Google Doc and book the review (onboarding skill,
          "Deep-dive review").
tool_stubs:
  onboarding-progress:
    - match: { op: status }
      return:
        taskId: 6e0b0a2d-2362-4c00-8a00-00000000048c
        sessions:
          - id: first-conversation
            title: First conversation
            opened: true
            open: []
            done:
              - { topicId: hello, title: Hello }
              - { topicId: about-you, title: Tell me about yourself }
              - { topicId: review-format, title: How to review what I find }
          - id: review
            title: Review
            opened: true
            open:
              - { topicId: review-rules, title: Working rules, needsMailbox: false,
                  body: "I need Avery to check the rules I drafted before I follow any of them. For the document: confirm / correct / set aside." }
              - { topicId: review-priorities, title: Time and priorities, needsMailbox: false,
                  body: "I need to learn what Avery is trying to move, so I weigh work against it. For the document: confirm / correct / set aside." }
              - { topicId: review-voice, title: Writing voice, needsMailbox: false,
                  body: "I need Avery to check how I described the way they write. For the document: confirm / correct / set aside." }
            done: []
        mailboxConnected: true
        greetingSent: true
        setupFor: other
        operatorName: Jordan Vale
    - match: { op: operator_notice, event: deep_dive_delivery_failed }
      return: { recorded: true }
    - match: { op: topic_done }
      return: { recorded: true, onboardingComplete: false }
  doc-read:
    - match: { path: /meetings/onboarding/deep-dive/working-rules.md }
      return:
        found: true
        path: /meetings/onboarding/deep-dive/working-rules.md
        type: draft
        body: |
          # Working rules (draft)

          1. Newsletters from senders at example.com go to Later. Status: active
          2. Keep Friday afternoons free of meetings. Status: active
    - match: { path: /meetings/onboarding/deep-dive/time-and-priorities.md }
      return:
        found: true
        path: /meetings/onboarding/deep-dive/time-and-priorities.md
        type: draft
        body: |
          # Time and priorities (draft)

          1. The Toronto office launch.
          2. Hiring a head of operations.
    - match: { path: /meetings/onboarding/deep-dive/writing-voice.md }
      return:
        found: true
        path: /meetings/onboarding/deep-dive/writing-voice.md
        type: draft
        body: |
          # Writing voice (draft)

          Concise and direct. Short paragraphs. Signs off with the first name.
  # Google Workspace refuses: creating the Doc fails, so there is nothing to share.
  create_doc:
    - match: {}
      error: Google Workspace is not connected for this account. Sign in from Setup to create documents.
  manage_drive_access:
    - match: {}
      error: Google Workspace is not connected for this account. Sign in from Setup to share files.
  create_drive_file:
    - match: {}
      error: Google Workspace is not connected for this account. Sign in from Setup to create files.
  task-update:
    - match: { task_id: 6e0b0a2d-2362-4c00-8a00-00000000048c }
      return:
        task_id: 6e0b0a2d-2362-4c00-8a00-00000000048c
        title: Onboarding for Avery Testwell
        status: in_progress
        owner: curia
        priority: 3
        tags: [onboarding]
        updated_at: "{{at:now}}"
        displayTimezone: "{{timezone}}"
  delegate:
    - match: { agent: calendar }
      return:
        agent: calendar
        response: >
          Booked "Review: what Curia found" on the principal's calendar, {{day:today+2}} from
          2:00 to 2:30 PM, busy, with the principal as the only attendee.
    - match: {}
      return:
        agent: other
        response: Nothing on file for this request.
  # The wrong paths, stubbed so the case tests the choice rather than a refusal.
  email-send:
    - match: {}
      return: { sent: true }
  email-reply:
    - match: {}
      return: { sent: true }
  executive-profile-update:
    - match: {}
      return:
        profile: { writing_voice: { guide_set: true } }
        summary: Writing voice guide updated.
        changes: guide
  doc-write:
    - match: {}
      return: { action: created, path: /shared/principal/priorities.md, version: 1 }
expected_behaviors:
  - id: tries_google
    weight: important
    description: Activates Google Workspace to copy the drafts to Google Docs before giving up.
    check:
      called: skill-activate
      with: { skill: google-workspace }
  - id: tries_a_document
    weight: critical
    description: Tries to create a Google Doc (or Drive file) from a draft, meeting the failure.
    check:
      any_of:
        - called: create_doc
        - called: create_drive_file
  - id: raises_delivery_notice
    weight: critical
    description: Raises the deep_dive_delivery_failed operator notice with onboarding-progress.
    check:
      called: onboarding-progress
      with: { op: operator_notice, event: deep_dive_delivery_failed }
      max: 1
  - id: never_emails_principal
    weight: critical
    description: Emails the principal neither the drafts nor a link.
    check:
      not_called: [email-send, email-reply]
  - id: imports_nothing
    weight: critical
    description: Imports nothing before the principal confirms in conversation.
    check:
      not_called: [executive-profile-update, doc-write]
  - id: delegates_no_rules
    weight: critical
    description: Adds no rule through ceo-inbox before the principal confirms.
    check:
      not_called: [delegate]
      with: { agent: ceo-inbox }
  - id: topics_stay_open
    weight: important
    description: Closes no review topic; none has been reviewed.
    check:
      not_called: [onboarding-progress]
      with: { op: topic_done }
  - id: no_google_links
    weight: critical
    description: The reply names no Google Docs link; none was created.
    check:
      reply_excludes: ["docs\\.google\\.com"]
  - id: points_to_console_drafts
    weight: critical
    description: >
      Tells the principal, on their messaging route, that the drafts are on the console's
      Documents page and the review will run from those. It does not claim the Google Docs
      were created or send links to them.
failure_modes:
  - Says the Google Docs were created or shared when the calls failed
  - Raises no operator notice, or raises it more than once
  - Emails the principal the drafts or a link
  - Imports the drafts without a review
  - Silently drops the review instead of pointing at the console drafts
