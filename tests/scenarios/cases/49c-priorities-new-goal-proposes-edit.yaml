# Case 49c (#2362, ADR-069): a priority is done and a new goal is stated. Rule: the
# coordinator's pinned_context entry for /shared/principal/priorities.md ("When the principal states
# or changes a goal, propose updating this; move superseded ones to the document its `past:` field
# names"). The seeded document's `past:` points somewhere other than the default
# (/meetings/principal/priorities-past.md), so a write to the default path shows the
# coordinator guessed the location instead of following the pointer (ADR-069: the pointer, not
# a hardcoded path, decides).
#
# The principal states the change in passing and does not ask for an edit, so the coordinator
# proposes the edit and asks (ADR-069: it writes only when the principal agrees; 49a scores an
# unasked write as a miss too). A direct edit would count only if the message asked for the
# update. The proposal moves the finished Series B to the past document rather than dropping it.
name: priorities new goal proposes an edit and moves the old one to past
description: >
  The principal's priorities document lists three current priorities: close the Series B by the
  end of March, hire a VP of Sales, and ship the v2 platform to the first five customers. Its
  past field names /meetings/principal/goals-archive.md. The principal says the Series B signed
  this morning, and that the next big thing is opening a London office by September. Curia
  proposes updating the priorities (the London office added, the Series B moved to the past
  document the past field names) and asks whether to go ahead. It does not write the document
  before the principal agrees, and does not drop the Series B from the proposal without
  recording it in the past document.
tags: [priorities, pinned-context]
# New in #2362: an eval until it holds over about 10 runs (docs/dev/behavior-tests.md).
release_gate: false
stub_sets: [human-channels, deferred-work]
seed:
  pinned:
    docs:
      /shared/principal/priorities.md: |
        ---
        type: note
        title: Priorities
        as_of: "{{date:today-40}}"
        past: /meetings/principal/goals-archive.md
        format: Current priorities only, each a ## section with why it matters. Update as_of on every change. Move superseded ones to the document named in past:, never delete them.
        ---
        ## Close the Series B by the end of March

        The runway depends on it. Investor meetings come first until the round is signed.

        ## Hire a VP of Sales

        Pipeline is stalled without one. Wants warm introductions to experienced fintech sales
        leaders.

        ## Ship the v2 platform to the first five customers

        Promised for this quarter; the team needs the principal at Monday product reviews.
inbound:
  from: principal
  channel: web
  content: >
    Good news: the Series B signed this morning, so that one's done. Next big thing for me is
    opening a London office by September.
tool_stubs:
  # The current document, as doc-read returns it (the same text the pinned block shows).
  doc-read:
    - match: { path: /shared/principal/priorities.md }
      return:
        found: true
        path: /shared/principal/priorities.md
        type: note
        frontmatter:
          title: Priorities
          as_of: "{{date:today-40}}"
          past: /meetings/principal/goals-archive.md
          format: Current priorities only, each a ## section with why it matters. Update as_of on every change. Move superseded ones to the document named in past:, never delete them.
        version: 3
        section_versions:
          Close the Series B by the end of March: 1
          Hire a VP of Sales: 1
          Ship the v2 platform to the first five customers: 1
        body: |
          ## Close the Series B by the end of March

          The runway depends on it. Investor meetings come first until the round is signed.

          ## Hire a VP of Sales

          Pipeline is stalled without one. Wants warm introductions to experienced fintech sales
          leaders.

          ## Ship the v2 platform to the first five customers

          Promised for this quarter; the team needs the principal at Monday product reviews.
    # The past document has not been written yet: doc-read's answer for a missing path.
    - match: { path: /meetings/principal/goals-archive.md }
      return: { found: false, path: /meetings/principal/goals-archive.md }
  # Stubbed so a premature write is recorded as a call rather than refused. Writes succeed, each
  # answering with the path it wrote; `action` is the mode's past tense in
  # production, and the checks read the call's arguments, not this answer.
  doc-write:
    - match: { path: /shared/principal/priorities.md }
      return: { action: updated, document: { path: /shared/principal/priorities.md, version: 4 } }
    - match: { path: /meetings/principal/goals-archive.md }
      return: { action: updated, document: { path: /meetings/principal/goals-archive.md, version: 1 } }
    - match: {}
      return: { action: updated, document: { version: 1 } }
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 0e5d6c7b-1a2b-4c3d-8e9f-00000000049c, sensitivity: internal }
expected_behaviors:
  - id: proposes_the_edit
    weight: critical
    description: >
      Proposes a specific update to the priorities document (add opening the London office by
      September; take the Series B off the current list) and asks whether to go ahead.
      Congratulating the principal and moving on, with no proposal, is a miss.
  - id: no_write_before_agreement
    weight: critical
    description: >
      Does not write the priorities document before the principal agrees: the message states
      the news but does not ask for the update (ADR-069).
    check:
      not_called: [doc-write]
      with: { path: /shared/principal/priorities.md }
  - id: series_b_moves_to_past
    weight: critical
    description: >
      The proposal sends the finished Series B to the past document,
      /meetings/principal/goals-archive.md (the one the past field names). A proposal that
      drops it from the current document without recording it in the past one is a miss.
  - id: follows_the_past_pointer
    weight: critical
    description: >
      Writes past priorities only where the past field points, never to the default
      /meetings/principal/priorities-past.md that this document does not name.
    check:
      not_called: [doc-write]
      with: { path: /meetings/principal/priorities-past.md }
  - id: no_recreate
    weight: critical
    description: Does not create the priorities document over the existing one.
    check:
      not_called: [doc-write]
      with: { path: /shared/principal/priorities.md, mode: create }
  - id: other_priorities_kept
    weight: important
    description: >
      The VP of Sales hire and the v2 launch stay current priorities in the proposal; nothing
      else is removed.
  - id: no_outbound
    weight: important
    description: Sends nothing to anyone; the change is for the principal to confirm.
    check:
      not_called: [email-send, email-reply, signal-send, sms-send, slack-send]
failure_modes:
  - Acknowledges the news without proposing any change to the priorities
  - Edits the priorities document without asking first
  - Deletes the Series B section without recording it in the past document
  - Writes the past entry to the default path instead of the one the past field names
  - Proposes a document that loses the other two priorities
