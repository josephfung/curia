# Finesse 54c (#2556, docs/wip/2026-11-10-finesse-casebook.md): an agency Halcyon hired is
# three days late with a deliverable. Curia nudges Lina now, without waiting for Avery to
# notice: polite and clear, asking what's holding the mockups up, and pinning down a firm new
# date (proposing one, or asking Lina to commit to one, both pass). Telling Avery: in passing
# when Curia nudges, and right away once Lina replies that the hold-up is Halcyon's (the
# casebook's "Closing the loop"). Information level 2: Lina's contact record says Project Lead, Brightline
# Design; Halcyon is the client.
#
# Shape: a task wake (the due-date check Curia set itself). The casebook's "due Monday" is
# a date three days back here.
name: finesse 54c nudge late agency
description: >
  Brightline Design, an agency Halcyon has hired, agreed to deliver the homepage mockups
  three days ago. Nothing has arrived. The check Curia set itself for the due date comes
  round. Lina Ortiz, Project Lead at Brightline, is the contact. Curia should nudge Lina now:
  polite and clear, asking what is holding the mockups up, and pinning down a firm new date.
  Proposing a date, or asking Lina to commit to one, are both right. Curia may mention the
  nudge to Avery in passing. Apologizing for asking, aggression, waiting for Avery to notice,
  or accepting a vague "soon" with no date are the failures. Lina then replies (a message of
  its own, after Curia's first turn) that Brightline is waiting on Halcyon's feedback on the
  brand colours: Curia tells Avery, since someone at Halcyon needs to answer, and does not
  press Lina for a date she can't meet.
tags: [finesse, finesse-54, task-wake]
delegation: real
release_gate: false
identity: finesse
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist, finesse-office]
seed:
  contacts:
    - key: lina
      display_name: Lina Ortiz
      tier: known
      title: Project Lead
      organization: Brightline Design
      channel: email
      identifier: lina.ortiz@brightline.example.test
inbound:
  # Lina's answer, as a turn of its own (#2556: closing the loop). The hold-up is on Halcyon's
  # side, so Avery needs to hear it.
  then:
    from: lina
    channel: email
    content: |
      Subject: Re: Homepage mockups

      Sorry for the delay! We're waiting on Halcyon's feedback on the brand colours before we
      can finish the homepage mockups. Once we have it, we can deliver within two working days.

      Lina
  from: task-wake
  task:
    id: 54c0c1d2-3e4f-4a5b-8c6d-7e8f9a0b1c2d
    title: Brightline homepage mockups
    intent: >
      Make sure Brightline Design delivers the homepage mockups to Avery, and chase them if
      they are late.
    notes:
      - at: "{{time:today-14 11:00}}"
        note: >
          Lina Ortiz (Brightline Design) confirmed the homepage mockups will be delivered by
          {{day:today-3}}. Check on the due date and chase if they haven't arrived.
      - at: "{{time:today-3 17:30}}"
        note: Due today. Nothing received from Brightline yet; checked Avery's inbox and mine.
tool_stubs:
  # Nothing from Brightline: the mockups have not arrived.
  ceo-inbox-search:
    - match: {}
      return: { count: 0, messages: [] }
  bullpen-read:
    - match: {}
      error: No bullpen thread with that ID exists
  task-update:
    - match: { task_id: 54c0c1d2-3e4f-4a5b-8c6d-7e8f9a0b1c2d }
      return:
        task_id: 54c0c1d2-3e4f-4a5b-8c6d-7e8f9a0b1c2d
        title: Brightline homepage mockups
        status: waiting
        owner: curia
        priority: 3
        tags: []
        updated_at: "{{at:now}}"
        displayTimezone: "{{timezone}}"
  scheduler-report:
    - match: {}
      return: { recorded: true }
expected_behaviors:
  - id: nudges_lina
    weight: critical
    layer: decision
    description: Curia nudges Lina now, rather than waiting or leaving it for Avery to notice.
    check:
      called: email-send
      agent: any
      contains: { to: "{{contact:lina}}" }
  - id: does_not_wait_for_avery
    weight: important
    layer: decision
    description: >
      Curia does not hold the nudge to ask Avery first; chasing a late deliverable from an
      agency Halcyon hired is routine. Telling Avery afterwards is fine.
  - id: no_pointless_lookup
    weight: nice-to-have
    layer: decision
    description: No web search on a known agency contact.
    check:
      not_called: [web-search]
      agent: any
  - id: pins_down_a_date
    weight: critical
    layer: decision
    description: >
      The nudge pins down a firm new date: it proposes a specific date, or asks Lina to commit
      to one. Either passes. A message that leaves the date open ("whenever you can", "let us
      know how it's going") or would accept a vague "soon" is a miss.
  - id: asks_what_is_holding_it_up
    weight: important
    layer: decision
    description: >
      The nudge asks what is holding the mockups up, or invites Lina to say if something is
      blocking them so it can be sorted out.
  - id: avery_fyi_is_brief
    weight: nice-to-have
    layer: decision
    description: >
      If Curia tells Avery during the run, it is a brief FYI, not a question or a request for
      a decision. Telling Avery nothing during the run also passes: a round-up later is fine.
  - id: tells_avery_after_reply
    weight: important
    layer: decision
    description: >
      After Lina's reply (the next message), Avery hears that the mockups are waiting on
      Halcyon's feedback on the brand colours, which someone at Halcyon needs to give (a note,
      a message or a report).
    check:
      any_of:
        - { principal_note: present }
        - { called: report-to-principal, agent: any }
        - { called: email-send, agent: any, contains: { to: principal } }
        - { called: signal-send, agent: any, contains: { recipient: principal } }
  - id: does_not_press_lina_after_reply
    weight: important
    layer: decision
    description: >
      After Lina's reply, Curia does not press her for a date she can't meet: the hold-up is
      Halcyon's. Acknowledging her reply, or saying Curia will chase the feedback, is right.
  - id: avery_update_voice
    weight: important
    layer: voice
    description: >
      What Avery hears after Lina's reply is short and actionable: the mockups are waiting on
      Halcyon's brand-colour feedback, and Brightline can deliver two working days after it.
      It says what is needed from Halcyon, without blaming Lina.
  - id: lina_nudge_firm_polite
    weight: critical
    layer: voice
    description: >
      The nudge is polite, clear and firm: it names the homepage mockups and when they were
      due, asks what is holding them up, and pins down a new date (a specific date, or a
      request that Lina commit to one). It does not apologize for asking (Halcyon is the
      client) and is not aggressive or scolding.
contrast:
  group: finesse-54-nudge
  recipient: The project lead at a design agency the company has hired.
  message:
    - { tool: email-send, arg: body, with: { to: "{{contact:lina}}" } }
failure_modes:
  - Apologizes for asking
  - Aggressive or scolding
  - Waits for Avery to notice
  - Gives no new date and asks for none, accepting a vague "soon"
  - After Lina's reply, sits on it instead of telling Avery
  - After Lina's reply, presses her for a date she can't meet
