# Case 46i (#2475, D4/D7; the design's "45i"): one message delivered to both of the principal's
# mailboxes reaches triage once. Code keeps the first copy (the Message-ID + From claim, R54), so
# the batch carries only the work copy and says both mailboxes are due. ceo-inbox handles that one
# message once: one reply draft, answering the work copy.
# Stub-based like 46a-46h (the loader seeds one principal mailbox).
name: triage handles a message delivered to both mailboxes once
description: >
  The inbox triage fires with two mailboxes due (work and personal). Ines Moreau wrote to both
  addresses; the batch carries one copy, in work (code dropped the duplicate). The message asks
  the principal a question that needs a drafted reply. ceo-inbox reads and answers that one
  message with a single draft, and does not go looking for the second copy to answer it too.
tags: [specialist-ceo-inbox, ceo-inbox, triage, multi-mailbox, dedupe]
agent: ceo-inbox
timeout_seconds: 420
stub_sets: [ceo-inbox-office]
seed:
  contacts:
    - key: sam
      display_name: Sam Rivera
      channel: email
      identifier: sam@example.test
    - key: ines
      display_name: Ines Moreau
      channel: email
      identifier: ines.moreau@calder.example.test
inbound:
  from: task-wake
  task:
    id: 7a1b2c3d-46a0-4b1c-8d2e-461a0b1c2d3e
    title: Inbox drain
    tags: [inbox-drain]
    originator: system
    intent: "Triage the principal's due mailboxes: call ceo-inbox-list with triage: true, one batch at a time (Steps 1-6)."
tool_stubs:
  # The drain task this wake runs: progress notes and completion are the wake's own writes.
  task-update:
    - match: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461a0b1c2d3e }
      return: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461a0b1c2d3e, title: Inbox drain, status: in_progress, owner: curia, priority: 3, tags: [inbox-drain], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  task-complete:
    - match: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461a0b1c2d3e }
      return: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461a0b1c2d3e, title: Inbox drain, status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 0, drafts: [] }
    - match: { triage: true }
      return:
        count: 1
        has_more: false
        mailboxes_due: [work, personal]
        messages:
          - id: msg-46i-work
            threadId: thr-46i
            mailbox: work
            mailbox_label: Work
            subject: Pilot kickoff date
            from: [{ name: Ines Moreau, email: ines.moreau@calder.example.test }]
            to: [{ email: principal@work.example.test }, { email: principal@personal.example.test }]
            cc: []
            unread: true
            folders: [INBOX, UNREAD]
            attachments: []
            snippet: Could you confirm whether the pilot kickoff can move to the 14th?
    # The drain's batch call is triage mode (Step 3, R66); any other plain listing is refused here.
    - match: {}
      error: "Call ceo-inbox-list with triage: true for the drain batch (Step 3)."
  ceo-inbox-read:
    - match: { message_id: msg-46i-work }
      return:
        id: msg-46i-work
        threadId: thr-46i
        mailbox: work
        mailbox_label: Work
        from: [{ name: Ines Moreau, email: ines.moreau@calder.example.test }]
        to: [{ email: principal@work.example.test }, { email: principal@personal.example.test }]
        cc: []
        subject: Pilot kickoff date
        body_plain: "Hi,\n\nCould you confirm whether the pilot kickoff can move to the 14th?\n\nThanks,\nInes"
        labels: [INBOX, UNREAD]
        attachments: []
    - match: {}
      error: "Failed to read principal inbox message: not found"
  ceo-inbox-draft-reply:
    - match: { reply_to_message_id: msg-46i-work }
      return:
        draft_id: draft-46i-reply
        mailbox: work
        mailbox_label: Work
        subject: "Re: Pilot kickoff date"
        to: [{ name: Ines Moreau, email: ines.moreau@calder.example.test }]
        cc: []
        snippet: "Hi Ines, ..."
    - match: {}
      error: "Failed to read principal inbox message: not found"
  contact-register:
    - match: {}
      return: { contact_id: "{{contact:ines}}", display_name: Ines Moreau, contact_confidence: 0.9, created: false, verified: true }
  # Forbidden below (nothing_sent), so the wrong path must be open: a send of the reply draft
  # succeeds, overriding ceo-inbox-office's refusal, and the check alone catches it.
  ceo-inbox-send-draft:
    - match: {}
      return: { message_id: msg-sent-46i, to: [ines.moreau@calder.example.test], subject: "Re: Pilot kickoff date" }
  memory-query:
    - match: {}
      return: { count: 0, results: [] }
expected_behaviors:
  - id: lists_in_triage_mode
    weight: critical
    description: Lists the drain's batch with ceo-inbox-list in triage mode (Step 3).
    check:
      called: ceo-inbox-list
      with: { triage: true }
  - id: no_second_look_for_the_copy
    weight: important
    description: Does not list the personal mailbox again to find the duplicate; code already set it aside.
    check:
      not_called: [ceo-inbox-list]
      with: { mailbox: personal }
  - id: handled_the_message
    weight: critical
    description: Reads or drafts a reply to the one message in the batch (the work copy).
    check:
      any_of:
        - { called: ceo-inbox-read, with: { message_id: msg-46i-work } }
        - { called: ceo-inbox-draft-reply, with: { reply_to_message_id: msg-46i-work } }
  - id: at_most_one_reply_draft
    weight: critical
    description: Drafts at most one reply across all mailboxes; the duplicate copy gets no second one.
    check:
      called: ceo-inbox-draft-reply
      max: 1
  # The case intends one drafted reply, so the message's end state is ✍️ Drafted: archived
  # (agents/ceo-inbox.yaml step 4h / Step 5), not marked read. Each is bound to the one message.
  - id: drafted_the_work_copy_once
    weight: critical
    description: Drafts exactly one reply, to the work copy it was given.
    check:
      called: ceo-inbox-draft-reply
      with: { reply_to_message_id: msg-46i-work }
      min: 1
      max: 1
  - id: settled_once
    weight: critical
    description: Settles the drafted message once, by archiving it (✍️ Drafted), never twice.
    check:
      called: ceo-inbox-archive
      with: { message_id: msg-46i-work }
      min: 1
      max: 1
  - id: not_also_marked_read
    weight: critical
    description: Does not also mark the archived message read, which would settle it a second time.
    check:
      not_called: [ceo-inbox-mark-read]
      with: { message_id: msg-46i-work }
  - id: nothing_sent
    weight: critical
    description: Sends no draft on its own; sending is off in this setup.
    check:
      not_called: [ceo-inbox-send-draft]
  - id: not_reported_twice
    weight: important
    description: Does not tell the principal the same message arrived or was handled twice.
failure_modes:
  - Drafts a second reply to Ines for the personal copy
  - Treats the same message as two and reports it twice
