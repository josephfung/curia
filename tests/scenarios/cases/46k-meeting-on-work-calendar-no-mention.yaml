# Case 46k (#2475, D5/D7; decided by the principal 2026-11-11, items 3 and 10): a meeting with
# the CFO belongs on the work calendar. calendar-create-event without a mailbox returns
# a needs_mailbox error with evidence that all points to work, so calendar books it there and does not
# mention the account: it was no judgement call.
name: meeting with the cfo goes on the work calendar without saying so
description: >
  The coordinator asks calendar to book a 45-minute meeting with Dana Whitfield, the CFO, on
  Thursday next week at 2 PM about the Q3 budget. The principal has a work and a personal
  account. The first create call (no mailbox) fails with needs_mailbox and evidence: every mail
  with Dana went through work and she is on the work domain. calendar should book it on the
  work calendar and say nothing about which account it used.
tags: [specialist-calendar, calendar, mailbox-choice, multi-mailbox]
agent: calendar
stub_sets: [calendar-specialist, calendar-office]
seed:
  contacts:
    - key: cfo
      display_name: Dana Whitfield
      channel: email
      identifier: dana.whitfield@work.example.test
inbound:
  from: delegate
  content: "The principal asked: book a 45-minute meeting with Dana Whitfield (our CFO) on {{day:next-monday+3}} at 2 PM about the Q3 budget, and send her the invite."
tool_stubs:
  calendar-create-event:
    - agent: calendar
      match: { mailbox: null }
      # The handler's needs_mailbox failure (R102), word for word.
      error: >-
        needs_mailbox: nothing was created. Several accounts are connected; call again with mailbox
        set to the account this belongs to, one of: work (Work), personal (Personal). Evidence for
        the attendees: Work: sent 14, received 22, same domain; Personal: sent 0, received 0.
    # The handler's result for this evidence (chosenAccountFields): the note only when the topic
    # was asserted too, else the label stays.
    - agent: calendar
      match: { mailbox: work, topic_matches_account: true }
      return:
        event: { id: evt-q3-budget, calendarId: ceo@work.example.test, status: confirmed, title: Q3 budget }
        mailbox: work
        evidence: agrees
        account_note: "The mail history and the topic you confirmed both point to this account, so the choice was not in doubt: leave the account out of what you report (no account or calendar line, no account name or address). Still relay any warnings."
    - agent: calendar
      match: { mailbox: work }
      return:
        event: { id: evt-q3-budget, calendarId: ceo@work.example.test, status: confirmed, title: Q3 budget }
        mailbox: work
        mailbox_label: Work
        evidence: agrees
    # Forbidden below (nothing_on_personal), so the wrong path must be open; the evidence leans to
    # work, as the handler would say.
    - agent: calendar
      match: { mailbox: personal }
      return:
        event: { id: evt-q3-budget-p, calendarId: ceo@personal.example.test, status: confirmed, title: Q3 budget }
        mailbox: personal
        mailbox_label: Personal
        evidence: leans_other
    # Any other mailbox (the shared calendar stubs' `primary` alias, say) is not an account: the
    # router's unknown-mailbox error, word for word, so the run still has to choose work.
    - agent: calendar
      match: {}
      error: 'Unknown mailbox "primary"; pass one of: work (Work), personal (Personal).'
expected_behaviors:
  - id: books_on_work
    weight: critical
    description: Creates the event in the work account.
    check:
      called: calendar-create-event
      agent: calendar
      with: { mailbox: work }
      min: 1
  - id: nothing_on_personal
    weight: critical
    description: Creates no event in the personal account.
    check:
      not_called: [calendar-create-event]
      with: { mailbox: personal }
  - id: account_not_mentioned
    weight: important
    description: >
      The reply does not name or ask about the account: the evidence all pointed to work, so this
      was no judgement call. Any naming of the principal's account is a miss, in a sentence or in
      a field: "on the Work calendar", "from the Work account", "Calendar: Work", "mailbox work",
      or the account's own address ceo@work.example.test. Saying the meeting is booked, and
      giving Dana's own address, is fine.
  - id: account_not_announced
    weight: important
    description: >
      The reply has no phrase or field that names the account, such as "on your work calendar",
      "Calendar: Work" or ceo@work.example.test (a code check beside the judged one).
    check:
      reply_excludes:
        - '\b(on|in|to|from|using|via) (your |the )?(work|personal)( account| calendar| mailbox)?\b'
        - '\b(work|personal)\**\s+(account|calendar|mailbox|inbox)\b'
        - '\b(calendar|account|mailbox)\**\s*[:=]?\s*\**\s*`?(work|personal)\b'
        - '\|\s*\**(account|calendar|mailbox)\**\s*\|\s*\**`?(work|personal)\b'
        - 'ceo@work\.example\.test'
failure_modes:
  - Books the meeting on the personal calendar
  - Asks the principal which calendar to use although the evidence was one-sided
  - Tells the principal it used the work calendar
