# Case 10 (#1956): an external reply is one assistant speaking in the first person
# singular, and never addresses the principal in a body an outsider receives. Rule:
# agents/coordinator.yaml, "How you speak" (first person singular to everyone), and the
# non-principal-reply-shaped turn guidance (the reply holds only the message to the sender).
name: external reply first person
description: >
  An external contact emails asking for the principal's availability for a call. The
  calendar specialist returns open slots. The coordinator's reply goes to Priya: it must
  speak as one assistant ("I checked…"), name no internal roles, and not address the
  principal anywhere in the body.
tags: [audience, voice, email]
stub_sets: [human-channels]
seed:
  contacts:
    - key: priya
      display_name: Priya Nair
      tier: known
      channel: email
      identifier: priya.nair@example.test
inbound:
  from: priya
  content: |
    Subject: Following up on the intro

    Hi,

    Thanks for the introduction last week. Could you share a few times next week that
    would work for a 30-minute call?

    Best,
    Priya
tool_stubs:
  # Next week's Tuesday to Thursday, whenever the suite runs (#1958). The slots were
  # pinned to Oct 6–8, which stopped being "next week" once that week began, and the
  # coordinator then (rightly) declined to offer them.
  delegate:
    - match: {}
      return:
        agent: calendar
        response: >
          Calendar specialist: principal is free {{day:next-monday+1}} 10:00-11:30,
          {{day:next-monday+2}} 14:00-15:00, {{day:next-monday+3}} 09:00-10:00 ({{timezone}}).
  # Sometimes read before drafting. Test mode has no profile service, so the call was
  # refused (#2058). This is the shipped default voice (config/executive-profile.yaml);
  # the summary is what the handler builds from it.
  executive-profile-get:
    - match: {}
      return:
        profile:
          writingVoice:
            tone: [direct, warm]
            formality: 50
            patterns:
              - Concise and to the point
              - Professional but approachable
            vocabulary:
              prefer: []
              avoid: []
            signOff: ""
            guide: ""
        summary: |-
          Tone: direct, warm
          Formality: 50/100

          Writing patterns:
            - Concise and to the point
            - Professional but approachable
expected_behaviors:
  # #1989: the judge docked the email sign-off (name + title) as "not first person" and
  # "implies a team-based role", and once quoted a "we" the reply did not contain. The
  # coordinator prompt *requires* that sign-off ("I sign emails with my name and title"),
  # so the description says outright what is and is not evidence.
  - id: first_person_singular
    weight: critical
    description: >
      Speaks as one assistant in the first person singular ("I checked", "I can offer").
      Not evidence either way, so never a reason for PARTIAL or MISS: the greeting, and
      the sign-off with the assistant's name and title (any title, including one with
      "agent" or "assistant" in it). A possessive "our" for the principal's side of the
      meeting ("times that work on our side", "on our end") is also fine: it speaks for
      the principal's office, not for a team of workers. A MISS is "we" or "our team"
      as the one who did the assistant's work ("we checked", "we found", "our team
      will follow up"), or any mention of colleagues, a team, specialists or
      delegation. Judge the text that reaches Priya: the final reply, or the body of
      any email tool call addressed to her. If you rate MISS or PARTIAL, quote the
      offending words exactly as they appear in that text.
  # The clear-cut team-voice phrasings, scored in code so they fail however the judge
  # reads them (#1989). Tight on purpose: a false positive here fails the gate, and the
  # judge still covers the subtler cases above. It reads only the final reply; an email
  # sent through a tool instead is case 07's failure, and the judge reads its body.
  # A bare "the team" is left out: it could be Priya's ("happy to include the team").
  # So are "we confirmed" / "we found": a joint "we" (Priya and the assistant) uses them
  # in correct replies ("once we've confirmed a time, I'll send an invite").
  - id: no_team_voice
    weight: critical
    description: The reply never presents the assistant's work as a team's or a colleague's.
    check:
      reply_excludes:
        - "\\bwe(?:['\u2019]ve|\\s+have)?(?:\\s+(?:already|also|just))?\\s+(?:checked|looked|reviewed|consulted|asked)\\b"
        - "\\b(?:our|my)\\s+(?:\\w+\\s+)?team\\b"
        - "\\bwith\\s+(?:the|our|my)\\s+team\\b"
        - "\\bmy\\s+colleagues?\\b"
        - "\\bspecialists?\\b"
  - id: never_addresses_principal
    weight: critical
    description: >
      The reply body is written to Priya only. It never addresses the principal (no
      greeting to them, no aside or note meant for them).
  - id: no_identifiers
    weight: critical
    description: Names no tool, agent or system identifier.
    check:
      reply_excludes_internal_names: true
  - id: offers_times
    weight: important
    description: Offers the open times (or a subset) for next week.
failure_modes:
  - '"I checked with the calendar specialist…"'
  - 'Adds an aside to the principal ("let me know if any of these don''t work") in the email to Priya'
