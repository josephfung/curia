# ceo-inbox, the hourly triage cron finds a live drain task and a stalled duplicate
# (#2378). Rule: the hourly `schedule:` payload in agents/ceo-inbox.yaml: when any drain
# task is live (here a failed wake the scheduler will retry, wake_state retrying), a drain
# cycle owns the inbox, so the cron completes each stalled duplicate and exits without
# triaging. It must not touch the live task.
#
# Unread mail is waiting and every mailbox and task write succeeds, so triaging or
# completing the live task is available.
name: inbox cron closes a stalled duplicate beside a live drain task
description: >
  ceo-inbox's hourly triage fires. task-list returns two inbox-drain tasks: one whose wake
  failed and is due to be retried (wake_state retrying), and a stalled duplicate with no
  wake. ceo-inbox completes the stalled duplicate, leaves the live task alone, and exits
  without listing or triaging the inbox.
tags: [specialist-ceo-inbox, ceo-inbox, scheduler, triage, inbox-drain]
agent: ceo-inbox
timeout_seconds: 300
stub_sets: [ceo-inbox-mailroom, deferred-work]
inbound:
  from: scheduler
  content: >
    First call task-list with status 'open,in_progress' and tag 'inbox-drain'.
    A returned task with next_wake_at or wake_state set is live; one with
    neither is stalled. If any is live, a drain cycle owns the inbox:
    task-complete each stalled one ("stalled duplicate"), then exit without
    output. Otherwise the first stalled task is THE drain task for this run;
    task-complete any other stalled ones. Then check the principal's inbox for
    unread messages. Triage one batch using the protocol below, then
    self-continue (Step 6) if more unread remain. If there are no unread
    messages, follow Step 3 and exit without output.
tool_stubs:
  task-list:
    - match: {}
      return:
        tasks:
          - task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000309
            title: Drain principal inbox backlog
            status: in_progress
            owner: curia
            priority: 3
            tags: [inbox-drain]
            age: today
            last_progress_note: batch done, more queued
            next_wake_at: null
            wake_state: retrying
            source_agent_id: ceo-inbox
            blocked_by_task_id: null
            parent_task_id: null
          - task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000310
            title: Drain principal inbox backlog
            status: in_progress
            owner: curia
            priority: 3
            tags: [inbox-drain]
            age: today
            last_progress_note: batch done, more queued
            next_wake_at: null
            wake_state: null
            source_agent_id: ceo-inbox
            blocked_by_task_id: null
            parent_task_id: null
        count: 2
        displayTimezone: "{{timezone}}"
  task-update:
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000309 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000309, title: Drain principal inbox backlog, status: in_progress, owner: curia, priority: 3, tags: [inbox-drain], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000310 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000310, title: Drain principal inbox backlog, status: in_progress, owner: curia, priority: 3, tags: [inbox-drain], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  task-complete:
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000309 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000309, title: Drain principal inbox backlog, status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000310 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000310, title: Drain principal inbox backlog, status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  ceo-inbox-list:
    - match: {}
      return:
        count: 1
        has_more: false
        messages:
          - id: msg-30u-news
            threadId: thr-30u-news
            subject: "Product Weekly #215: retention"
            from: [{ name: Product Weekly, email: newsletter@productweekly.example.test }]
            to: [{ email: principal@example.test }]
            cc: []
            date: 1791879000
            unread: true
            folders: [INBOX, UNREAD]
            attachments: []
            snippet: This week — retention loops. Unsubscribe anytime.
expected_behaviors:
  - id: completes_duplicate
    weight: critical
    description: Completes the stalled duplicate.
    check:
      called: task-complete
      with: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000310 }
  - id: leaves_live_task_alone
    weight: critical
    description: Does not complete or update the live drain task.
    check:
      not_called: [task-complete, task-update]
      with: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000309 }
  - id: no_triage
    weight: critical
    description: Does not list or triage the inbox while a drain cycle owns it.
    check:
      not_called: [ceo-inbox-list, ceo-inbox-read, ceo-inbox-archive, ceo-inbox-label, ceo-inbox-mark-read, ceo-inbox-update-folders]
  - id: no_new_drain_task
    weight: critical
    description: Creates no new drain task.
    check:
      not_called: [task-create]
failure_modes:
  - Completes the live drain task (the 06:00 failure on the retry path)
  - Leaves the stalled duplicate open beside the live cycle
  - Triages while a drain cycle owns the inbox
