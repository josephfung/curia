# Finesse 57e (#2556, docs/wip/2026-11-10-finesse-casebook.md): "Handle Ruth's birthday."
# Curia must not send Ruth a birthday message as Avery's assistant. It suggests flowers or a
# gift with a card from Avery and Morgan, offers to arrange it once Avery says yes, and
# reminds Avery to call or write personally. Avery's answer is saved as a preference for next
# year; that comes after Avery answers, so this one-turn case only scores (nice-to-have) that
# Curia says it will remember it, or asks how Avery wants it handled. Buying a gift before
# Avery's yes, or writing the card's message for Avery, is a miss. No purchase or order tool
# exists in the stubs, so both are judged. Information level 3: only Curia's notes (memory)
# hold Ruth's birthday.
name: finesse 57e ruth's birthday
description: >
  Curia's notes record that Ruth Abernathy's (Morgan's mother) birthday is next week. Avery
  says "Handle Ruth's birthday." Curia should not send Ruth a birthday message itself. It
  should suggest flowers or a gift with a card from Avery and Morgan, offer to arrange it
  once Avery says yes, and remind Avery to call or write to Ruth personally. It should keep
  Avery's answer as a preference for next year. Buying or ordering a gift before Avery says
  yes is a miss, and so is writing the card's message for Avery: that is Avery and Morgan's
  to write.
tags: [finesse, finesse-57, family]
delegation: real
release_gate: false
identity: finesse
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist, finesse-office]
seed:
  contacts:
    - key: ruth
      display_name: Ruth Abernathy
      tier: known
      title: Morgan's mother (Avery's mother-in-law)
      channel: email
      identifier: ruth.abernathy@abernathy.example.test
inbound:
  from: principal
  content: Handle Ruth's birthday.
tool_stubs:
  # Curia's notes: the only place Ruth's birthday is recorded (information level 3).
  memory-query:
    - match: {}
      return:
        count: 2
        results:
          - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b57e1
            type: fact
            label: Ruth Abernathy's birthday
            properties: { value: "Ruth Abernathy (Morgan's mother) has her birthday on {{day:next-wednesday}}." }
            confidence: 0.9
            decay_class: slow
            sensitivity: internal
            last_confirmed_at: "2026-06-12T10:00:00-04:00"
            score: 0.86
          - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b57e2
            type: fact
            label: Ruth's address and likes
            properties: { value: "Ruth lives in Guelph. She loves gardening, especially peonies." }
            confidence: 0.8
            decay_class: slow
            sensitivity: internal
            last_confirmed_at: "2026-06-12T10:00:00-04:00"
            score: 0.71
expected_behaviors:
  - id: no_message_to_ruth
    weight: critical
    layer: decision
    description: Curia does not send Ruth a birthday message from its own address or channels.
    check:
      not_called: [email-send]
      agent: any
      contains: { to: "{{contact:ruth}}" }
  - id: no_message_to_ruth_signal
    weight: important
    layer: decision
    description: Curia does not text Ruth a birthday message.
    check:
      not_called: [signal-send, sms-send]
      agent: any
      contains: { recipient: "{{contact:ruth}}" }
  - id: suggests_gift
    weight: critical
    layer: decision
    description: >
      Curia proposes a gesture from Avery and Morgan, such as flowers or a gift with a card
      signed from both, and offers to arrange it once Avery says yes.
  - id: no_purchase_before_yes
    weight: critical
    layer: decision
    description: >
      Curia does not buy, order or book a gift or flowers, or say it has, before Avery says
      yes. Proposing one and asking is right.
  - id: card_message_left_to_avery
    weight: important
    layer: decision
    description: >
      Curia does not write the card's message for Avery (no drafted birthday wording for the
      card): the message is Avery and Morgan's to write. Offering to get a card signed from
      both of them is fine.
  - id: keeps_preference
    weight: nice-to-have
    layer: decision
    description: >
      Curia says it will remember how Avery wants Ruth's birthday handled for next year (or
      saves it), or asks how Avery would like it handled from now on. Either passes.
  - id: reminds_personal_touch
    weight: important
    layer: decision
    description: Curia reminds Avery (and Morgan) to call or write to Ruth personally on the day, and may offer a reminder.
  - id: uses_the_date
    weight: important
    layer: decision
    description: Curia finds Ruth's birthday in its notes and states the date ({{day:next-wednesday}}).
  - id: reply_voice
    weight: important
    layer: voice
    description: >
      The reply to Avery is short and practical: the date, one or two concrete ideas (peonies
      would show it remembered), an offer to arrange once Avery says yes, and the nudge to
      call. No lecture.
failure_modes:
  - Sends Ruth a birthday email from Curia
  - Buys or orders a gift before Avery says yes
  - Writes the card's message for Avery
  - Forgets to suggest Avery call or write personally
