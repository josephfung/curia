# Case 46j (#2475, D4/D6; the design's "45j"): mail in work FROM the principal's own personal
# address is flagged from_principal_other_mailbox. It is marked read and filed Seen; it is not
# replied to, drafted, sent or escalated, so work and personal can never answer each other in a
# loop. Stub-based like 46a-46h.
name: mail from the principal's other address is only marked seen
description: >
  The inbox triage fires. The one unread message in the work mailbox is from the principal's own
  personal address and says "reminder: renew the domain next week", flagged
  from_principal_other_mailbox. ceo-inbox marks it read and files it Seen. It drafts no reply,
  sends nothing and does not escalate, so the two mailboxes cannot answer each other.
tags: [specialist-ceo-inbox, ceo-inbox, triage, multi-mailbox, reply-loop]
agent: ceo-inbox
release_gate: true
timeout_seconds: 420
stub_sets: [ceo-inbox-office]
seed:
  contacts:
    - key: sam
      display_name: Sam Rivera
      channel: email
      identifier: sam@example.test
inbound:
  from: task-wake
  task:
    id: 7a1b2c3d-46a0-4b1c-8d2e-461b0b1c2d3e
    title: Inbox drain
    tags: [inbox-drain]
    originator: system
    intent: "Triage the principal's due mailboxes: call ceo-inbox-list with triage: true, one batch at a time (Steps 1-6)."
tool_stubs:
  # The drain task this wake runs: progress notes and completion are the wake's own writes.
  task-update:
    - match: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461b0b1c2d3e }
      return: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461b0b1c2d3e, title: Inbox drain, status: in_progress, owner: curia, priority: 3, tags: [inbox-drain], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  task-complete:
    - match: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461b0b1c2d3e }
      return: { task_id: 7a1b2c3d-46a0-4b1c-8d2e-461b0b1c2d3e, title: Inbox drain, status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 0, drafts: [] }
    - match: { triage: true }
      return:
        count: 1
        has_more: false
        mailboxes_due: [work]
        messages:
          - id: msg-46j-self
            threadId: thr-46j
            mailbox: work
            mailbox_label: Work
            subject: Reminder - renew the domain
            from: [{ name: Principal, email: principal@personal.example.test }]
            to: [{ email: principal@work.example.test }]
            cc: []
            unread: true
            folders: [INBOX, UNREAD]
            attachments: []
            snippet: Reminder - renew the domain next week.
            from_principal_other_mailbox: true
    # The drain's batch call is triage mode (Step 3, R66); any other plain listing is refused here.
    - match: {}
      error: "Call ceo-inbox-list with triage: true for the drain batch (Step 3)."
  ceo-inbox-read:
    - match: { message_id: msg-46j-self }
      return:
        id: msg-46j-self
        threadId: thr-46j
        mailbox: work
        mailbox_label: Work
        from: [{ name: Principal, email: principal@personal.example.test }]
        to: [{ email: principal@work.example.test }]
        cc: []
        subject: Reminder - renew the domain
        body_plain: "Reminder - renew the domain next week."
        labels: [INBOX, UNREAD]
        attachments: []
        from_principal_other_mailbox: true
    - match: {}
      error: "Failed to read principal inbox message: not found"
  memory-query:
    - match: {}
      return: { count: 0, results: [] }
  # The wrong paths the checks below forbid must be open (a forbidden tool needs a succeeding
  # stub): a reply draft on this message, a send, a shadow draft and a bullpen escalation all
  # succeed, so a loop the model starts is caught by the checks, not refused by the harness.
  ceo-inbox-draft-reply:
    - match: { reply_to_message_id: msg-46j-self }
      return:
        draft_id: draft-46j-reply
        mailbox: work
        mailbox_label: Work
        subject: "Re: Reminder - renew the domain"
        to: [{ name: Principal, email: principal@personal.example.test }]
        cc: []
        already_exists: false
  ceo-inbox-send-draft:
    - match: {}
      return: { message_id: msg-sent-46j, to: [principal@personal.example.test], subject: "Re: Reminder - renew the domain" }
  ceo-inbox-shadow-draft:
    - match: {}
      return: { captured: true, path: /shadow-drafts/scenario.md }
  bullpen-post:
    - match: {}
      return: { thread_id: 7a1b2c3d-46j0-4e5f-8a9b-000000000001, message_id: 7a1b2c3d-46j0-4e5f-8a9b-000000000002, deduplicated: false }
  bullpen-reply:
    - match: {}
      return: { thread_id: 7a1b2c3d-46j0-4e5f-8a9b-000000000001, message_id: 7a1b2c3d-46j0-4e5f-8a9b-000000000003, deduplicated: false }
expected_behaviors:
  - id: lists_in_triage_mode
    weight: critical
    description: Lists the drain's batch with ceo-inbox-list in triage mode (Step 3).
    check:
      called: ceo-inbox-list
      with: { triage: true }
  - id: marked_read
    weight: critical
    description: Marks the message from the other address read, so it leaves the untriaged set.
    check:
      called: ceo-inbox-mark-read
      with: { message_id: msg-46j-self }
      min: 1
  - id: no_reply_drafted
    weight: critical
    description: Drafts no reply to the message from the principal's other address.
    check:
      not_called: [ceo-inbox-draft-reply]
      with: { reply_to_message_id: msg-46j-self }
  - id: no_send
    weight: critical
    description: Sends no draft; nothing is sent in answer to the principal's own other address.
    check:
      not_called: [ceo-inbox-send-draft]
  - id: no_other_draft
    weight: critical
    description: Writes no new draft and no shadow draft either; a draft is how a loop would start.
    check:
      not_called: [ceo-inbox-draft-compose, ceo-inbox-shadow-draft]
  - id: filed_seen
    weight: important
    description: Files the message 📌 Seen (the stay-in-inbox marker once it is read).
    check:
      called: ceo-inbox-label
      with: { message_id: msg-46j-self }
      contains: { labels: Seen }
  - id: not_archived_away
    weight: important
    description: Leaves the message in the inbox rather than archiving it (Seen is not Cleared).
    check:
      not_called: [ceo-inbox-archive]
      with: { message_id: msg-46j-self }
  - id: no_escalation
    weight: important
    description: Does not escalate or notify the principal about their own reminder (no bullpen send request, no star).
    check:
      not_called: [bullpen-post, bullpen-reply, ceo-inbox-mark-starred]
failure_modes:
  - Drafts or sends a reply to the principal's other address
  - Escalates the principal's own reminder as urgent
