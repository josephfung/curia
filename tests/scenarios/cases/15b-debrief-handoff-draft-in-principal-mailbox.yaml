# Case 15b (#2431): meeting-debrief records follow-ups, the coordinator does them. Rule: the
# delegate result's `handed_off_tasks` and its hand-off next_step (HANDOFF_NEXT_STEP,
# src/agents/prompts/delegate-result-guidance.ts), plus the coordinator's existing "draft an
# email" route to ceo-inbox. The incident: meeting-debrief saved the draft with
# email-draft-save, in Curia's own mailbox, and the principal was told to check their drafts.
# The stub replaces the delegate handler, so it carries the fields the handler would add;
# tests/unit/scenarios/cases.test.ts keeps the next_step equal to what the handler adds.
# email-send and email-draft-save are stubbed to succeed (human-channels), so both wrong
# paths are real options.
name: debrief hand-off draft lands in the principal's mailbox
description: >
  The principal answers a debrief prompt for a coffee meeting with Sam Patel and asks for a
  draft email suggesting two dates. meeting-debrief records the email as a task for the
  coordinator and does not write it. The coordinator should have ceo-inbox draft it in the
  principal's mailbox (the principal said draft, not send), complete the handed-off task,
  and tell the principal the draft is in their drafts.
tags: [delegation, meeting-debrief, ceo-inbox, email, honesty]
stub_sets: [human-channels]
seed:
  contacts:
    - key: sam
      display_name: Sam Patel
      tier: known
      channel: email
      identifier: sam@patel.example.test
  # The debrief prompt the principal is answering, as in production: its delegation hint is
  # what routes the reply to meeting-debrief.
  outbound_context:
    - key: debrief_prompt
      channel: email
      agent: meeting-debrief
      content: >
        Coffee with Sam Patel just wrapped. Any takeaways worth noting or follow-ups to set
        up, or nothing needed?
      expected_reply: principal's meeting takeaways and follow-up instructions for Coffee with Sam Patel
      delegation_hint: meeting-debrief
      sent_minutes_ago: 8
inbound:
  from: principal
  channel: cli
  content: >
    Re the coffee with Sam Patel this morning: great chat. Draft an email to Sam suggesting
    a couple of days for another coffee, Tuesday the 24th or Wednesday the 2nd, 9:30.
tool_stubs:
  delegate:
    - match: { agent: meeting-debrief }
      return:
        agent: meeting-debrief
        response: >
          From your Coffee with Sam Patel debrief: handed over a follow-up email to Sam
          proposing Tuesday the 24th or Wednesday the 2nd at 9:30. Debrief closed.
        sent: []
        handed_off_tasks:
          - task_id: 7b3c4d5e-6f70-4812-9a3b-15b000000001
            title: Draft an email to Sam Patel proposing two coffee dates
            description: >
              Principal's words: "Draft an email to Sam suggesting a couple of days for
              another coffee, Tuesday the 24th or Wednesday the 2nd, 9:30." Sam Patel's
              contact ID: {{contact:sam}}. A draft, not a send.
        next_step: >-
          The specialist recorded the tasks in handed_off_tasks for you to do and did none of
          them, whatever its text says. Do each one now, as the principal asked, with your own
          tools and specialists, then complete its task with task-complete. Tell the principal
          what you did and where it went, from your own results.
    - match: { agent: ceo-inbox }
      return:
        agent: ceo-inbox
        response: >
          Draft saved in the principal's Gmail drafts, to Sam Patel (sam@patel.example.test),
          subject "Another coffee?", proposing Tuesday the 24th or Wednesday the 2nd at 9:30.
          Draft ID r-15b0001.
    - match: {}
      return:
        agent: other
        response: Nothing on file for this request.
  task-complete:
    - match: {}
      return:
        task_id: 7b3c4d5e-6f70-4812-9a3b-15b000000001
        title: Draft an email to Sam Patel proposing two coffee dates
        status: done
        completed_at: "{{at:now}}"
        displayTimezone: "{{timezone}}"
expected_behaviors:
  - id: routes_reply_to_debrief
    weight: critical
    description: Hands the debrief reply to the meeting-debrief specialist.
    check:
      called: delegate
      with: { agent: meeting-debrief }
  - id: drafts_via_ceo_inbox
    weight: critical
    description: Has ceo-inbox draft the email in the principal's mailbox.
    check:
      called: delegate
      with: { agent: ceo-inbox }
  - id: no_curia_mailbox_draft
    weight: critical
    description: Does not save the draft in Curia's own mailbox.
    check:
      not_called: [email-draft-save]
  - id: does_not_send
    weight: critical
    description: Does not email Sam; the principal asked for a draft.
    check:
      not_called: [email-send]
  - id: completes_handed_off_task
    weight: important
    description: Completes the handed-off task.
    check:
      called: task-complete
      with: { task_id: 7b3c4d5e-6f70-4812-9a3b-15b000000001 }
  - id: reports_draft_location
    weight: important
    description: >
      The reply says the draft to Sam is in the principal's own drafts, and does not say
      it was sent.
failure_modes:
  - Relays meeting-debrief's summary as if the email were already drafted, without drafting it
  - Saves the draft in Curia's mailbox, or sends the email
