# Case 15b (#2431): a debrief follow-up wakes the coordinator, which does it and stays
# quiet. meeting-debrief records each follow-up as a task for the coordinator with wake_at
# now (agents/meeting-debrief.yaml Step D3); its progress note carries the principal's
# words and when to report. Rules: the coordinator's "draft an email" route to ceo-inbox,
# and SCHEDULER_DELIVERY (src/agents/prompts/turn-guidance.ts), under which a scheduled run
# sends nothing unless its task asks. The principal was already told the draft is coming,
# so a message now is a second one with nothing new. The incident: the draft went to
# Curia's own mailbox through email-draft-save. Both wrong paths succeed (human-channels).
name: debrief follow-up draft wake stays quiet
description: >
  The coordinator wakes on a task meeting-debrief handed it: draft an email to Sam Patel
  proposing two coffee dates. It should have ceo-inbox draft it in the principal's mailbox,
  complete the task, and send the principal nothing, since the note says to tell them only
  if it can't be done.
tags: [task-wake, meeting-debrief, ceo-inbox, email]
stub_sets: [human-channels]
seed:
  contacts:
    - key: sam
      display_name: Sam Patel
      tier: known
      channel: email
      identifier: sam@patel.example.test
inbound:
  from: task-wake
  task:
    id: 7b3c4d5e-6f70-4812-9a3b-15b000000001
    title: Draft an email to Sam Patel proposing two coffee dates
    intent: Draft an email to Sam Patel proposing two coffee dates.
    tags: [debrief-followup]
    notes:
      - at: "{{at:now-1m}}"
        note: >
          From the Coffee with Sam Patel debrief. Principal's words: "Draft an email to Sam
          suggesting a couple of days for another coffee, Tuesday the 24th or Wednesday the
          2nd, 9:30." Sam Patel's contact ID: {{contact:sam}}. A draft in the principal's
          mailbox, not a send. Tell the principal only if it can't be done.
tool_stubs:
  delegate:
    - match: { agent: ceo-inbox }
      return:
        agent: ceo-inbox
        response: >
          Draft saved in the principal's Gmail drafts, to Sam Patel (sam@patel.example.test),
          subject "Another coffee?", proposing Tuesday the 24th or Wednesday the 2nd at 9:30.
          Draft ID r-15b0001.
    - match: {}
      return:
        agent: other
        response: Nothing on file for this request.
  task-complete:
    - match: {}
      return:
        task_id: 7b3c4d5e-6f70-4812-9a3b-15b000000001
        title: Draft an email to Sam Patel proposing two coffee dates
        status: done
        completed_at: "{{at:now}}"
        displayTimezone: "{{timezone}}"
expected_behaviors:
  - id: drafts_via_ceo_inbox
    weight: critical
    description: Has ceo-inbox draft the email in the principal's mailbox.
    check:
      called: delegate
      with: { agent: ceo-inbox }
  - id: no_curia_mailbox_draft
    weight: critical
    description: Does not save the draft in Curia's own mailbox.
    check:
      not_called: [email-draft-save]
  - id: sends_nothing
    weight: critical
    description: Sends no message to anyone, Sam or the principal; the draft needs no report.
    check:
      not_called: [email-send, signal-send, sms-send, slack-send]
  - id: completes_task
    weight: important
    description: Completes the task.
    check:
      called: task-complete
      with: { task_id: 7b3c4d5e-6f70-4812-9a3b-15b000000001 }
failure_modes:
  - Messages the principal that the draft is ready
  - Saves the draft in Curia's mailbox, or sends the email to Sam
