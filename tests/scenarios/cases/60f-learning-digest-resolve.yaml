# Case 60f (#2764 Layer 2 D4): resolving a learning-digest item needs that skill.
name: learning-digest resolve item
description: >
  The principal asks the coordinator to accept a pending learning-digest suggestion.
  The coordinator activates learning-digest and calls resolve-learning-digest
  successfully.
tags: [learning-digest, skill-activation, on-demand]
release_gate: false
inbound:
  from: principal
  channel: cli
  content: >
    Confirm task 1 — yes, keep using that phrasing.
tool_stubs:
  list-learning-digest:
    - match: {}
      return:
        voice_guide: Prefer "talk soon" over "best regards" in short Signal notes
        completion_items: []
        sections_markdown: "1. Prefer talk soon over best regards"
  resolve-learning-digest:
    - match: { action: approve_voice, number: 1 }
      return: { action: approve_voice, number: 1, status: accepted }
    - match: { action: approve_voice }
      return: { action: approve_voice, number: 1, status: accepted }
    - match: {}
      return: { action: approve_voice, number: 1, status: accepted }
expected_behaviors:
  - id: resolves
    weight: critical
    description: Calls resolve-learning-digest successfully.
    check:
      called: resolve-learning-digest
      success: true
  - id: activates_learning_digest
    weight: critical
    description: learning-digest is activated.
    check:
      skills_activated:
        includes: [learning-digest]
failure_modes:
  - Says it accepted the item without calling resolve-learning-digest
  - Tool refused because learning-digest was never activated
