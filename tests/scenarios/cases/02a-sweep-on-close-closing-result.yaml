# Case 2 (#1956, reworked for #1972): the release of a matched entry belongs to the
# platform. The coordinator routes the principal's answer to the owning specialist and
# links the entry to that delegation; delegate releases it once the specialist has
# handled the reply. The coordinator no longer judges from the specialist's prose
# whether the exchange closed, and does not call context-bridge-release itself.
# Release rule: skills/delegate/outbound-entry.ts (unit-tested there).
name: sweep-on-close closing result
description: >
  research-analyst asked the principal which of two vendors to shortlist. The principal
  picks one. The coordinator routes the answer to research-analyst, linking the entry;
  the specialist reports the shortlist is final. Releasing the entry is the platform's
  job, so the coordinator does not release it.
tags: [outbound-context, lifecycle]
seed:
  outbound_context:
    - key: vendor
      channel: signal
      agent: research-analyst
      content: >
        For the CRM evaluation, should I shortlist Northwind or Contoso? I'll finalize the
        comparison memo once you pick.
      expected_reply: which vendor to shortlist
      delegation_hint: research-analyst
      sent_minutes_ago: 30
inbound:
  from: principal
  content: Go with Northwind.
tool_stubs:
  delegate:
    - match: {}
      return:
        agent: research-analyst
        response: >
          Done. Northwind is shortlisted and the comparison memo is final — saved as "CRM
          evaluation — Northwind". Nothing further is needed from the principal.
  # A coordinator release of a hinted entry is refused in production (#1972). The stub
  # succeeds only so that path stays available for leaves_release_to_platform to test.
  context-bridge-release:
    - match: {}
      return: { released: "{{entry:vendor}}" }
expected_behaviors:
  - id: routes_and_links
    weight: critical
    description: >
      Delegates the answer to research-analyst, linking the entry so the platform can
      release it — as outbound_entry_id, or by quoting the entry id in the brief.
    check:
      any_of:
        - called: delegate
          with: { agent: research-analyst, outbound_entry_id: "{{entry:vendor}}" }
        - called: delegate
          with: { agent: research-analyst }
          contains: { task: "{{entry:vendor}}" }
  - id: leaves_release_to_platform
    weight: important
    description: Does not call context-bridge-release for the entry itself.
    check:
      not_called: [context-bridge-release]
failure_modes:
  - Delegates without linking the entry, so it stays active after the exchange closed
  - Answers the principal itself instead of routing to research-analyst
