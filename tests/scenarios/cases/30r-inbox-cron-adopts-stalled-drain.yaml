# ceo-inbox, the hourly triage cron finds a stalled drain task (#2378). Rule: the hourly
# `schedule:` payload in agents/ceo-inbox.yaml: a drain task with neither next_wake_at nor
# wake_running is stalled and becomes THE drain task for this run, so the cron triages and
# re-arms it in Step 6 rather than leaving the inbox unworked or creating a second task.
#
# Unread mail remains behind this batch (has_more true). task-create and task-complete
# succeed, so a duplicate drain task or an early close is available.
name: inbox cron takes over a stalled drain task
description: >
  ceo-inbox's hourly triage fires. Its inbox-drain task is open but has no wake scheduled
  or running. ceo-inbox triages the batch (archives the newsletter), then re-arms that
  same drain task with task-update. It creates no second drain task and does not complete
  this one while mail remains.
tags: [specialist-ceo-inbox, ceo-inbox, scheduler, triage, inbox-drain]
agent: ceo-inbox
timeout_seconds: 300
stub_sets: [ceo-inbox-mailroom, deferred-work]
inbound:
  from: scheduler
  content: >
    First call task-list with status 'open,in_progress' and tag 'inbox-drain'.
    If a returned task has next_wake_at set or wake_running true, a drain cycle
    is already working the inbox: exit immediately without any output. If one
    has neither, it is stalled: it is THE drain task for this run. Then check
    the principal's inbox for unread messages. Triage one batch using the
    protocol below, then self-continue (Step 6) if more unread remain.
    If there are no unread messages, follow Step 3 and exit without output.
tool_stubs:
  task-list:
    - match: {}
      return:
        tasks:
          - task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306
            title: Drain principal inbox backlog
            status: in_progress
            owner: curia
            priority: 3
            tags: [inbox-drain]
            age: today
            last_progress_note: batch done, more queued
            next_wake_at: null
            wake_running: false
            source_agent_id: ceo-inbox
            blocked_by_task_id: null
            parent_task_id: null
        count: 1
        displayTimezone: "{{timezone}}"
  ceo-inbox-list:
    - match: {}
      return:
        count: 1
        has_more: true
        messages:
          - id: msg-30r-news
            threadId: thr-30r-news
            subject: "Product Weekly #214: pricing pages"
            from: [{ name: Product Weekly, email: newsletter@productweekly.example.test }]
            to: [{ email: principal@example.test }]
            cc: []
            date: 1791879000
            unread: true
            folders: [INBOX, UNREAD]
            attachments: []
            snippet: This week — pricing pages that convert. Unsubscribe anytime.
  ceo-inbox-read:
    - match: { message_id: msg-30r-news }
      return:
        id: msg-30r-news
        threadId: thr-30r-news
        from: [{ name: Product Weekly, email: newsletter@productweekly.example.test }]
        to: [{ email: principal@example.test }]
        cc: []
        subject: "Product Weekly #214: pricing pages"
        body_plain: "This week: pricing pages that convert.\n\nRead online | Unsubscribe | Manage preferences"
        date: 1791879000
        labels: [INBOX, UNREAD]
        attachments: []
    - match: {}
      error: "Failed to read principal inbox message: not found"
  contact-register:
    - match: {}
      return: { contact_id: 6c1d2e3f-4a5b-4c6d-8e7f-30a200000001, display_name: Product Weekly, contact_confidence: 0.5, created: true, verified: true }
  task-update:
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306, title: Drain principal inbox backlog, status: in_progress, owner: curia, priority: 3, tags: [inbox-drain], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  task-complete:
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306, title: Drain principal inbox backlog, status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
expected_behaviors:
  - id: triages_batch
    weight: critical
    description: Archives the newsletter in this batch.
    check:
      called: ceo-inbox-archive
      with: { message_id: msg-30r-news }
  - id: rearms_stalled_task
    weight: critical
    description: Re-arms the stalled drain task with task-update.
    check:
      called: task-update
      with: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306 }
  - id: no_second_drain_task
    weight: critical
    description: Creates no new drain task.
    check:
      not_called: [task-create]
  - id: drain_not_completed
    weight: critical
    description: Does not complete the drain task while unread mail remains.
    check:
      not_called: [task-complete]
      with: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000306 }
failure_modes:
  - Exits without triaging, so a stalled drain task blocks the inbox
  - Creates a second drain task beside the stalled one
