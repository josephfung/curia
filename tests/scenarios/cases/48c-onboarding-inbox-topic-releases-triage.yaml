# Case 48c (#2360): the first onboarding conversation by chat, the "What you'll notice in your
# inbox" topic. Rule: skills/onboarding/SKILL.md, "What you'll notice in your inbox": apply the
# principal's choices, mark the topic done, then call onboarding-triage-release. Triage is held
# from Start until this topic (design §8). The real release tool refuses until the topic is
# done (code, unit-tested); with it stubbed here, the case checks the model's own order.
#
# seed.onboarding gives the principal turn production's onboarding block and the
# `onboarding` skill (src/onboarding/turn-context.ts); its topics match the status stub.
name: onboarding inbox topic releases triage after it
description: >
  The principal is in their first onboarding conversation with Curia, by chat, with their
  mailbox connected. Curia has explained what they will notice in their inbox: the six
  categories, Seen and Cleared mail leaving the inbox, drafts in Drafts, and the two choices
  (labels in Gmail, and whether Curia may send or only draft). The principal agrees: labels
  on, draft only, go ahead. Curia records the choices, marks the inbox topic done, and only
  then releases triage with onboarding-triage-release.
tags: [onboarding]
# New in #2360: an eval until it holds over about 10 runs (docs/dev/behavior-tests.md).
release_gate: false
stub_sets: [human-channels, deferred-work]
seed:
  onboarding:
    task: 6e0b0a2d-2360-4c00-8a00-00000000048c
    topics:
      - { id: inbox-expectations, title: "What you'll notice in your inbox", session: first-conversation }
      - { id: first-look, title: First look, session: first-conversation }
      - { id: next-step, title: Next step, session: first-conversation }
inbound:
  from: principal
  channel: web
  content: >
    That all makes sense. Seen and Cleared mail leaving my inbox is fine. Keep the labels on
    in Gmail, and only draft, don't send anything yourself. Go ahead and start.
tool_stubs:
  onboarding-progress:
    - match: { op: status }
      return:
        taskId: 6e0b0a2d-2360-4c00-8a00-00000000048c
        sessions:
          - id: first-conversation
            title: First conversation
            opened: true
            open:
              - { topicId: inbox-expectations, title: "What you'll notice in your inbox", needsMailbox: true,
                  body: "Every message lands in one of six categories (Urgent, Handled, Drafted, Seen, Cleared, Stuck). Seen and Cleared are marked read and leave the inbox; drafts appear in Drafts. Choices: category labels in Gmail on or off (ceo_inbox/decision_tagging); may I send, or only draft (ceo_inbox/sending). Finish with a read-back: From tomorrow morning you'll see..." }
              - { topicId: first-look, title: First look, needsMailbox: true,
                  body: "Show something real from the last 7 days of email and the next 7 days of calendar, each a fact with an offer." }
              - { topicId: next-step, title: Next step, needsMailbox: false,
                  body: "Agree when to review the drafts and how often to check in." }
            done:
              - { topicId: hello, title: Hello }
              - { topicId: style, title: How I should sound }
              - { topicId: independence, title: How independent I should be }
              - { topicId: connect-mailbox, title: Connect email and calendar }
        mailboxConnected: true
        greetingSent: true
        setupFor: other
        operatorName: Jordan Vale
    - match: { op: topic_done }
      return: { topicId: inbox-expectations, sessionId: first-conversation, outcome: done, onboardingComplete: false }
  onboarding-triage-release:
    - match: {}
      return: { released: true }
  config-store:
    - match: { action: store }
      return: { stored: true }
expected_behaviors:
  - id: marks_inbox_topic_done
    weight: critical
    description: Marks the inbox-expectations topic done with onboarding-progress.
    check:
      called: onboarding-progress
      with: { op: topic_done, topic_id: inbox-expectations, outcome: done }
  - id: releases_triage
    weight: critical
    description: Releases inbox triage with onboarding-triage-release.
    check:
      called: onboarding-triage-release
      success: true
  # Important, not critical: `order` matches tool names only, so a status read before the
  # release also satisfies it. The real tool refuses a release before the topic is done.
  - id: topic_before_release
    weight: important
    description: Marks the topic done before releasing triage, never the other way round.
    check:
      order: [onboarding-progress, onboarding-triage-release]
  - id: records_labels_choice
    weight: important
    description: Records the labels choice in config-store under ceo_inbox/decision_tagging.
    check:
      called: config-store
      with: { action: store, namespace: ceo_inbox, key: decision_tagging }
  - id: reads_back_tomorrow
    weight: important
    description: >
      The reply closes the topic with a short read-back of what the principal will see from
      tomorrow morning (labels on, drafts only, nothing sent), and does not promise anything
      the principal turned down, such as Curia sending mail itself.
failure_modes:
  - Releases triage before marking the inbox topic done
  - Marks the topic done but never releases triage
  - Turns sending on although the principal asked for drafts only
