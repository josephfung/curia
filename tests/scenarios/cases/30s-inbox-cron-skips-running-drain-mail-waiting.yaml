# ceo-inbox, the hourly triage cron fires while a drain wake is mid-batch and unread mail
# is waiting (#2378). Rule: the hourly `schedule:` payload in agents/ceo-inbox.yaml checks
# task-list first; a drain task with next_wake_at or wake_state set is live, so the cron
# run exits without triaging even though there is work to do. 30s is the empty-inbox
# variant that matches the 06:00 incident.
#
# Every mailbox and task write succeeds, so triaging, completing the drain task, or
# creating a second one is available.
name: inbox cron leaves a running drain cycle alone with mail waiting
description: >
  ceo-inbox's hourly triage fires while its inbox-drain task's wake is running mid-batch
  (task-list shows wake_state running, next_wake_at null). Unread mail is waiting.
  ceo-inbox exits without listing or triaging the inbox, and does not complete, update or
  create a drain task.
tags: [specialist-ceo-inbox, ceo-inbox, scheduler, triage, inbox-drain]
agent: ceo-inbox
timeout_seconds: 300
stub_sets: [ceo-inbox-mailroom, deferred-work]
inbound:
  from: scheduler
  content: >
    First call task-list with status 'open,in_progress' and tag 'inbox-drain'.
    A returned task with next_wake_at or wake_state set is live; one with
    neither is stalled. If any is live, a drain cycle owns the inbox:
    task-complete each stalled one ("stalled duplicate"), then exit without
    output. Otherwise the first stalled task is THE drain task for this run;
    task-complete any other stalled ones. Then check the principal's inbox for
    unread messages. Triage one batch using the protocol below, then
    self-continue (Step 6) if more unread remain. If there are no unread
    messages, follow Step 3 and exit without output.
tool_stubs:
  task-list:
    - match: {}
      return:
        tasks:
          - task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000307
            title: Drain principal inbox backlog
            status: in_progress
            owner: curia
            priority: 3
            tags: [inbox-drain]
            age: today
            last_progress_note: batch done, more queued
            next_wake_at: null
            wake_state: running
            source_agent_id: ceo-inbox
            blocked_by_task_id: null
            parent_task_id: null
        count: 1
        displayTimezone: "{{timezone}}"
  ceo-inbox-list:
    - match: {}
      return:
        count: 1
        has_more: true
        messages:
          - id: msg-30s-news
            threadId: thr-30s-news
            subject: "Product Weekly #214: pricing pages"
            from: [{ name: Product Weekly, email: newsletter@productweekly.example.test }]
            to: [{ email: principal@example.test }]
            cc: []
            date: 1791879000
            unread: true
            folders: [INBOX, UNREAD]
            attachments: []
            snippet: This week — pricing pages that convert. Unsubscribe anytime.
  ceo-inbox-read:
    - match: { message_id: msg-30s-news }
      return:
        id: msg-30s-news
        threadId: thr-30s-news
        from: [{ name: Product Weekly, email: newsletter@productweekly.example.test }]
        to: [{ email: principal@example.test }]
        cc: []
        subject: "Product Weekly #214: pricing pages"
        body_plain: "This week: pricing pages that convert.\n\nRead online | Unsubscribe | Manage preferences"
        date: 1791879000
        labels: [INBOX, UNREAD]
        attachments: []
    - match: {}
      error: "Failed to read principal inbox message: not found"
  contact-register:
    - match: {}
      return: { contact_id: 6c1d2e3f-4a5b-4c6d-8e7f-30a300000001, display_name: Product Weekly, contact_confidence: 0.5, created: true, verified: true }
  task-update:
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000307 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000307, title: Drain principal inbox backlog, status: in_progress, owner: curia, priority: 3, tags: [inbox-drain], updated_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
  task-complete:
    - match: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000307 }
      return: { task_id: 5f1c2d3e-3a0d-4c6d-8e7f-000000000307, title: Drain principal inbox backlog, status: done, completed_at: "{{at:now}}", displayTimezone: "{{timezone}}" }
expected_behaviors:
  - id: checks_drain_cycle
    weight: critical
    description: Checks for an open inbox-drain task before triaging.
    check:
      called: task-list
  - id: no_triage
    weight: critical
    description: Does not list or triage the inbox while the drain cycle runs.
    check:
      not_called: [ceo-inbox-list, ceo-inbox-read, ceo-inbox-archive, ceo-inbox-label, ceo-inbox-mark-read, ceo-inbox-update-folders]
  - id: leaves_drain_task_alone
    weight: critical
    description: Does not complete, update or create a drain task.
    check:
      not_called: [task-complete, task-update, task-create]
failure_modes:
  - Triages a batch alongside the running drain wake
  - Completes the drain task under the running wake (the 06:00 failure)
  - Creates a second drain task
