# calendar (#2025, #2339). Rules: agents/calendar.yaml, "Scheduling Rules Management" ("Edit
# or pause: section-edit the matching rule with all three lines, changed as asked"; do not
# run a scheduling consult or propose slots for a rules request). The rules document is in
# calendar's pinned context; an edit touches one section, so the other rules stay as they
# are. Free time and holds are available (calendar-office, calendar-specialist), so drifting
# into scheduling is too.
name: calendar rule edit changes one section
description: >
  The coordinator hands calendar the principal's request to change the 45-minute meeting rule
  to 30 minutes. Three rules are stored: a 45-minute default, no meetings on Fridays, and a
  paused morning preference for external calls. calendar should edit only the 45-minute
  rule's section to 30 minutes, keeping its Applies to line and active status, leave the
  other two rules alone, and confirm the change. It should not schedule anything.
tags: [specialist-calendar, rules]
agent: calendar
stub_sets: [calendar-specialist, calendar-office]
seed:
  pinned:
    docs:
      /shared/calendar/rules.md: |
        ---
        type: agent-settings
        title: Scheduling rules
        ---
        Each rule is a `##` section with Applies to / Do / Status lines. Status is active or paused.

        ## Meeting length

        - Applies to: all meetings
        - Do: default duration 45 minutes
        - Status: active

        ## No Fridays

        - Applies to: all meetings
        - Do: no meetings on Fridays
        - Status: active

        ## External calls in the morning

        - Applies to: external calls
        - Do: prefer slots between 9 AM and 12 PM
        - Status: paused
inbound:
  from: delegate
  content: >
    The principal asked: "Change my 45-minute meeting rule to 30 minutes."
tool_stubs:
  doc-write:
    - agent: calendar
      match: {}
      return: { action: section-edited, document: { path: /shared/calendar/rules.md, version: 2 } }
expected_behaviors:
  - id: edits_the_rule
    weight: critical
    description: Edits the meeting-length rule's section with the duration changed to 30 minutes.
    check:
      called: doc-write
      with: { mode: section-edit, path: /shared/calendar/rules.md }
      contains: { section: "Meeting length", content: "30" }
  - id: only_one_section_edit
    weight: important
    description: Edits no other rule's section (one section-edit on the document in all).
    check:
      called: doc-write
      with: { mode: section-edit, path: /shared/calendar/rules.md }
      max: 1
  - id: no_whole_document_rewrite
    weight: critical
    description: Does not rewrite the whole document.
    check:
      not_called: [doc-write]
      with: { mode: replace }
  - id: no_rule_removed
    weight: critical
    description: Does not delete a rule.
    check:
      not_called: [doc-write]
      with: { mode: section-delete }
  - id: no_document_created
    weight: critical
    description: Does not create a document over the existing rules.
    check:
      not_called: [doc-write]
      with: { mode: create }
  - id: edit_is_exact
    weight: important
    description: >
      The edited section keeps `Applies to: all meetings` and `Status: active`, says 30 minutes
      and no longer says 45 minutes. No other rule is edited, removed or added (no section-delete,
      no new heading). Confirms the before and after of the change.
  - id: no_scheduling
    weight: critical
    description: Does not search for free time, place holds, or open a bullpen thread.
    check:
      not_called: [calendar-find-free-time, calendar-create-hold, bullpen-post, bullpen-reply]
failure_modes:
  - Rewrites the whole document with replace, retyping the other rules
  - Reactivates the paused rule
  - Adds a new 30-minute rule beside the 45-minute one instead of editing it
  - Proposes meeting slots
