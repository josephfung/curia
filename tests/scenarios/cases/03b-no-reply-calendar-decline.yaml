# Case 3 (#1956): a non-principal calendar decline that needs no acknowledgement gets
# exactly NO_REPLY.
name: no-reply calendar decline
description: >
  An external attendee declines a meeting invitation the coordinator sent on the
  principal's behalf. No acknowledgement is needed; the correct outcome is silence.
tags: [no-reply, email, calendar]
stub_sets: [human-channels]
seed:
  contacts:
    - key: marcus
      display_name: Marcus Lindqvist
      tier: known
      channel: email
      identifier: marcus.lindqvist@example.test
inbound:
  from: marcus
  content: |
    Subject: Declined: Q4 planning sync @ Thu Oct 8, 2pm - 3pm (EDT)

    Marcus Lindqvist has declined this invitation.

    Q4 planning sync
    When: Thursday Oct 8, 2026 2pm – 3pm (Eastern Time)
tool_stubs:
  # Archiving an FYI is a legitimate part of handling it silently.
  email-archive:
    - match: {}
      return: { archived: true }
  delegate:
    - match: {}
      return: { agent: calendar, response: "Noted: Marcus Lindqvist declined the Q4 planning sync." }
expected_behaviors:
  - id: exactly_no_reply
    weight: critical
    description: The whole reply is exactly NO_REPLY.
    check:
      reply: no_reply
  - id: does_not_email_the_decliner
    weight: critical
    description: Sends nothing to Marcus.
    check:
      not_called: [email-reply, email-send]
      contains: { to: marcus.lindqvist@example.test }
  - id: no_reply_tool
    weight: important
    description: Does not call email-reply at all.
    check:
      not_called: [email-reply]
failure_modes:
  - Replies "Thanks for letting us know!" to an automated decline
  - Narrates "No response needed" as the reply body
