# Finesse 53a (#2556, docs/wip/2026-11-10-finesse-casebook.md): Avery asks for time with a
# direct report. The better call: Curia books it straight onto both calendars and sends
# Priya a short note that leaves her an easy way to say it doesn't work. Since the
# 2026-11-21 revision, proposing one specific slot (or two or three) for Priya to confirm
# is also right; only a deferential, open-ended request with no time proposed is wrong.
# The "just do it" end of task 53. Telling Avery: in passing, when it's booked (the reply).
# Information level 2: Priya's contact record says VP Product at Halcyon (a direct report).
name: finesse 53a ask time with direct report
description: >
  Avery tells Curia to find 30 minutes with Priya Nair this week to go over the roadmap.
  Priya is VP Product at Halcyon, a direct report (her contact record says so). The better
  call: Curia finds a slot, books it directly and sends Priya a short note saying it's
  booked, leaving her an easy way to say it doesn't work ("Avery wants 30 minutes on the
  roadmap this week. I've booked Wednesday at 3."). Proposing one specific slot, or two or
  three, for Priya to confirm is also right. Curia does not ask Avery to choose the slot. A
  deferential, open-ended request asking whether Priya might be available, with no time
  proposed, is the failure.
tags: [finesse, finesse-53, calendar]
delegation: real
release_gate: false
identity: finesse
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist, finesse-office]
seed:
  contacts:
    - key: priya
      display_name: Priya Nair
      tier: known
      title: VP Product
      organization: Halcyon Robotics
      channel: email
      identifier: priya.nair@halcyon.example.test
inbound:
  from: principal
  content: Find 30 minutes with Priya this week to go over the roadmap.
tool_stubs:
  calendar-list-events:
    - match: {}
      return:
        displayTimezone: "{{timezone}}"
        count: 2
        events:
          - { id: evt-53a-standup, title: Leadership stand-up, location: Room 4B, startTime: "{{time:workday+1 09:00}}", endTime: "{{time:workday+1 09:30}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [{ email: priya.nair@halcyon.example.test }] }
          - { id: evt-53a-board-prep, title: "Focus: board prep", location: null, startTime: "{{time:workday+2 10:00}}", endTime: "{{time:workday+2 12:00}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [] }
  calendar-find-free-time:
    - agent: calendar
      match: {}
      return:
        displayTimezone: "{{timezone}}"
        freeWindows:
          - { start: "{{time:workday+1 14:00}}", end: "{{time:workday+1 16:00}}" }
          - { start: "{{time:workday+2 15:00}}", end: "{{time:workday+2 17:00}}" }
expected_behaviors:
  - id: books_or_proposes
    weight: critical
    layer: decision
    description: >
      Curia acts on it: it books the 30 minutes with Priya, or writes to Priya proposing a
      time.
    check:
      any_of:
        - { called: calendar-create-event, agent: any, contains: { attendees: priya.nair@halcyon.example.test } }
        - { called: email-send, agent: any, contains: { to: "{{contact:priya}}" } }
  - id: names_a_time
    weight: critical
    layer: decision
    description: >
      Curia picks the time: it books a slot, or proposes one specific slot (or two or three)
      for Priya to confirm. Either passes. A deferential, open-ended request asking whether
      Priya might be available, with no time proposed, is a miss, and so is asking Avery to
      choose or confirm the slot.
  - id: books_directly
    weight: nice-to-have
    layer: decision
    description: >
      The better of the two right calls: Curia books the slot directly rather than proposing
      it for Priya to confirm.
    check:
      called: calendar-create-event
      agent: any
      contains: { attendees: priya.nair@halcyon.example.test }
  - id: tells_priya
    weight: important
    layer: decision
    description: Priya gets a short note (or the invite carries one) saying the time is booked.
    check:
      any_of:
        - { called: email-send, agent: any, contains: { to: "{{contact:priya}}" } }
        - { called: calendar-create-event, agent: any, contains: { attendees: priya.nair@halcyon.example.test } }
  - id: no_pointless_lookup
    weight: nice-to-have
    layer: decision
    description: No web search on a direct report.
    check:
      not_called: [web-search]
      agent: any
  - id: priya_note_direct
    weight: critical
    layer: voice
    description: >
      The note to Priya is one or two plain lines: Avery wants 30 minutes on the roadmap, and
      either it's booked for a named time (with an easy way for her to say it doesn't work)
      or here is a specific time, or two or three, for her to confirm. It is not deferential:
      no "would you possibly be available", no open-ended "whenever works best for you" with
      no time named, no apology.
  - id: avery_told_briefly
    weight: nice-to-have
    layer: voice
    description: Avery's reply names the booked time in a line, without asking anything.
contrast:
  group: finesse-53-ask-for-time
  recipient: A direct report who reports to the executive.
  message:
    - { tool: email-send, arg: body, with: { to: "{{contact:priya}}" } }
failure_modes:
  - Asks Priya deferentially and open-endedly whether she might be available, with no time proposed
  - Asks Avery to pick a slot
