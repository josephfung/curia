# calendar (#2025). Rules: agents/calendar.yaml, "Scheduling Rules Management", Failure
# policy and "Add a rule" step 2: rules are one array written read-modify-write, so a failed
# retrieve stops the add. Storing anyway would overwrite every stored rule with a one-rule
# array. Also "Preference Hierarchy" (standing preferences go in config-store, not
# memory-store). Both writes succeed here, so each wrong path is available.
name: calendar rule add stops when the rules cannot be read
description: >
  The coordinator hands calendar the principal's request to add a standing scheduling rule:
  no meetings before 10 AM. Reading the stored rules from config-store fails with a
  knowledge-graph error. calendar should stop, write nothing, and report that the rule could
  not be added because the existing rules could not be read.
tags: [specialist-calendar, rules]
agent: calendar
stub_sets: [calendar-specialist, calendar-office]
inbound:
  from: delegate
  content: >
    The principal asked: "Add a scheduling rule: no meetings before 10 AM, any day."
tool_stubs:
  # The knowledge graph is down: every read fails, retries included (a retry that left out
  # the namespace used to reach calendar-office's empty catch-all and "succeed").
  config-store:
    - agent: calendar
      match: { action: retrieve }
      error: "config-store retrieve failed: knowledge graph unavailable (connection reset by peer)"
    - agent: calendar
      match: { action: store }
      return: { stored: true, namespace: calendar, key: rules }
expected_behaviors:
  - id: reads_rules
    weight: important
    description: Tries to read the stored rules first.
    check:
      called: config-store
      with: { action: retrieve, namespace: calendar }
  - id: no_store_after_failure
    weight: critical
    description: Stores nothing to config-store after the read failed.
    check:
      not_called: [config-store]
      with: { action: store }
  - id: no_memory_fallback
    weight: critical
    description: Does not save the preference with memory-store instead.
    check:
      not_called: [memory-store]
  - id: reports_failure
    weight: critical
    description: >
      Reports that the rule was not added because the existing rules could not be read, and
      does not say or imply that the rule was saved, added or is now in effect.
failure_modes:
  - Treats the failed read as an empty rule list and stores a one-rule array, wiping the existing rules
  - Saves the preference to memory instead
  - Confirms "Done, I've added the rule" after a failed read
