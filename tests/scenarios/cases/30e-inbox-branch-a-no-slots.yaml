# ceo-inbox resume mode, Branch A, `Result: no_slots` (#2025). Ported from smoke
# tests/smoke/cases/ceo-inbox-branch-a-no-slots.yaml (#1977). Rule: agents/ceo-inbox.yaml,
# "Branch A — Calendar consult reply", step 7: recall (5a-c), draft with the `Nearest:`
# slot strings verbatim and say in plain language that they fall outside the requested
# window, ✍️ Drafted folder, archive.
name: inbox branch A no_slots offers nearest slots outside the window
description: >
  ceo-inbox parked Diana Park's email asking for an intro call on two specific days next
  week behind a calendar consult. Calendar found nothing free on those days and returned
  the nearest alternatives, a week later. Memory says the principal prefers video calls
  to phone for first meetings. ceo-inbox drafts a reply offering both nearest slots
  exactly as calendar wrote them, says plainly that they are not on the days Diana asked
  for, and reflects the video-call preference.
tags: [specialist-ceo-inbox, ceo-inbox, resume-mode, scheduling, memory-recall]
agent: ceo-inbox
# On demand until #2126: some runs, on main as on the branch, repeat a bullpen reply with no
# `content` until the turn budget runs out, which errors the run.
release_gate: false
timeout_seconds: 300
stub_sets: [ceo-inbox-mailroom]
seed:
  bullpen:
    - key: consult
      topic: Scheduling consult — Diana Park
      creator: ceo-inbox
      participants: [ceo-inbox, calendar]
      content: |
        CONSULT REQUEST
        Need: 2 conflict-free 30-min slots, with holds placed, returned timezone-labelled
        For:  reply to Diana Park re "Intro call request"
        By:   slots on {{day:next-monday}} or {{day:next-tuesday}}
        Context: source_message_id=18f3f6d2b4a0e783; contact_timezone=America/Toronto
      mentions: [calendar]
inbound:
  from: bullpen
  thread: consult
  author: calendar
  content: |
    CONSULT REPLY
    Result: no_slots
    Nearest:
      - {{day:next-monday+7}} at 10:00 AM ET - earliest available
      - {{day:next-monday+8}} at 2:00 PM ET - also available
tool_stubs:
  bullpen:
    # The handler's own validation errors (skills/bullpen/handler.ts), matched first, so a
    # post or reply missing a required field is refused as production refuses it.
    - match: { action: post, topic: null }
      error: "Missing required field: 'topic'"
    - match: { action: post, participants: null }
      error: "Missing required field: 'participants' (non-empty string array)"
    - match: { action: post, content: null }
      error: "Missing required field: 'content'"
    - match: { action: post, content: "" }
      error: "Missing required field: 'content'"
    - match: { action: reply, thread_id: null }
      error: "Missing required field: 'thread_id'"
    - match: { action: reply, content: null }
      error: "Missing required field: 'content'"
    - match: { action: reply, content: "" }
      error: "Missing required field: 'content'"
    - match: { action: get_thread, thread_id: null }
      error: "Missing required field: 'thread_id'"
    - match: { action: get_thread }
      return:
        thread:
          id: "{{thread:consult}}"
          topic: Scheduling consult — Diana Park
          status: open
          participants: [ceo-inbox, calendar]
        messages:
          - sender: ceo-inbox
            content: |
              CONSULT REQUEST
              Need: 2 conflict-free 30-min slots, with holds placed, returned timezone-labelled
              For:  reply to Diana Park re "Intro call request"
              By:   slots on {{day:next-monday}} or {{day:next-tuesday}}
              Context: source_message_id=18f3f6d2b4a0e783; contact_timezone=America/Toronto
          - sender: calendar
            content: |
              CONSULT REPLY
              Result: no_slots
              Nearest:
                - {{day:next-monday+7}} at 10:00 AM ET - earliest available
                - {{day:next-monday+8}} at 2:00 PM ET - also available
    - match: {}
      return: { thread_id: "{{thread:consult}}", message_id: 7a1b2c3d-30e0-4e5f-8a9b-000000000003 }
  ceo-inbox-read:
    - match: { message_id: 18f3f6d2b4a0e783 }
      return:
        id: 18f3f6d2b4a0e783
        threadId: 18f3f6d2b4a0e783
        from: [{ name: Diana Park, email: diana.park@startupco.example.test }]
        to: [{ email: principal@example.test }]
        cc: []
        subject: Intro call request
        body_plain: "Hi,\n\nI'm the founder of StartupCo and would love 30 minutes to introduce what we're building. Any chance you're free {{day:next-monday}} or {{day:next-tuesday}}?\n\nThanks,\nDiana"
        date: 1791878700
        labels: [INBOX, "⏳ In Progress"]
        attachments: []
    - match: {}
      error: "Failed to read principal inbox message: not found"
  # A re-check of the draft it just wrote finds that draft; the inbox is otherwise quiet.
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 1, drafts: [{ id: draft-30e-1, threadId: 18f3f6d2b4a0e783, subject: "Re: (scenario)", to: [], cc: [], snippet: "(the draft just written)", date: 1791879000 }] }
    - match: {}
      return: { count: 0, has_more: false, messages: [] }
  memory-query:
    - match: {}
      return:
        results:
          - { id: 6b0e4f2a-3c1d-4e5f-8a9b-0c1d2e3f4a53, type: fact, label: Principal call format preference, properties: { attribute: call_format_preference, value: Prefers video calls over phone calls for first meetings. }, confidence: 0.9, decay_class: slow_decay, sensitivity: internal, last_confirmed_at: "{{at:now-96h}}", score: 0.77 }
        count: 1
  ceo-inbox-draft-reply:
    - match: { reply_to_message_id: 18f3f6d2b4a0e783 }
      return: { draft_id: draft-30e-1, subject: "Re: Intro call request", to: [{ name: Diana Park, email: diana.park@startupco.example.test }], cc: [], already_exists: false }
expected_behaviors:
  - id: recalls_before_drafting
    weight: critical
    description: Calls memory-query before it drafts the reply.
    check:
      order: [memory-query, ceo-inbox-draft-reply]
  - id: first_nearest_verbatim
    weight: critical
    description: The draft carries the first Nearest slot as calendar wrote it.
    check:
      called: ceo-inbox-draft-reply
      with: { reply_to_message_id: 18f3f6d2b4a0e783 }
      contains: { body: "{{day:next-monday+7}} at 10:00 AM ET" }
  - id: second_nearest_verbatim
    weight: critical
    description: The draft carries the second Nearest slot as calendar wrote it.
    check:
      called: ceo-inbox-draft-reply
      contains: { body: "{{day:next-monday+8}} at 2:00 PM ET" }
  - id: outside_window_note
    weight: critical
    description: >
      The drafted reply (the body of ceo-inbox-draft-reply) says in plain language that the
      proposed times are not on the days Diana asked for.
  - id: video_preference
    weight: important
    description: >
      The drafted reply proposes a video call, or otherwise reflects the stored preference
      for video over phone.
  - id: marked_drafted
    weight: important
    description: Moves the email to ✍️ Drafted with ceo-inbox-update-folders.
    check:
      called: ceo-inbox-update-folders
      contains: { add_folders: Drafted }
failure_modes:
  - Skips memory-query and drafts without attempting recall
  - Paraphrases the Nearest slot strings instead of using them verbatim
  - Offers the days Diana asked for, although calendar found nothing free then
  - Omits any acknowledgement that the slots are outside the requested days
  - Refuses to draft because nothing was free on the requested days
