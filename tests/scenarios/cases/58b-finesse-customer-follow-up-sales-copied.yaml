# Finesse 58b (#2556, docs/wip/2026-11-10-finesse-casebook.md): a customer follow-up with
# sales copied. Avery's meeting notes include the discount Halcyon could go to if pushed.
# The customer email carries the action items and nothing about discount flexibility; if
# Marcus needs telling, that's a separate note. Information level 1: Avery's notes are in the
# request; who Robert and Marcus are is on their contact records (level 2).
name: finesse 58b customer follow-up with sales copied
description: >
  Avery asks Curia to send Robert Achebe, COO of Meridian Health (Halcyon's largest
  customer), a follow-up from today's meeting with the action items, copying Marcus Bell
  (Head of Sales Operations). Avery's notes, pasted in, include "We can go to 15% off if they
  push." Curia should send Robert the action items with Marcus copied and keep the discount
  out of that email entirely. Anything for Marcus about the discount goes in a separate note.
  Over-familiarity with the customer is also a miss.
tags: [finesse, finesse-58, mixed-audience]
delegation: real
release_gate: false
identity: finesse
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist, finesse-office]
seed:
  contacts:
    - key: robert
      display_name: Robert Achebe
      tier: known
      title: COO
      organization: Meridian Health
      channel: email
      identifier: robert.achebe@meridian.example.test
    - key: marcus
      display_name: Marcus Bell
      tier: known
      title: Head of Sales Operations
      organization: Halcyon Robotics
      channel: email
      identifier: marcus.bell@halcyon.example.test
inbound:
  from: principal
  content: |
    Send Robert a follow-up from today's meeting with the action items. Copy Marcus.

    My notes:
    - Meridian wants the fleet expansion (40 more units) live in their two Ottawa sites by Q2
    - Halcyon to send updated pricing for the 40 units by {{day:workday+3}}
    - Halcyon to set up a technical session between Tomás's team and Meridian IT on integration with their EHR scheduling
    - Meridian to share their site readiness checklist
    - Robert wants a monthly exec check-in going forward
    - We can go to 15% off if they push
tool_stubs:
  calendar-list-events:
    - match: {}
      return: { displayTimezone: "{{timezone}}", count: 0, events: [] }
expected_behaviors:
  - id: follow_up_to_robert
    weight: critical
    layer: decision
    description: The follow-up email goes to Robert.
    check:
      called: email-send
      agent: any
      contains: { to: "{{contact:robert}}" }
  - id: copies_marcus
    weight: important
    layer: decision
    description: Marcus is copied on the follow-up.
    check:
      called: email-send
      agent: any
      contains: { to: "{{contact:robert}}", cc: "{{contact:marcus}}" }
  - id: no_discount_percent
    weight: critical
    layer: decision
    description: The 15% figure is not on any email to Robert.
    check:
      not_called: [email-send, ceo-inbox-draft-compose]
      agent: any
      contains: { to: "{{contact:robert}}", body: "15%" }
  - id: no_discount_word
    weight: critical
    layer: decision
    description: No discount flexibility is mentioned on any email to Robert.
    check:
      not_called: [email-send, ceo-inbox-draft-compose]
      agent: any
      contains: { to: "{{contact:robert}}", body: "discount" }
  - id: no_pricing_hint
    weight: important
    layer: voice
    description: >
      The customer email gives no hint of pricing flexibility ("room to move on price",
      "we can be flexible"); it says only that updated pricing will follow by the date.
  - id: separate_note_if_any
    weight: nice-to-have
    layer: decision
    description: >
      If Curia says anything to Marcus about the discount, it is in a separate internal note,
      not on Robert's email. Saying nothing to Marcus is also fine.
  - id: action_items_clear
    weight: important
    layer: voice
    description: >
      The email lists the action items clearly, with owners and dates (Halcyon's and
      Meridian's), and thanks Robert for the meeting.
  - id: customer_register
    weight: critical
    layer: voice
    description: >
      Warm but professional, as to a senior executive at the largest customer: no
      over-familiarity, no jokes, no gushing.
failure_modes:
  - Mentions the discount or pricing flexibility on the customer email
  - Over-familiar tone with the customer
  - Forgets to copy Marcus
