# meeting-debrief, task wake-up mode at meeting end (#2025). Rules: agents/meeting-debrief.yaml
# "TASK WAKE-UP MODE", Step 6: with prompted:<eventId> absent, revalidate the meeting,
# post one bullpen thread to the coordinator in the request format, store prompted:
# after the post, then task-update owner ceo with the reminder wake_at. Completing the task
# is stubbed to succeed, so closing it instead of handing it to the principal is available.
name: debrief wake delivers the prompt
description: >
  A debrief task meeting-debrief scheduled this morning wakes at the end of the Acme
  partnership review (calendar event evt-acme-0001), a meeting with Sarah Chen and David
  Park of Acme Corp that just ended. No prompt has been sent for it yet. meeting-debrief
  should confirm on the calendar that the meeting happened, open one bullpen thread asking
  the coordinator to send the principal a debrief prompt (in its request format: the
  channel, the context_bridge parameters with the event id, and a short message naming
  the attendees), record the prompted guard, and hand the task to the principal with a
  reminder wake-up.
tags: [specialist-meeting-debrief, meeting-debrief, task-wake]
agent: meeting-debrief
# On demand until #2126: some runs, on main as on the branch, repeat a bullpen post with no
# `content` until the turn budget runs out, which errors the run.
release_gate: false
stub_sets: [meeting-debrief-office]
inbound:
  from: task-wake
  task:
    id: 6a2b3c4d-5e6f-4a7b-8c9d-32b000000001
    title: "Debrief: Acme partnership review"
    tags: [debrief-pending]
    intent: >-
      Debrief the principal's meeting 'Acme partnership review' that ends around
      {{at:now-3m}} (calendar event evt-acme-0001) — prompt at meeting end, then follow up
      on takeaways.
    notes:
      - at: "{{time:today 12:01}}"
        note: Scheduled by the detection run; prompt the principal at meeting end.
tool_stubs:
  calendar-list-events:
    - match: {}
      return:
        count: 1
        displayTimezone: "{{timezone}}"
        events:
          - id: evt-acme-0001
            title: Acme partnership review
            description: Pilot scope and pricing for the Acme partnership.
            location: Acme offices, 200 King St W
            startTime: "{{at:now-63m}}"
            endTime: "{{at:now-3m}}"
            startDate: null
            endDate: null
            participants:
              - { email: avery@testwell-labs.example.test, name: Avery Testwell, status: yes }
              - { email: sarah.chen@acme.example.test, name: Sarah Chen, status: yes }
              - { email: david.park@acme.example.test, name: David Park, status: yes }
            conferencing: null
            status: confirmed
            calendarId: cal-principal-work
            busy: true
            metadata: null
  task-update:
    - match: { task_id: 6a2b3c4d-5e6f-4a7b-8c9d-32b000000001 }
      return:
        task_id: 6a2b3c4d-5e6f-4a7b-8c9d-32b000000001
        title: "Debrief: Acme partnership review"
        status: open
        owner: ceo
        priority: 3
        tags: [debrief-pending]
        updated_at: "{{at:now}}"
        displayTimezone: "{{timezone}}"
  task-complete:
    - match: { task_id: 6a2b3c4d-5e6f-4a7b-8c9d-32b000000001 }
      return:
        task_id: 6a2b3c4d-5e6f-4a7b-8c9d-32b000000001
        title: "Debrief: Acme partnership review"
        status: done
        completed_at: "{{at:now}}"
        displayTimezone: "{{timezone}}"
expected_behaviors:
  - id: revalidates
    weight: critical
    description: Checks the calendar that the meeting happened before prompting.
    check:
      called: calendar-list-events
  - id: posts_once_to_coordinator
    weight: critical
    description: Opens exactly one bullpen thread, with the coordinator as a participant.
    check:
      called: bullpen-post
      contains: { participants: coordinator }
      success: true
      min: 1
      max: 1
  - id: stores_prompted_guard
    weight: critical
    description: Stores the prompted:evt-acme-0001 guard.
    check:
      called: config-store
      with: { action: store }
      contains: { key: "prompted:evt-acme-0001" }
  - id: guard_after_post
    weight: important
    description: The bullpen post comes before the guard write and the task update.
    check:
      order: [bullpen-post, config-store, task-update]
  - id: hands_to_principal
    weight: critical
    description: Updates the task to owner ceo with a wake_at for the reminder.
    check:
      called: task-update
      with: { task_id: 6a2b3c4d-5e6f-4a7b-8c9d-32b000000001, owner: ceo }
      contains: { wake_at: ":" }
  - id: keeps_task_open
    weight: critical
    description: Does not complete the debrief task; the principal has not answered.
    check:
      not_called: [task-complete]
  - id: does_not_cancel
    weight: critical
    description: Does not cancel the debrief task.
    check:
      not_called: [task-update]
      with: { status: cancelled }
  - id: request_format
    weight: important
    description: >
      The bullpen post asks the coordinator to send the debrief prompt to the principal via
      signal, gives context_bridge parameters (agent_id and delegation_hint meeting-debrief,
      an expected_reply, metadata with the subject "Acme partnership review" and eventId
      evt-acme-0001, expires_in_hours 48), and includes a brief message that names
      Sarah Chen and David Park and asks for takeaways or follow-ups.
failure_modes:
  - Posts the prompt without checking the meeting happened
  - Posts twice, or writes the prompted guard before posting
  - Completes the task instead of handing it to the principal with a reminder wake-up
  - Leaves the owner as curia or sets no reminder wake_at
