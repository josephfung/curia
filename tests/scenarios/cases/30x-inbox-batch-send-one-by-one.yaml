# Case 30x (#2474, design D6): the one-by-one half of 30v. The principal skips the Acme draft
# and sends the others, in `origin`. ceo-inbox sends exactly Ruth Alder's and Sam Kerr's and
# leaves Acme (and the older draft) in Drafts.
name: inbox batch send one by one skipping one
description: >
  The principal confirmed the read-back of this morning's drafts but asked to go one by one: skip the draft to Jo Park at Acme and send the other two (Ruth Alder, Sam Kerr). ceo-inbox sends those two and leaves Acme and the older Lee Tan draft unsent. Curia is at autonomy 85 (band gating).
tags: [specialist-ceo-inbox, ceo-inbox, delegated-mode, drafts, send, principal-mailbox, band-gating]
agent: ceo-inbox
release_gate: true
through_gateway: true
autonomy: { score: 85, gating: band }
stub_sets: [ceo-inbox-mailroom]
seed:
  principal_mailbox:
    drafts:
      - id: draft-30-acme
        thread: thr-30-acme
        to: [{ name: Jo Park, email: jo.park@acme.example.test }]
        subject: Venue for the offsite
        body: "Jo, shall we use the Harbour Room for the offsite? Let me know."
        modified: "{{at:now-3h}}"
        by_curia: false
      - id: draft-30-board
        thread: thr-30-board
        to: [{ name: Ruth Alder, email: ruth.alder@northfield.example.test }]
        subject: Board dinner RSVP
        body: "Ruth, thank you for the invitation. I will be glad to attend."
        modified: "{{at:now-4h}}"
        by_curia: false
      - id: draft-30-vendor
        thread: thr-30-vendor
        to: [{ name: Sam Kerr, email: sam.kerr@vendor.example.test }]
        subject: Renewal timing
        body: "Sam, we would like to talk about renewal timing next month."
        modified: "{{at:now-5h}}"
        by_curia: false
      - id: draft-30-old
        thread: thr-30-old
        to: [{ name: Lee Tan, email: lee.tan@lumen.example.test }]
        subject: Pricing follow-up
        body: "Lee, following up on pricing after the demo."
        modified: "{{at:now-48h}}"
        by_curia: false
inbound:
  from: delegate
  requester: principal
  origin: "Send the drafts I wrote this morning. You listed three: Jo Park's venue note, Ruth Alder's RSVP, Sam Kerr's renewal note. Go one by one, skip the Acme one (Jo Park), send the others."
  content: >
    The principal said to go one by one: skip the Acme draft (Jo Park) and send the other two from this morning (Ruth Alder, Sam Kerr).
