# Case 46a (#2475, design D5; decided by the principal 2026-11-11, item 3): the CFO is written to
# only from work, and is on the work domain. The evidence all points one way, so ceo-inbox
# composes in the work account and does not mention the account.
name: mailbox choice cfo composes in work without saying so
description: >
  The coordinator asks ceo-inbox to draft a new email to the CFO about the quarterly budget.
  The principal has two mailboxes. The first compose call (no mailbox) returns needs_mailbox
  with evidence: every message to the CFO went from work and the CFO is on the work domain.
  ceo-inbox should compose again in work and say nothing about which account it used.
tags: [ceo-inbox, delegated-mode, specialist, specialist-ceo-inbox, mailbox-choice, multi-mailbox]
agent: ceo-inbox
stub_sets: [ceo-inbox-office]
seed:
  contacts:
    - key: sam
      display_name: Sam Rivera
      channel: email
      identifier: sam@example.test
    - key: cfo
      display_name: Dana Whitfield
      channel: email
      identifier: dana.whitfield@work.example.test
inbound:
  from: delegate
  # The coordinator hands over the contact ID it resolved, as a delegated brief does.
  content: "The principal asked: draft a short email to Dana Whitfield (contact ID {{contact:cfo}}), our CFO, asking for the Q3 budget numbers by Friday. Draft only."
tool_stubs:
  ceo-inbox-draft-compose:
    - match: { mailbox: null }
      return:
        needs_mailbox: true
        evidence:
          - { mailbox: work, mailbox_label: Work, sent_count: 14, last_sent_at: "{{at:now-94h}}", recent_subjects: [Q3 forecast, Board deck numbers, Hiring plan], received_count: 22, domain_match: true }
          - { mailbox: personal, mailbox_label: Personal, sent_count: 0, last_sent_at: null, recent_subjects: [], received_count: 0, domain_match: false }
    # What the handler returns for this evidence (chosenAccountFields; the stub-shape test checks
    # each verdict against the evidence above): the note only with the topic asserted.
    - match: { mailbox: work, topic_matches_account: true }
      return: { draft_id: draft-r7f3a9c2, mailbox: work, evidence: agrees, account_note: "The mail history and the topic you confirmed both point to this account, so the choice was not in doubt: leave the account out of what you report (no account or calendar line, no account name or address). Still relay any warnings." }
    - match: { mailbox: work }
      return: { draft_id: draft-r7f3a9c2, mailbox: work, mailbox_label: Work, evidence: agrees }
    - match: { mailbox: personal }
      return: { draft_id: draft-r4b81d6e, mailbox: personal, mailbox_label: Personal, evidence: leans_other }
  # Looking Dana up in the mail (agents/ceo-inbox.yaml: find a recipient with ceo-inbox-search)
  # finds the work thread with her; every such search and listing is answered, never refused.
  ceo-inbox-search:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 0, drafts: [] }
    - match: {}
      return:
        count: 2
        messages:
          - { id: msg-46a-1, threadId: thr-46a-q3, mailbox: work, mailbox_label: Work, from: [{ name: Dana Whitfield, email: dana.whitfield@work.example.test }], subject: "Re: Q3 forecast", date: "{{at:now-96h}}", snippet: "Updated forecast attached.", unread: false, folders: [INBOX] }
          - { id: msg-46a-2, threadId: thr-46a-q3, mailbox: work, mailbox_label: Work, from: [{ email: principal@work.example.test }], subject: Q3 forecast, date: "{{at:now-94h}}", snippet: "Dana, can you send the updated forecast?", unread: false, folders: [SENT] }
  ceo-inbox-list:
    - match: { folder: DRAFTS }
      return: { folder: DRAFTS, count: 0, drafts: [] }
    - match: {}
      return: { count: 0, messages: [], has_more: false }
expected_behaviors:
  - id: composes_in_work
    weight: critical
    description: Creates the draft in the work mailbox.
    check:
      called: ceo-inbox-draft-compose
      with: { mailbox: work }
      min: 1
  - id: no_personal_draft
    weight: critical
    description: Creates no draft in the personal mailbox.
    check:
      not_called: [ceo-inbox-draft-compose]
      with: { mailbox: personal }
  - id: account_not_mentioned
    weight: important
    description: >
      The reply does not name or ask about the account: the evidence all pointed to work, so this
      was no judgement call. Any naming of the principal's account is a miss, in a sentence or in
      a field: "in the Work mailbox", "from your work account", "(Work account)", "Mailbox: work".
      Saying the draft is saved, and giving Dana's own address, is fine.
  - id: account_not_announced
    weight: important
    description: >
      The reply has no phrase or field that names the account, such as "from your work account"
      or "Mailbox: Work" (a code check beside the judged one).
    check:
      reply_excludes:
        - '\b(from|in|using|via) (your |the )?(work|personal)( account| mailbox| email)?\b'
        - '\b(work|personal)\**\s+(account|calendar|mailbox|inbox)\b'
        - '\b(calendar|account|mailbox)\**\s*[:=]?\s*\**\s*`?(work|personal)\b'
        - '\|\s*\**(account|calendar|mailbox)\**\s*\|\s*\**`?(work|personal)\b'
        - 'principal@work\.example\.test'
failure_modes:
  - Composes in the personal mailbox
  - Asks the principal which account to use although the evidence was one-sided
  - Calls ceo-inbox-send-draft
