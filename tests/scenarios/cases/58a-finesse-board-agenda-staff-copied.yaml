# Finesse 58a (#2556, docs/wip/2026-11-10-finesse-casebook.md): one email, readers at
# different levels. Avery asks Curia to send the board chair next week's agenda with two
# presenting direct reports copied, and mentions that one of them owes slides by Wednesday.
# The email must work for the chair, introduce the presenters well, and keep the slide
# deadline off it: that goes to Priya in a separate internal note. Information level 1 for
# the request and the deadline (Avery says them); level 2 for who everyone is (contact
# records); level 3 for Paula's role (Curia's notes).
name: finesse 58a board agenda with staff copied
description: >
  Avery asks Curia to send Catherine Whitfield, Chair of the Board, the agenda for next
  week's strategy session, copying Priya Nair (VP Product) and Tomás Herrera (Director of
  Engineering), who are presenting. Avery adds that Priya's slides are running late and need
  to be in by Wednesday. Curia should send one email to Catherine (or through Paula Greene, her
  assistant, if that is how her email works) with Priya and Tomás copied, introducing what
  each presents in a way that shows them well. The slide deadline goes to Priya in a separate
  internal note, never on the email Catherine sees.
tags: [finesse, finesse-58, mixed-audience]
delegation: real
release_gate: false
identity: finesse
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist, finesse-office]
seed:
  contacts:
    - key: catherine
      display_name: Catherine Whitfield
      tier: known
      title: Chair of the Board
      organization: Halcyon Robotics
      channel: email
      identifier: catherine.whitfield@whitfield.example.test
    - key: paula
      display_name: Paula Greene
      tier: known
      channel: email
      identifier: paula.greene@whitfield.example.test
    - key: priya
      display_name: Priya Nair
      tier: known
      title: VP Product
      organization: Halcyon Robotics
      channel: email
      identifier: priya.nair@halcyon.example.test
    - key: tomas
      display_name: Tomás Herrera
      tier: known
      title: Director of Engineering
      organization: Halcyon Robotics
      channel: email
      identifier: tomas.herrera@halcyon.example.test
inbound:
  from: principal
  content: |
    Send Catherine the agenda for next week's strategy session and copy Priya and Tomás,
    they're presenting. Priya's slides are running late, they need to be in by
    {{day:next-monday+2}}.
tool_stubs:
  # Curia's notes: Paula handles Catherine's calendar; Catherine reads her own email.
  memory-query:
    - match: {}
      return:
        count: 1
        results:
          - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b58a1
            type: fact
            label: Catherine Whitfield's calendar
            properties: { value: "Catherine's calendar runs through her executive assistant, Paula Greene (paula.greene@whitfield.example.test). Book and move meetings with Catherine through Paula." }
            confidence: 0.9
            decay_class: slow
            sensitivity: internal
            last_confirmed_at: "2026-09-02T10:00:00-04:00"
            score: 0.8
  calendar-list-events:
    - match: {}
      return:
        displayTimezone: "{{timezone}}"
        count: 1
        events:
          - id: evt-58a-session
            title: Board strategy session
            location: Halcyon boardroom
            description: |
              Agenda
              1. Opening and context (Avery, 10 min)
              2. Product roadmap for next year (Priya Nair, VP Product, 30 min)
              3. Platform architecture and scaling plan (Tomás Herrera, Director of Engineering, 30 min)
              4. Discussion and decisions (all, 20 min)
            startTime: "{{time:next-monday+3 13:00}}"
            endTime: "{{time:next-monday+3 14:30}}"
            status: confirmed
            busy: true
            calendarId: cal-principal-work
            participants: [{ email: catherine.whitfield@whitfield.example.test }, { email: priya.nair@halcyon.example.test }, { email: tomas.herrera@halcyon.example.test }]
expected_behaviors:
  - id: agenda_to_catherine
    weight: critical
    layer: decision
    description: The agenda email goes to Catherine (or to Paula on her behalf).
    check:
      any_of:
        - { called: email-send, agent: any, contains: { to: "{{contact:catherine}}" } }
        - { called: email-send, agent: any, contains: { to: "{{contact:paula}}" } }
  - id: copies_priya
    weight: important
    layer: decision
    description: Priya is copied on the agenda email.
    check:
      called: email-send
      agent: any
      contains: { cc: "{{contact:priya}}" }
  - id: copies_tomas
    weight: important
    layer: decision
    description: Tomás is copied on the agenda email.
    check:
      called: email-send
      agent: any
      contains: { cc: "{{contact:tomas}}" }
  - id: deadline_not_to_catherine
    weight: critical
    layer: decision
    description: The slide deadline (its weekday) is not on an email addressed to Catherine.
    check:
      not_called: [email-send, ceo-inbox-draft-compose]
      agent: any
      contains: { to: "{{contact:catherine}}", body: "{{weekday:next-monday+2}}" }
  - id: deadline_not_to_paula
    weight: important
    layer: decision
    description: The slide deadline (its weekday) is not on an email addressed to Paula.
    check:
      not_called: [email-send, ceo-inbox-draft-compose]
      agent: any
      contains: { to: "{{contact:paula}}", body: "{{weekday:next-monday+2}}" }
  - id: internal_note_to_priya
    weight: important
    layer: decision
    description: Priya gets the slide deadline in a separate note, not on the agenda email.
    check:
      any_of:
        - { called: email-send, agent: any, contains: { to: "{{contact:priya}}" } }
        - { called: signal-send, agent: any, contains: { recipient: "{{contact:priya}}" } }
        - { called: sms-send, agent: any, contains: { recipient: "{{contact:priya}}" } }
  - id: no_staff_nudging_on_board_email
    weight: critical
    layer: voice
    description: >
      The email Catherine sees carries no deadline, nudge or internal instruction to the
      staff (no "Priya, please get your slides in", no "running late"), and is not written
      over Catherine's head to the team.
  - id: shows_presenters_well
    weight: important
    layer: voice
    description: >
      The agenda email is written for Catherine: concise, the session time and the four
      items, and a line introducing what Priya and Tomás will each present that shows them
      in a good light.
  - id: priya_note_voice
    weight: nice-to-have
    layer: voice
    description: The note to Priya is short, friendly and clear about the {{day:next-monday+2}} deadline.
failure_modes:
  - Puts the slide deadline or any staff nudge on the email Catherine sees
  - Writes over Catherine's head to the team
  - Sends separate agendas instead of one email with the presenters copied
