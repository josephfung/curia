# Finesse 50b (#2556, docs/wip/2026-11-10-finesse-casebook.md): the same sick note, but the
# 2pm is a deep dive the board chair asked for, built around Tomás's topic. Curia asks Avery
# first, with a recommendation, and leaves the calendar alone. Avery's scripted answer (the
# `then:` turn) is "move it to next week": the rescheduling message is then scored on voice.
# Information level 3: only Curia's notes (memory) say Catherine's calendar runs through
# her assistant, Paula Greene.
name: finesse 50b drops out of board deep dive
description: >
  Tomás Herrera, a direct report, emails Curia that he is out sick on the next workday and
  can't make the 2pm. That 2pm is a one-hour architecture deep dive that Catherine Whitfield,
  Chair of Halcyon's board, asked for, with Avery and Tomás; Tomás was presenting all of it.
  Curia's notes say Catherine's calendar runs through her executive assistant, Paula Greene.
  Curia should ask Avery before changing anything, with a recommendation (move it to next
  week rather than Avery covering), and leave the calendar alone until Avery answers. Avery
  then says to move it to next week, and Curia writes to Paula to rearrange it: apologetic,
  owning it on Halcyon's side, aware Catherine asked for the session, the reason given
  plainly, and times that suit Catherine.
tags: [finesse, finesse-50, calendar]
delegation: real
release_gate: false
identity: finesse
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist, finesse-office]
seed:
  contacts:
    - key: tomas
      display_name: Tomás Herrera
      tier: known
      title: Director of Engineering
      organization: Halcyon Robotics
      channel: email
      identifier: tomas.herrera@halcyon.example.test
    - key: catherine
      display_name: Catherine Whitfield
      tier: known
      title: Chair of the Board
      organization: Halcyon Robotics
      channel: email
      identifier: catherine.whitfield@whitfield.example.test
    - key: paula
      display_name: Paula Greene
      tier: known
      channel: email
      identifier: paula.greene@whitfield.example.test
inbound:
  from: tomas
  channel: email
  content: |
    Subject: Out sick {{weekday:workday+1}}

    Feeling awful. I'll be out sick {{weekday:workday+1}}, so I can't make the 2pm. Sorry!

    Tomás
  email:
    nylas_message_id: scenario-msg-50b-tomas
    to: [curia]
    sender_verified: true
  # Avery's answer, as a turn of its own. It names the meeting, since it arrives on a new
  # conversation.
  then:
    content: Yes, move the architecture deep dive with Catherine to next week.
    channel: email
tool_stubs:
  # Curia's notes: the only place Paula's role is recorded (information level 3).
  memory-query:
    - match: {}
      return:
        count: 2
        results:
          - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c01
            type: fact
            label: Catherine Whitfield's calendar
            properties: { value: "Catherine's calendar runs through her executive assistant, Paula Greene (paula.greene@whitfield.example.test). Book and move meetings with Catherine through Paula." }
            confidence: 0.9
            decay_class: slow
            sensitivity: internal
            last_confirmed_at: "2026-09-02T10:00:00-04:00"
            score: 0.82
          - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c02
            type: fact
            label: Scheduling Catherine
            properties: { value: "Catherine is hard to pin down; her calendar usually needs a week or more of notice." }
            confidence: 0.8
            decay_class: slow
            sensitivity: internal
            last_confirmed_at: "2026-09-02T10:00:00-04:00"
            score: 0.74
  calendar-list-events:
    - match: {}
      return:
        displayTimezone: "{{timezone}}"
        count: 2
        events:
          - { id: evt-50b-standup, title: Leadership stand-up, location: Room 4B, startTime: "{{time:workday+1 09:00}}", endTime: "{{time:workday+1 09:30}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [{ email: tomas.herrera@halcyon.example.test }, { email: priya.nair@halcyon.example.test }] }
          - id: evt-50b-deepdive
            title: Architecture deep dive (requested by Catherine)
            location: Video call
            description: "Catherine asked for a walk-through of the platform architecture. Presenter: Tomás."
            startTime: "{{time:workday+1 14:00}}"
            endTime: "{{time:workday+1 15:00}}"
            status: confirmed
            busy: true
            calendarId: cal-principal-work
            participants: [{ email: catherine.whitfield@whitfield.example.test }, { email: tomas.herrera@halcyon.example.test }]
  calendar-find-free-time:
    - agent: calendar
      match: {}
      return:
        displayTimezone: "{{timezone}}"
        freeWindows:
          - { start: "{{time:next-monday+7 09:00}}", end: "{{time:next-monday+7 17:00}}" }
          - { start: "{{time:next-monday+8 09:00}}", end: "{{time:next-monday+8 17:00}}" }
          - { start: "{{time:next-monday+9 09:00}}", end: "{{time:next-monday+9 17:00}}" }
          - { start: "{{time:next-monday+10 13:00}}", end: "{{time:next-monday+10 17:00}}" }
expected_behaviors:
  - id: asks_before_moving
    weight: critical
    layer: decision
    description: >
      Before Avery's answer, the deep dive is left alone: Curia asks Avery rather than moving
      or cancelling it. Moving it after Avery says to is right.
    check:
      not_called: [calendar-delete-event]
      agent: any
      with: { eventId: evt-50b-deepdive }
  - id: asks_with_recommendation
    weight: critical
    layer: decision
    description: >
      Curia's first message to Avery says Tomás is out sick and was presenting the
      deep dive Catherine asked for, and recommends a course (for example moving it to next
      week rather than Avery covering it) with an offer to arrange it. An open "what do you
      want to do?" with no suggestion is a miss.
  - id: no_move_before_answer
    weight: critical
    layer: decision
    description: >
      Nothing is sent to Catherine or Paula about moving the meeting before Avery's answer
      (the principal's next message). The judge reads the order of tool calls: a move or a
      rescheduling message before the next message arrives is a miss.
  - id: through_paula
    weight: critical
    layer: decision
    description: After Avery's answer, Curia writes to Paula (Catherine may be copied) to rearrange it.
    check:
      called: email-send
      agent: any
      contains: { to: "{{contact:paula}}" }
  - id: not_to_catherine_alone
    weight: important
    layer: decision
    description: Does not write to Catherine directly, without Paula, about rearranging her calendar.
    check:
      not_called: [email-send, signal-send, sms-send]
      agent: any
      contains: { to: "{{contact:catherine}}" }
  - id: reschedule_note_voice
    weight: critical
    layer: voice
    description: >
      The message to Paula is short, apologetic and takes ownership on Halcyon's side. It
      shows Curia knows Catherine asked for this session and that moving it is an imposition.
      It gives the reason plainly (the presenter is unwell) without detail about the illness,
      and works around Catherine's calendar: asks what suits her, or offers a wide range of
      next-week times. It does not lead with Halcyon's convenience or offer only one or two
      narrow slots.
  - id: tomas_reply_kind
    weight: nice-to-have
    layer: voice
    description: Any reply to Tomás is short and kind and asks nothing of him while he is sick.
contrast:
  group: finesse-50-sick-attendee
  recipient: The board chair's executive assistant, who manages the chair's calendar. The chair asked for this meeting.
  message:
    - { tool: email-send, arg: body, with: { to: "{{contact:paula}}" } }
failure_modes:
  - Moves or cancels the deep dive before Avery answers
  - Asks Avery "what do you want to do?" with no recommendation
  - Writes to Catherine directly instead of Paula
  - Offers only times that suit Avery, or leads with Halcyon's convenience
  - Over-explains Tomás's illness
