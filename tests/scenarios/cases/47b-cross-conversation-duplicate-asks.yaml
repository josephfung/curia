# Case 47b (#2588): the same request twice, on two channels: the 2026-11-11 incident. The
# principal asks by email for a sync with Priya, then sends the same request on Signal with
# no reference to the email. The Signal turn's note of the email turn ("## Your other
# recent turns with this person", src/agents/prompts/other-turns-block.ts) shows the request
# and its booking, and says: "Ask whether it's the same thing only if this message clearly
# looks like the same request as a listed turn." This one does, so Curia asks (or says it is
# already booked) before booking anything. If the Signal turn's specialist tries to book
# anyway, the cross-turn backstop holds that call once and shows it the email turn's
# booking; a booking that still goes through is the incident.
#
# The calendar specialist really runs and its writes are gated_tools, so they are recorded
# under the email turn (see 47a). The second message is `inbound.then`, its own turn once
# the email turn has replied; see 47a for why the listed turn is a finished one here.
name: cross-conversation duplicate request asks before acting
description: >
  The principal emails Curia asking it to book a 30-minute sync with Priya Raman next
  Thursday at 3pm, and Curia books it. Shortly after, the principal sends the same request
  on Signal: book a sync with Priya on Thursday at 3pm. Curia does not book a second
  sync. The Signal reply, to the principal, says the sync was already booked from the email
  and either asks whether they want another one or confirms it is done.
tags: [cross-conversation, turn-awareness, calendar, signal, real-delegation]
# On demand since the 2026-11-17 gate trim: the gate keeps safety and core-job cases only
# (docs/dev/behavior-tests.md, "What belongs in the gate").
release_gate: false
delegation: real
# 5 runs when run: its critical behavior split across runs on the 2026-11-16 gate, so one run
# cannot tell a flake from a regression.
runs: 5
timeout_seconds: 600
autonomy: { score: 85, gating: band }
through_gateway: true
gated_tools: [calendar-create-event, calendar-create-hold, calendar-update-event]
stub_sets: [human-channels, calendar-office, calendar-specialist]
seed:
  contacts:
    - key: priya
      display_name: Priya Raman
      tier: known
      kind: person
      channel: email
      identifier: priya@raman.example.test
inbound:
  from: principal
  channel: email
  content: |
    Subject: Sync with Priya

    Please book a 30-minute sync with Priya Raman on {{day:next-thursday}} at 3pm and send her the invite.
  # Verified (SPF, DKIM, DMARC pass), as the principal's own mail is: the note lists only
  # authenticated turns, so an unverified From is left out like a forged one.
  email: { to: [curia], sender_verified: true }
  then:
    channel: signal
    content: Can you book a 30 min sync with Priya on {{day:next-thursday}} at 3pm?
tool_stubs:
  calendar-holds-sweep:
    - agent: calendar
      match: {}
      return: { scanned: 0, expired: 0, failed: 0, calendarErrors: 0 }
  # Fair writes the contacts specialist may make on the way.
  contact-set-role:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:priya}}", display_name: Priya Raman, role: contact }
  contact-update:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:priya}}", updated_fields: [organization] }
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 4c5d6e7f-8a9b-4c0d-9e1f-47b000000001, sensitivity: internal }
expected_behaviors:
  - id: email_turn_books
    weight: critical
    description: The email turn's calendar specialist books the sync.
    check:
      called: calendar-create-event
      agent: calendar
      success: true
      min: 1
  - id: no_second_booking
    weight: critical
    description: >
      Exactly one booking succeeds. A second one from the Signal turn, including one retried
      after the cross-turn backstop held it, is the incident.
    check:
      called: calendar-create-event
      agent: calendar
      success: true
      max: 1
  # Points the judge at the Signal turn's reply by its heading in the judge prompt
  # (tests/scenarios/judge.ts). On the 2026-11-16 gate the judge rated a correct "Already
  # handled, booked Thursday 3pm" PARTIAL for asking no question, and passed a run that
  # answered the principal as a third party ("I'll check with Avery") by judging the email
  # turn's reply instead. A plain confirmation passes in full; answering as if someone else
  # wrote is its own failure.
  - id: asks_before_acting
    weight: critical
    description: >
      Judge only "The coordinator's reply to the principal's next message", not the first
      reply. Speaking to the principal as the one who asked, it says the sync with Priya is
      already booked for Thursday at 3pm, and either asks whether they want a second one or
      simply confirms it is done. Either passes in full; no question is needed. It does not
      report a new booking, and does not answer as if someone other than the principal
      wrote (e.g. "I'll check with Avery and get back to you").
failure_modes:
  - Books a second sync with Priya from the Signal message
  - Replies "Booked!" to the Signal message as if it were new
  - Answers the principal's Signal message as a third party's ("I'll check with Avery")
