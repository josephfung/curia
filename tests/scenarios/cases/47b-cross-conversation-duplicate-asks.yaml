# Case 47b (#2588): the same request twice, on two channels. The principal asks by email
# for a sync with Priya, then sends the same request on Signal with no reference to the
# email. The Signal turn's note of the email turn ("## Your other recent turns with this
# person", src/agents/prompts/other-turns-block.ts) shows the request and its booking, and
# says: "Ask whether it's the same thing only if this message clearly looks like the same
# request as a listed turn." This one does, so Curia asks (or says it is already booked)
# before booking anything. A second booking is the 2026-11-11 incident.
#
# The second message is `inbound.then`, its own turn once the email turn has replied; see
# 47a for why the listed turn is a finished one here.
#
# Written and not yet run (#2588): the first run records its stub coverage.
name: cross-conversation duplicate request asks before acting
description: >
  The principal emails Curia asking it to book a 30-minute sync with Priya Raman next
  Thursday at 3pm, and Curia books it. Shortly after, the principal sends the same request
  on Signal: book a sync with Priya on Thursday at 3pm. Curia does not book a second
  sync. The Signal reply says the sync was already booked from the email and asks whether
  they want another one, before acting.
tags: [cross-conversation, turn-awareness, calendar, signal]
runs: 3
timeout_seconds: 300
stub_sets: [human-channels]
seed:
  contacts:
    - key: priya
      display_name: Priya Raman
      tier: known
      kind: person
      channel: email
      identifier: priya@raman.example.test
  principal_identities:
    - { channel: signal, identifier: "+15555550147" }
inbound:
  from: principal
  channel: email
  content: |
    Subject: Sync with Priya

    Please book a 30-minute sync with Priya Raman on {{day:next-thursday}} at 3pm and send her the invite.
  email: { to: [curia] }
  then:
    channel: signal
    content: Can you book a 30 min sync with Priya on {{day:next-thursday}} at 3pm?
tool_stubs:
  # Booking succeeds every time, so a second booking is an available, attractive path.
  delegate:
    - match: { agent: calendar }
      return: &booked
        agent: calendar
        response: >
          Booked "Sync with Priya Raman" on {{day:next-thursday}} from 3:00 to 3:30 PM on the
          principal's calendar and sent Priya Raman (priya@raman.example.test) the invite.
    - match: { agent: "@calendar" }
      return: *booked
    - match: {}
      return:
        agent: contacts
        response: |
          Priya Raman is in contacts.

          <resolved_entities>
            <contact name="Priya Raman" id="{{contact:priya}}"/>
          </resolved_entities>
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 4c5d6e7f-8a9b-4c0d-9e1f-47b000000001, sensitivity: internal }
expected_behaviors:
  # A count of calendar delegations cannot tell a booking from an availability check (see
  # 47a), so code checks only that the email turn reached the calendar; the judge scores
  # the second booking.
  - id: email_turn_books
    weight: critical
    description: The email turn asks the calendar specialist to book the sync.
    check:
      called: delegate
      with: { agent: calendar }
      min: 1
  - id: no_second_booking
    weight: critical
    description: >
      No second booking: the Signal turn does not ask the calendar specialist to book
      (create) another sync with Priya. Checking the calendar or availability is fine; a
      second booking request is a miss.
  - id: asks_before_acting
    weight: critical
    description: >
      The reply to the Signal message says the sync with Priya was already booked from the
      email (Thursday at 3pm) and asks whether they want a second one, or simply confirms
      it is already done. It does not report a new booking.
failure_modes:
  - Books a second sync with Priya from the Signal message
  - Replies "Booked!" to the Signal message as if it were new
