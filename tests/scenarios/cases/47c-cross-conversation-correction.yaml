# Case 47c (#2588): a correction on another channel. The principal asks by email for a sync
# with Priya on Thursday; then, on Signal, says to make it Friday instead. The Signal
# conversation has no history of the request: the only context is the note of the email
# turn ("## Your other recent turns with this person", src/agents/prompts/other-turns-block.ts),
# with the request and its booking. The email turn has finished, so the hand-off is not
# available and the Signal turn does the work itself. The note's do-it-yourself copy (and
# turn-handoff's) is "adjust them rather than repeat them": the Thursday booking is moved,
# not joined by a second one, and only one meeting results, on Friday.
#
# The calendar specialist really runs and its writes are gated_tools, so they are recorded
# under the email turn (see 47a). The Signal turn's move targets the same contact, so the
# cross-turn backstop may hold it once and show the email turn's booking; the specialist
# then calls it again unchanged, as the hold says, since a move does not duplicate it.
#
# The second message is `inbound.then`, its own turn once the email turn has replied; see
# 47a. A correction handed into a still-running turn (turn-handoff) is covered by
# tests/integration/cross-conversation-handoff.test.ts; a scenario for it needs the harness
# to start `then` during the first turn.
name: cross-conversation correction moves the booking
description: >
  The principal emails Curia asking it to book a 30-minute sync with Priya Raman next
  Thursday at 3pm, and Curia books it. Shortly after, the principal writes on Signal:
  actually, make the sync with Priya Friday instead, same time. Curia has the calendar
  specialist move the Thursday sync to Friday at 3pm rather than book a second meeting, and
  the Signal reply confirms the sync is now on Friday.
tags: [cross-conversation, turn-awareness, calendar, signal, real-delegation]
delegation: real
# On demand: tests/scenarios/README.md, "Which real-delegation cases gate a release".
release_gate: false
runs: 3
timeout_seconds: 600
autonomy: { score: 85, gating: band }
through_gateway: true
gated_tools: [calendar-create-event, calendar-create-hold, calendar-update-event]
stub_sets: [human-channels, calendar-office, calendar-specialist]
seed:
  contacts:
    - key: priya
      display_name: Priya Raman
      tier: known
      kind: person
      channel: email
      identifier: priya@raman.example.test
  principal_identities:
    - { channel: signal, identifier: "+15555550147" }
inbound:
  from: principal
  channel: email
  content: |
    Subject: Sync with Priya

    Please book a 30-minute sync with Priya Raman on {{day:next-thursday}} at 3pm and send her the invite.
  # Verified (SPF, DKIM, DMARC pass), as the principal's own mail is: the note lists only
  # authenticated turns, so an unverified From is left out like a forged one.
  email: { to: [curia], sender_verified: true }
  then:
    channel: signal
    content: Actually, make the sync with Priya Friday instead, same time.
tool_stubs:
  calendar-holds-sweep:
    - agent: calendar
      match: {}
      return: { scanned: 0, expired: 0, failed: 0, calendarErrors: 0 }
  # Fair writes the contacts specialist may make on the way.
  contact-set-role:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:priya}}", display_name: Priya Raman, role: contact }
  contact-update:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:priya}}", updated_fields: [organization] }
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 4c5d6e7f-8a9b-4c0d-9e1f-47c000000001, sensitivity: internal }
expected_behaviors:
  - id: email_turn_books
    weight: critical
    description: The email turn's calendar specialist books the Thursday sync.
    check:
      called: calendar-create-event
      agent: calendar
      success: true
      min: 1
  - id: asks_calendar_for_friday
    weight: critical
    description: >
      The calendar specialist is briefed for the sync on Friday, the day after the booked
      Thursday, by weekday or by date.
    check:
      any_of:
        - { briefed: calendar, brief_contains: [friday] }
        - { briefed: calendar, brief_contains: ["{{date:next-thursday+1}}"] }
  - id: moves_the_event
    weight: critical
    description: >
      The Thursday sync is moved (updated) or cancelled; a Friday sync booked beside it,
      leaving Thursday's in place, is a second booking.
    check:
      called: [calendar-update-event, calendar-delete-event]
      agent: calendar
      success: true
      min: 1
  - id: one_sync_results
    weight: critical
    description: >
      One sync with Priya results, on Friday at 3pm: the Thursday one was moved, or
      cancelled and replaced. No Friday sync sits beside a Thursday one that is still in
      place.
  - id: confirms_friday
    weight: important
    description: >
      The reply to the Signal message confirms the sync with Priya is now on Friday at 3pm,
      without asking which meeting they meant.
failure_modes:
  - Books a second sync on Friday and leaves Thursday's in place
  - Asks the principal which sync they mean, though the note lists it
  - Says it does not know of any sync with Priya
